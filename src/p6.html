<script>
/* ---------- GD Arena: individual practice + scheduled group sessions (no hosting) ---------- */
const GD_CAP=6,GD_LEN=6*60e3,GD_LOBBY=10*60e3,GD_WRAP=90e3,GD_SLOT=30*60e3,GD_SOLO=180;
const GD_CATS2=[["random","Random topics"],["ai","Artificial Intelligence"],["current","Current Affairs"],["faq","Frequently Asked GD Topics"]];
const GD_BANK={
 ai:["Will AI create more jobs than it replaces?","Should AI-generated content be labelled by law?","Is AI a threat to creative professions?","Should students be allowed to use AI tools in exams and assignments?","Can AI make hiring decisions fairer than humans?","Who is responsible when an AI system makes a harmful mistake?","Will AI widen the gap between rich and poor countries?","Should governments regulate AI before it becomes more powerful?","Is it safe to rely on AI for medical advice?","Will AI make managers redundant?","Should AI be used for surveillance in public places?","Are AI chatbots a good substitute for human customer service?","Can machines ever be truly creative?","Should children learn to code or learn to work with AI first?","Is the AI boom a bubble?","Should companies disclose when AI is used to screen candidates?","Deepfakes: how should society respond?","Will AI tutors replace classroom teaching?","Is data privacy the price we pay for AI progress?","Should AI development be slowed down for safety?"],
 current:["India's push for domestic manufacturing: opportunity or overreach?","Is the gig economy good for workers?","Climate change: should developing countries bear the same burden as developed ones?","Should India adopt a four-day work week?","Digital payments and the cashless economy: has India gone far enough?","Is remote work harming company culture?","Electric vehicles: is India ready for the transition?","Should social media be regulated for teenagers?","Are startups overvalued in India?","Urbanisation: are Indian cities becoming unliveable?","Is the Indian education system preparing students for the job market?","Should there be a one-nation-one-election system?","Inflation and interest rates: who gets hurt most?","Food delivery and quick commerce: convenience or a social cost?","Should India invest more in renewable energy than in coal?","Is brain drain still a problem for India?","Subsidies versus targeted cash transfers","Globalisation versus protectionism","Mental health in the workplace: whose responsibility?","Are sports and entertainment getting too commercial?"],
 faq:["Is an MBA still worth it?","Startups versus corporate jobs: which is a better start to a career?","Work-life balance: myth or reality?","Social media: boon or bane?","Is a college degree still necessary to succeed?","Should freshers be paid based on skills or degrees?","Is experience more important than education?","Leadership: are leaders born or made?","Is competition healthy in a workplace?","Should companies hire for attitude or aptitude?","Is multitasking a skill or a myth?","Ethics versus profit in business","Is hustle culture healthy?","Should marks decide a student's future?","Do women face a glass ceiling in corporate India?","Is the customer always right?","Cash versus digital: the future of money","Is failure necessary for success?","Work from home versus work from office","Should management education include more ethics and sustainability?","Brand loyalty is dead","Is entrepreneurship for everyone?","Does a high salary guarantee job satisfaction?","Should companies be held accountable for employee well-being?","Is the education loan culture harming students?"]};
const gdCatLabel=c=>c==="company"?"Company-based (web research)":(GD_CATS2.find(x=>x[0]===c)||[0,"Random topics"])[1];
function gdTopicForSlot(slot,pref){const idx=Math.round(slot/GD_SLOT);const keys=["ai","current","faq"];const c=(pref&&pref!=="random")?pref:keys[idx%3];const b=GD_BANK[c];const off=(pref&&pref!=="random")?idx:Math.floor(idx/3);return{cat:c,topic:b[((off%b.length)+b.length)%b.length]}}
const TZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"your local time"}catch(e){return"your local time"}})();
const tfmt=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dfmt=t=>new Date(t).toLocaleDateString([],{weekday:"short",day:"numeric",month:"short"});
const myId=()=>VIEW.me&&VIEW.me.id;
const myName=()=>((VIEW.me&&VIEW.me.name)||(S.user&&S.user.name)||"Participant").slice(0,40);
function gdDays(){const o=[],d0=new Date();d0.setHours(0,0,0,0);for(let i=0;i<7;i++){const d=new Date(d0);d.setDate(d0.getDate()+i);o.push(d.getTime())}return o}
function gdSlots(day){const end=new Date(day);end.setDate(end.getDate()+1);const o=[];for(let t=Math.ceil(day/GD_SLOT)*GD_SLOT;t<end.getTime();t+=GD_SLOT){const d=new Date(t),h=d.getHours()+d.getMinutes()/60;if(h>=8&&h<=22)o.push(t)}return o}
const gdPhaseOf=(t,n=Date.now())=>n<t-GD_LOBBY?"upcoming":n<t?"lobby":n<t+GD_LEN?"live":n<t+GD_LEN+GD_WRAP?"wrap":"after";

/* shared data: seats, meeting links, topics (gdbookings) and transcripts, locks, evaluations (gdreports) */
let GDB=[],GDR=[],gdUnsubs=[];
function gdSub(onChange){gdUnsubs.forEach(u=>u());gdUnsubs=[];if(!VIEW.db)return;
 try{gdUnsubs.push(VIEW.db.collection("gdbookings").onSnapshot(s=>{GDB=s.docs.map(d=>({id:d.id,...d.data()}));onChange()},()=>{}));
  gdUnsubs.push(VIEW.db.collection("gdreports").onSnapshot(s=>{GDR=s.docs.map(d=>({id:d.id,...d.data()}));onChange()},()=>{}))}catch(e){}}
const seats=slot=>GDB.filter(d=>d.kind==="seat"&&d.slot===slot).sort((a,b)=>a.n-b.n);
const mySeat=slot=>seats(slot).find(d=>d.uid===myId());
const gdNeedDb=window.ROLEVIA_SITE?`<div class="note"><b>Group sessions are not switched on for this site yet.</b> Live booking needs the site database (Supabase) to be connected by the site owner, and you need to be signed in with a site account. Booking is switched off rather than faked. Individual practice works without it.</div>`:`<div class="note"><b>Group sessions need the shared database and your claude.ai sign-in.</b> They are not available in this view. Open the page signed in to claude.ai to book and join. Individual practice works without it.</div>`;

/* ---------- GD home: two options ---------- */
R(/^\/gd$/,()=>({private:true,nav:"/gd",title:"GD Arena",html:`${head("GD practice","Practise group-discussion topics on your own and get strict AI feedback.")}
<div class="grid g2"><div class="card stack lg"><h3>Individual GD practice</h3><p class="muted">Practise GD topics on your own, improve your communication, and receive AI-powered feedback on your performance.</p><ul class="small muted" style="margin:0;padding-left:18px"><li>Pick a category, a random topic, or a topic built from a company you name</li><li>Speak on it through your microphone</li><li>Score out of 100 with evidence-based feedback</li><li>Uses 1 GD practice session from your account</li></ul><div>${A("/gd/practice","Start GD practice","btn pri")}</div></div></div>`,mount:()=>{}}));
/* group GD slot booking has been removed: old links go back to the GD page */
R(/^\/gd\/group(?:\/\d+)?$/,()=>({private:true,nav:"/gd",title:"GD Arena",html:`<div class="empty"><h3>Group GD booking is no longer available</h3><p class="muted">You can still practise GDs on your own with AI feedback.</p><p style="margin-top:10px">${A("/gd","GD practice","btn pri")}</p></div>`,mount:()=>{}}));

/* ---------- Option A: individual practice ---------- */
const SOLO={stage:"choose",cat:"random",topic:"",tcat:"",text:"",left:0,tm:null,err:"",res:null,secs:0};
function soloReset(){lStop();clearInterval(SOLO.tm);Object.assign(SOLO,{stage:"choose",topic:"",text:"",err:"",res:null,left:0,secs:0})}
R(/^\/gd\/practice$/,()=>({private:true,nav:"/gd",title:"Individual GD practice",html:`${crumbs([["/gd","GD Arena"],[null,"Individual practice"]])}<div id="solo"></div>`,mount:()=>{if(SOLO.stage==="prep"||SOLO.stage==="speak")soloReset();if(SOLO.stage==="analyse")SOLO.stage=SOLO.res?"result":"choose";drawSolo();return()=>{lStop();clearInterval(SOLO.tm);stopSpeak()}}}));
function pickSolo(cat){const keys=["ai","current","faq"];const seen=S.gdSeen=Array.isArray(S.gdSeen)?S.gdSeen:[];
 const pool=(cat==="random"?keys:[cat]).flatMap(k=>GD_BANK[k].map(t=>({t,k})));let fresh=pool.filter(x=>!seen.includes(x.t));if(!fresh.length){S.gdSeen=seen.filter(t=>!pool.some(x=>x.t===t));fresh=pool}
 const p=fresh[Math.floor(Math.random()*fresh.length)];S.gdSeen.push(p.t);S.gdSeen=S.gdSeen.slice(-60);save();return p}
function drawSolo(){const el=$("#solo");if(!el)return;const st=SOLO.stage;let h="";
 if(!SR||!TTS&&false)h=`<div class="note bad" role="alert"><b>This browser cannot capture speech.</b> ${SRERR.unsupported} Speaking is required for GD practice.</div>`;
 if(st==="choose")h+=`${head("Individual GD practice","Choose a category. You get one topic at a time.")}<div class="card stack lg"><div class="grid g2">${[...GD_CATS2,...(WEB_ON()?[["company","Company-based"]]:[])].map(([k,l])=>`<button class="card stack" style="text-align:left;cursor:pointer;${SOLO.cat===k?"border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)":""}" data-act="solocat" data-c="${k}" aria-pressed="${SOLO.cat===k}"><b>${l}</b><span class="small muted">${k==="random"?"A surprise topic from every category":k==="ai"?"Technology, ethics and the future of work":k==="current"?"Economy, society and public policy":k==="company"?"A topic from current web research on a company you name (with sources)":"Topics that keep coming up in placements, MBA admissions and interviews"}</span></button>`).join("")}</div>${SOLO.cat==="company"?`<div class="field"><label for="soloco">Company</label><input id="soloco" value="${esc(SOLO.co||(typeof SU!=="undefined"&&SU.v&&SU.v.company)||"")}" maxlength="80" placeholder="e.g. Zomato" autocomplete="organization"></div>${SOLO.coErr?`<div class="note bad small" role="alert">${esc(SOLO.coErr)}</div>`:""}`:""}<div><button class="btn pri" data-act="solotopic" ${SOLO.busy?"disabled":""}>${SOLO.busy?"Researching…":"Get my topic"}</button></div></div>`;
 else if(st==="topic")h+=`${head("Your topic")}<div class="panel notch stack" style="padding:28px"><span class="pill" style="align-self:flex-start;background:var(--surface);color:var(--ink)">${esc(gdCatLabel(SOLO.tcat))}</span><h2 style="font-size:clamp(22px,4vw,34px)">${esc(SOLO.topic)}</h2></div>
  ${SOLO.tcat==="company"&&SOLO.srcLk?`<div class="note small" style="margin-top:12px">Topic written by AI from current web research on ${esc(SOLO.srcLk.name)} (retrieved ${esc(SOLO.srcLk.retrieved||"")}). Sources: ${SOLO.srcLk.sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>`).join(" · ")}. Check them; the topic is for practice.</div>`:""}
  <div class="note info" style="margin-top:12px">You get 30 seconds to think, then up to ${GD_SOLO/60} minutes to speak. Speak as if you were in a real GD: take a stand, give reasons and examples, and conclude. Your microphone is used for speech recognition; no audio is saved.</div>
  ${SOLO.err?`<div class="note bad" role="alert">${esc(SOLO.err)}</div>`:""}<div class="row" style="margin-top:12px"><button class="btn pri" data-act="soloprep" ${SR?"":"disabled"}>Start</button><button class="btn ghost" data-act="solotopic">Different topic</button><button class="btn ghost" data-act="soloback">Change category</button></div>`;
 else if(st==="prep")h+=`<div class="card stack" style="align-items:center;text-align:center;min-height:360px;justify-content:center"><span class="pill">Think</span><h3 style="max-width:30ch">${esc(SOLO.topic)}</h3><div class="score" style="font-size:56px" id="solot">${fmtClock(SOLO.left)}</div><p class="muted">Prepare your points. Recording starts automatically.</p><button class="btn pri" data-act="soloskipprep">Start speaking now</button></div>`;
 else if(st==="speak")h+=`<div class="card stack" style="align-items:center;text-align:center;min-height:380px;justify-content:center"><h3 style="max-width:30ch">${esc(SOLO.topic)}</h3><div class="mic listen" aria-hidden="true">🎙</div><div class="rec"><i></i> Recording</div><div class="score" style="font-size:48px" id="solot" aria-label="Time left">${fmtClock(SOLO.left)}</div><div class="small muted" id="solowc">${wc(SOLO.text)} words captured</div>${SOLO.err?`<div class="note bad" role="alert">${esc(SOLO.err)}</div>`:""}<div class="row" style="justify-content:center"><button class="btn pri" data-act="solofinish">Finish and get feedback</button><button class="btn ghost" data-act="soloredo">Cancel</button></div></div>`;
 else if(st==="analyse")h+=`<div class="card stack" style="align-items:center;padding:60px 0">${loading("Analysing your response…")}</div>`;
 else if(st==="result")h+=soloResultHtml(SOLO.res);
 el.innerHTML=h}
ACT.solocat=t=>{SOLO.cat=t.dataset.c;drawSolo()};
ACT.solotopic=async()=>{
 if(SOLO.cat==="company"){if(SOLO.busy)return;const co=((($("#soloco")||{}).value)||SOLO.co||"").trim();SOLO.co=co;SOLO.coErr="";
  if(co.length<2){SOLO.coErr="Enter a company name.";return drawSolo()}
  SOLO.busy=true;drawSolo();
  try{const lk=await webLookup(co,"", "");
   if(!lk.found){SOLO.coErr=`We could not verify “${co}” from public web sources, so no company-specific topic was made. Pick another category or check the spelling.`;SOLO.busy=false;return drawSolo()}
   let topic="";try{const r=await ai(`Write ONE group-discussion topic (a debatable statement or question, under 25 words) for ${lk.officialName||co}, based ONLY on these researched facts: business model: ${lk.businessModel||"n/a"}; products: ${(lk.products||[]).join("; ")}; recent developments: ${(lk.recentDevelopments||[]).map(x=>x.item).join("; ")}. It must be debatable with two sides, relevant to the company's industry, and must not state any fact that is not listed. Reply with only JSON: {"topic":""}`,{tier:"quick",cache:false});topic=String(r&&r.topic||"").trim().slice(0,200)}catch(e){}
   if(!topic){const d=(lk.recentDevelopments||[])[0];topic=d?`${lk.officialName||co}: "${d.item}". Is this the right direction? Discuss.`:`What will decide ${lk.officialName||co}'s success in the next five years?`}
   SOLO.topic=topic;SOLO.tcat="company";SOLO.srcLk={name:lk.officialName||co,retrieved:lk.retrieved,sources:(lk.sources||[]).slice(0,4)};SOLO.stage="topic";SOLO.err="";SOLO.busy=false;drawSolo();return}
  catch(e){SOLO.coErr=(e&&e.message)||"Research is unavailable right now.";SOLO.busy=false;return drawSolo()}}
 SOLO.srcLk=null;
 const p=pickSolo(SOLO.cat==="random"&&SOLO.tcat&&false?SOLO.tcat:SOLO.cat);SOLO.topic=p.t;SOLO.tcat=p.k;SOLO.stage="topic";SOLO.err="";drawSolo()};
ACT.soloback=()=>{soloReset();drawSolo()};
ACT.soloredo=()=>{soloReset();SOLO.stage="topic";SOLO.topic=SOLO.lastTopic||SOLO.topic;drawSolo()};
ACT.soloprep=()=>{if(!SR)return;SOLO.err="";SOLO.stage="prep";SOLO.left=30;SOLO.lastTopic=SOLO.topic;drawSolo();clearInterval(SOLO.tm);SOLO.tm=setInterval(()=>{SOLO.left--;const e=$("#solot");if(e)e.textContent=fmtClock(SOLO.left);if(SOLO.left<=0){clearInterval(SOLO.tm);soloSpeak()}},1000)};
ACT.soloskipprep=()=>{clearInterval(SOLO.tm);soloSpeak()};
function soloSpeak(){SOLO.stage="speak";SOLO.left=GD_SOLO;SOLO.text="";SOLO.err="";SOLO.secs=0;drawSolo();
 L.patience=1e9;
 lStart({status:()=>{},sound:()=>{},update:t=>{SOLO.text=t;const e=$("#solowc");if(e)e.textContent=wc(t)+" words captured"},auto:()=>{},quiet:n=>{if(n>=4&&!SOLO.text){soloFail("I am not hearing anything. Check that your microphone is unmuted and selected, then try again.")}},fatal:c=>soloFail(SRERR[c]||SRERR.unsupported)});
 clearInterval(SOLO.tm);SOLO.tm=setInterval(()=>{SOLO.left--;SOLO.secs++;const e=$("#solot");if(e)e.textContent=fmtClock(SOLO.left);if(SOLO.left<=0)ACT.solofinish()},1000)}
function soloFail(msg){lStop();clearInterval(SOLO.tm);SOLO.stage="topic";SOLO.err=msg;drawSolo()}
ACT.solofinish=async()=>{if(SOLO.stage!=="speak")return;lStop();clearInterval(SOLO.tm);const text=(SOLO.text||"").trim(),secs=Math.max(1,SOLO.secs||GD_SOLO-SOLO.left);
 const words=wc(text),fillers=(text.toLowerCase().match(/\b(um+|uh+|er+|erm|like|you know|basically|actually|i mean|sort of|kind of)\b/g)||[]).length;
 const rep={id:uid(),kind:"solo",topic:SOLO.topic,category:gdCatLabel(SOLO.tcat),date:Date.now(),transcript:text,secs,words,wpm:Math.round(words/(secs/60)),fillers};
 if(words<25){rep.limited=true;rep.note=words===0?"No speech was captured. Check your microphone and try again.":"Only "+words+" words were captured, which is too little to assess fairly. Aim for at least 60 seconds of speaking.";SOLO.res=rep;SOLO.stage="result";S.gdReports.unshift(rep);save();drawSolo();return}
 SOLO.stage="analyse";drawSolo();await soloScore(rep)};
/* ----- strict GD scoring: deterministic caps on top of the AI's judgement. Speaking time and confidence are never rewarded. ----- */
const gdNorm=x=>String(x||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function gdMetrics(text,share){const t=String(text||""),w=t.trim()?t.trim().split(/\s+/):[],n=w.length;const lw=w.map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,"")).filter(Boolean);
 const g=[];for(let i=0;i+3<lw.length;i++)g.push(lw.slice(i,i+4).join(" "));const seen=new Set();let dup=0;g.forEach(x=>{if(seen.has(x))dup++;else seen.add(x)});
 const fill=((t.toLowerCase().match(/\b(um+|uh+|erm|you know|kind of|sort of|basically|actually|literally|like)\b/g)||[]).length)/Math.max(1,n);
 return{words:n,rep:g.length?+(dup/g.length).toFixed(2):0,hasNum:/\d/.test(t)||/\b(percent|per cent|crore|lakh|million|thousand)\b/i.test(t),concrete:/\b(for example|for instance|such as|in india|study|data shows|according to|case of)\b/i.test(t),fill:+fill.toFixed(2),share:share==null?null:+share.toFixed(2)}}
/* returns {score, note} for one criterion */
function gdCap(name,score,m,src){if(score==null)return{score:null};let cap=100,why="";const use=(c,w)=>{if(c<cap){cap=c;why=w}};
 if(m.words<60)use(45,"Under 60 words captured: too little to show this skill.");else if(m.words<100)use(60,"Under 100 words captured: limited evidence.");
 if(src==="recap")use(70,"Based on a spoken recap after the discussion: weaker evidence.");
 if(m.rep>=0.2&&/Argument|Critical|Contribution|Content|Depth/i.test(name))use(/Contribution/i.test(name)?50:55,"A large share of the speech repeats earlier phrases.");
 if(!m.hasNum&&!m.concrete&&/Argument|Critical|Examples/i.test(name))use(/Examples/i.test(name)?50:65,"No figure, example or named evidence appears in the speech: claims are unsupported.");
 return{score:Math.min(score,cap),note:score>cap?why:""}}
function gdDominance(rows){const tot=rows.reduce((a,r)=>a+r.words,0)||1;rows.forEach(r=>{r._share=r.words/tot});return rows}
async function soloScore(rep){
 try{const r=await ai(`You are an experienced group-discussion evaluator for placements and MBA admissions. A candidate spoke alone for about ${Math.round(rep.secs)} seconds on the GD topic: "${rep.topic}". Below is the speech-to-text transcript (it may contain recognition errors; ignore spelling, punctuation and missing filler words and judge the content you can see). Judge ONLY what is in the transcript. Do not invent anything the candidate did not say, and do not comment on tone or body language: they cannot be assessed from text. Be STRICT, like a real panel: 50 is a generic but reasonable point; 70+ needs a clear stance, reasoning, and a concrete example or fact; 85+ is rare. Penalise vague statements, unsupported claims, repetition, irrelevance, one-sided slogans, and padding. Do NOT reward confidence, fluency or length. Quote the candidate's own words (exact phrase copied from the transcript) as evidence; if a criterion cannot be judged, set its score to null and say why. Scores are integers 0-100 or null. This is solo practice, so listening, teamwork and leadership are not assessed.\n\nTranscript:\n${rep.transcript.slice(0,9000)}\n\nMeasured: ${rep.words} words, ${rep.wpm} words per minute, ${rep.fillers} filler words detected.\n\nReply with only JSON: {"overall":0,"criteria":[{"name":"Argument quality","score":0,"explanation":"","evidence":"exact short quote"},{"name":"Critical thinking","score":0,"explanation":"","evidence":""},{"name":"Relevance","score":0,"explanation":"","evidence":""},{"name":"Contribution quality","score":0,"explanation":"","evidence":""},{"name":"Structure and clarity","score":0,"explanation":"","evidence":""},{"name":"Examples and evidence","score":0,"explanation":"","evidence":""}],"strengths":["only real, evidenced strengths"],"weaknesses":["specific weaknesses"],"missed":["points or counter-arguments the candidate missed"],"communication":"2-3 sentences on the clarity of the message (not tone)","content":"2-3 sentences on content quality","structure":"2-3 sentences on structure","clarity":"2-3 sentences on clarity","suggestions":["specific, actionable steps"],"stronger":"a stronger 60-80 word opening built only from the candidate's own points; use [add your own example] where a fact is missing"}`,{tier:"default",cache:false});
  if(!r||!Array.isArray(r.criteria))throw{code:"invalid_json"};
  Object.assign(rep,r);const m=gdMetrics(rep.transcript),tn=gdNorm(rep.transcript),notes=[];
  rep.criteria=(r.criteria||[]).map(c=>{const raw=(c.score===null||c.score===undefined||c.score==="")?null:Math.max(0,Math.min(100,Math.round(+c.score)||0));const k=gdCap(c.name,raw,m,"live");if(k.note)notes.push({name:c.name,from:raw,to:k.score,why:k.note});
   const ev=String(c.evidence||"").trim(),evOk=ev.length>=8&&tn.includes(gdNorm(ev));return{name:String(c.name||""),score:k.score,explanation:c.explanation||"",evidence:evOk?ev:""}});
  const sc=rep.criteria.filter(c=>c.score!=null).map(c=>c.score);
  if(!sc.length)throw{code:"invalid_json"};
  const mean=sc.reduce((a,b)=>a+b,0)/sc.length,aiOv=Math.max(0,Math.min(100,Math.round(+r.overall||0)));
  rep.overall=Math.min(Math.round(0.4*aiOv+0.6*mean),Math.round(mean+8),92);rep.caps=notes;rep.aiOverall=aiOv;rep.strictV=2;rep.limited=false;delete rep.note;delete rep.scoreErr}
 catch(e){rep.limited=true;rep.scoreErr=aiMsg(e);rep.note="Your response was captured but could not be scored: "+aiMsg(e)}
 if(!S.gdReports.some(x=>x.id===rep.id))S.gdReports.unshift(rep);save();SOLO.res=rep;SOLO.stage="result";drawSolo()}
function gdBars(cs){return(cs||[]).map(c=>`<div><div class="row between small"><b>${esc(c.name)}</b><span>${c.score==null?"Not assessed":c.score}</span></div><div class="bar"><i style="width:${+c.score||0}%"></i></div><div class="small muted">${esc(c.explanation||"")}${c.evidence?` <i>“${esc(c.evidence)}”</i>`:""}</div></div>`).join("")}
function soloResultHtml(r){if(!r)return"";
 const stats=`<div class="grid g3"><div class="card"><div class="score" style="font-size:30px">${r.words}</div><div class="small muted">words</div></div><div class="card"><div class="score" style="font-size:30px">${r.wpm||0}</div><div class="small muted">words per minute</div></div><div class="card"><div class="score" style="font-size:30px">${r.fillers}</div><div class="small muted">filler words in transcript</div></div></div>`;
 const head_=r.limited?`<div class="note ${r.scoreErr?"bad":""}" role="alert"><b>No score.</b> ${esc(r.note||"")}</div>${r.scoreErr?`<div class="row" style="margin-top:8px"><button class="btn pri" data-act="soloretry">Try scoring again</button></div>`:""}`:`<div class="panel notch" style="padding:24px 28px"><span class="eyebrow" style="color:var(--muted)">${esc(r.category)} · ${fmtDate(r.date)}</span><h2 style="font-size:clamp(20px,3.6vw,28px);margin:6px 0 12px">${esc(r.topic)}</h2><div class="row" style="gap:20px"><div><div class="score">${r.overall}</div><div class="small" style="color:var(--muted)">Score / 100</div></div><p style="max-width:52ch;color:var(--ink)">${esc(r.communication||"")}</p></div></div>`;
 const body=r.limited?"":`<div class="tabs" role="tablist" style="margin:14px 0 8px"><button class="tab" data-act="soloview" data-v="score" aria-selected="${SOLO.view!=="notes"&&SOLO.view!=="tr"}">Scores</button><button class="tab" data-act="soloview" data-v="notes" aria-selected="${SOLO.view==="notes"}">Feedback</button><button class="tab" data-act="soloview" data-v="tr" aria-selected="${SOLO.view==="tr"}">Transcript</button></div>

    if(m.share!=null&&m.share>0.4&&q.length&&q.some(c=>c.score<60)){["Listening","Teamwork","Leadership"].forEach(n=>{const c=byName(n);if(c&&c.score!=null&&c.score>55){notes.push({name:n,from:c.score,to:55,why:`Spoke ${Math.round(m.share*100)}% of all words without matching quality: airtime is not rewarded.`});c.score=55}})}
    const sc=crit.filter(c=>c.score!=null).map(c=>c.score),ev=String(p.evidence||"").trim();
    return{uid:x.uid,name:x.name,src:x.src,words:x.words,rankable:sc.length>=3,criteria:crit,total:sc.length>=3?Math.min(90,Math.round(sc.reduce((a,b)=>a+b,0)/sc.length)):null,caps:notes.slice(0,12),strengths:(p.strengths||[]).slice(0,4),improvements:(p.improvements||[]).slice(0,4),missed:(p.missed||[]).slice(0,3),evidence:(ev.length>=8&&tn.includes(gdNorm(ev)))?ev:"",feedback:p.feedback||""}});
   const ranked=rows.filter(x=>x.total!=null).sort((a,b)=>b.total-a.total);ranked.forEach((x,i)=>x.rank=i+1);
   const others=trs.filter(x=>!rankable.includes(x)).map(x=>({uid:x.uid,name:x.name,src:x.src,words:x.words,rankable:false}));
   ev.participants=[...ranked,...rows.filter(x=>x.total==null),...others];
   if(ranked.length>=3){const k=Math.max(1,Math.ceil(ranked.length*0.3));ev.shortlist=ranked.slice(0,k).map(x=>x.uid)}else ev.note="Fewer than 3 participants had enough speech captured, so no shortlist was made."}
  await VIEW.db.doc("gdreports/ev_"+GS.slot).set(ev)}
 catch(e){GS.evNote="The evaluation could not be completed ("+aiMsg(e)+"). It will retry.";setTimeout(()=>{GS.evBusy=false;if(!GS.ev)checkEv()},20000);return}
 GS.evBusy=false}
function gdSaveGroupReport(ev){const id="g_"+ev.slot;if(S.gdReports.some(r=>r.id===id))return;const me=(ev.participants||[]).find(p=>p.uid===myId());if(!me&&!seats(ev.slot).length)return;
 const ranked=(ev.participants||[]).filter(p=>p.total!=null);
 S.gdReports.unshift({id,kind:"group",slot:ev.slot,topic:ev.topic,category:"Group GD",date:ev.slot,overall:me&&me.total!=null?me.total:null,limited:!(me&&me.total!=null),note:me?(me.rankable?"":"Not enough speech was captured to assess you."):"You did not submit any speech for this session.",criteria:me&&me.criteria||[],strengths:me&&me.strengths||[],weaknesses:me&&me.improvements||[],feedback:me&&me.feedback||"",evidence:me&&me.evidence||"",rank:me&&me.rank||null,caps:me&&me.caps||[],missed:me&&me.missed||[],strictV:2,ranked:ranked.length,shortlisted:!!(me&&(ev.shortlist||[]).includes(me.uid)),board:ranked.map(p=>({name:p.name,total:p.total,rank:p.rank,uid:p.uid,short:(ev.shortlist||[]).includes(p.uid)})),src:me&&me.src||"none",words:me&&me.words||0,transcript:""});save();GS.saved=true}

function drawSession(force){const el=$("#gds");if(!el)return;if(!force&&document.activeElement&&el.contains(document.activeElement)&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;GS.lastDraw=Date.now();
 const slot=GS.slot,ph=GS.phase||gdPhaseOf(slot),m=mySeat(slot),bk=seats(slot),n=bk.length,pres=gdPresent();
 const names=bk.map(b=>{const here=GS.room?GS.peers.some(p=>p.presence&&p.presence.u===b.uid):null;return`<div class="row between small"><span>${esc(b.name||"Participant")}${b.uid===myId()?" (you)":""}</span>${here===null?"":`<span class="pill ${here?"ok":""}">${here?"in waiting room":"not here yet"}</span>`}</div>`}).join("")||`<p class="muted">No bookings yet.</p>`;
 const head_=`<div class="panel notch stack" style="padding:22px 26px"><div class="row between"><span class="eyebrow" style="color:var(--muted)">${dfmt(slot)}, ${tfmt(slot)} · ${esc(TZ)}</span><span class="pill" style="background:var(--surface);color:var(--ink)">${n}/${GD_CAP} seats filled</span></div><div class="score" style="font-size:clamp(26px,5vw,42px)" id="gdclock">${gdClockText(ph)}</div></div>`;
 let body="";
 if(!m&&ph!=="after"){body=`<div class="card stack"><h3>You do not have a seat</h3><p class="muted">${ph==="upcoming"||ph==="lobby"?"Book this slot to take part.":"This session has started, so booking is closed."}</p><div class="row">${ph==="upcoming"||ph==="lobby"?(n>=GD_CAP?`<span class="pill bad">Full</span>`:""):""}${A("/gd/group","See available slots","btn pri")}</div></div>`}
 else if(ph==="upcoming"||ph==="lobby"){const url=gdMeetUrl(slot),custom=GDB.some(x=>x.id==="meet_"+slot&&x.kind==="meet");
  body=`<div class="grid g2" style="margin-top:14px"><div class="card stack"><h3>${ph==="lobby"?"Waiting room":"Your seat is booked"}</h3><p class="muted">${ph==="lobby"?"The session starts automatically at the scheduled time. The topic is revealed to everyone at the same moment.":"The waiting room opens 10 minutes before the start. Come back then to join the call."}</p>
   <label class="row small" style="font-weight:500;margin:0"><input type="checkbox" data-act="gdcons" ${GS.consent?"checked":""} style="width:auto;min-height:0"> I agree that my microphone is used for speech recognition during the discussion, and that the resulting text is shared with this session's participants to produce AI feedback and practice rankings. No audio is stored by Role.via.</label>
   <div class="row"><button class="btn ghost sm" data-act="gdprobe" ${SR?"":"disabled"}>Check speech capture</button><span class="small" id="gdprobe" role="status">${esc(GS.probe||"")}</span></div>${GS.capErr?`<div class="note bad" role="alert">${esc(GS.capErr)}</div>`:""}${SR?"":`<div class="note bad">${SRERR.unsupported}</div>`}
   ${ph==="upcoming"?`<div class="row"><button class="btn ghost" data-act="gdcancel2" data-t="${slot}">Cancel my seat</button></div>`:""}</div>
  <div class="card stack"><h3>Participants</h3>${names}${ph==="lobby"?`<p class="small muted">${pres} of ${n} booked participant${n==1?"":"s"} here. If fewer than ${GD_CAP} come, the session runs with whoever is present.</p>`:""}</div></div>
  ${ph==="lobby"?gdCallCard(url,custom):`<div class="note info" style="margin-top:14px">The video call link appears here when the waiting room opens.</div>`}`}
 else if(ph==="live"){const t=GS.topic;const alone=pres<2&&Date.now()>slot+30e3;
  body=`<div class="card stack lg" style="margin-top:14px"><span class="pill" style="align-self:flex-start">${t?esc(gdCatLabel(t.cat)):"Topic"}</span><h2 style="font-size:clamp(22px,4vw,36px)">${t?esc(t.topic):"Loading topic…"}</h2><p class="muted">Discuss with the group on the video call. Respond to each other, build on points and conclude together. The discussion closes automatically when the timer ends.</p></div>
  ${alone?`<div class="note" style="margin-top:12px"><b>Nobody else is here.</b> The session runs with whoever is present, but you are on your own. You can ${A("/gd/practice","practise this topic solo","btn ghost sm")} instead.</div>`:""}
  <div class="grid g2" style="margin-top:14px"><div class="card stack"><h4>Speech capture for your feedback</h4>${GS.capOn?`<div class="rec"><i></i> Capturing your speech <span class="small muted" id="gdwc">${GS.words} words captured</span></div><button class="btn ghost sm" data-act="gdcapoff" style="align-self:flex-start">Pause capture</button>`:GS.consent?`${GS.capErr?`<div class="note bad" role="alert">${esc(GS.capErr)}</div>`:""}<button class="btn pri sm" data-act="gdcapretry" style="align-self:flex-start">${GS.capErr?"Retry":"Start capture"}</button>`:`<div class="note">Tick the consent box to enable capture. Without it you can still talk, but you will not be assessed.</div><label class="row small" style="font-weight:500;margin:0"><input type="checkbox" data-act="gdcons" style="width:auto;min-height:0"> I agree to speech capture for feedback</label>`}<p class="small muted">Capture runs in this tab. If your browser stops it while you are on the call tab, you can add a spoken recap afterwards.</p></div>
  <div class="card stack"><h4>Participants (${pres} here)</h4>${names}</div></div>${gdCallCard(gdMeetUrl(slot),GDB.some(x=>x.id==="meet_"+slot&&x.kind==="meet"))}`}
 else if(ph==="wrap"){body=`<div class="card stack lg" style="margin-top:14px"><h3>Discussion closed</h3><p class="muted">The timer has ended. You can leave the call.</p>
  ${m&&GS.recap?`<div class="note info"><b>Add a short spoken recap.</b> Not enough of your speech was captured during the call (${GS.words} words). Summarise the points you made, in your own words, so you can still be assessed. Recap-based assessments are marked as weaker evidence.</div>${GS.recapOn?`<div class="row"><span class="rec"><i></i> Recording recap</span><span class="small muted" id="gdrwc">${wc(GS.recapText)} words</span></div><div class="row"><button class="btn pri" data-act="gdrecapdone">Done</button></div>`:`<div class="row"><button class="btn pri" data-act="gdrecap" ${SR?"":"disabled"}>Start recap</button><button class="btn ghost" data-act="gdrecapskip">Skip</button></div>`}${GS.capErr?`<div class="note bad" role="alert">${esc(GS.capErr)}</div>`:""}`:`<div class="note ok">Your contribution has been submitted. The AI evaluation starts shortly.</div>`}</div>`}
 else{ /* after */ body=GS.ev?gdResultHtml(GS.ev):`<div class="card stack" style="margin-top:14px;align-items:center;padding:40px 0">${m?loading("Evaluating the discussion…"):"<p class='muted'>This session has ended.</p>"}${GS.evNote?`<p class="small muted">${esc(GS.evNote)}</p>`:""}</div><div class="row" style="margin-top:12px">${A("/gd/group","Book another session","btn pri")}${A("/gd/practice","Practise solo","btn ghost")}</div>`}
 el.innerHTML=head_+body+gdRules()}
const gdRules=()=>`<div class="note info small" style="margin-top:14px"><b>Practice only.</b> Rankings and shortlists here are AI-generated practice assessments based on speech-to-text from each participant. They are not hiring or admission decisions and do not reflect any employer or institution.</div>`;
function gdCallCard(url,custom){return`<div class="card stack" style="margin-top:14px"><h4>Video and audio call</h4><p class="muted small">Everyone in this session joins the same call. The room is created when the first person joins.</p><div class="row"><a class="btn pri" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open the video call</a><span class="small muted" style="overflow-wrap:anywhere">${esc(url.replace(/^https:\/\//,""))}</span></div>
 <p class="small muted">The free public room may ask the first person in to sign in before it starts; everyone else then joins directly. If it does not work for your group, anyone can share a Google Meet, Zoom, Teams or Whereby link for this session:</p>
 <div class="row" style="flex-wrap:nowrap"><input id="gdml" placeholder="https://meet.google.com/…" aria-label="Alternative meeting link" style="flex:1"><button class="btn ghost sm" data-act="gdmeet">Share link</button>${custom?`<button class="btn ghost sm" data-act="gdmeetreset">Use default room</button>`:""}</div><div class="err" id="gdmerr" role="alert"></div></div>`}
function gdResultHtml(ev){const me=(ev.participants||[]).find(p=>p.uid===myId()),ranked=(ev.participants||[]).filter(p=>p.total!=null).sort((a,b)=>a.rank-b.rank);
 return`<div class="stack" style="margin-top:14px">${me&&me.total!=null?`<div class="card row between"><div><div class="small muted">Your practice score</div><div class="score">${me.total}</div></div><div><div class="small muted">Practice rank</div><div class="score">${me.rank}<span class="small muted"> of ${ranked.length}</span></div></div><div>${(ev.shortlist||[]).includes(myId())?`<span class="pill ok">In the practice shortlist</span>`:ranked.length>=3?`<span class="pill">Not in the practice shortlist</span>`:`<span class="pill">No shortlist</span>`}</div></div>`:`<div class="note">${me?"Not enough of your speech was captured to assess you.":"You did not submit speech for this session."}</div>`}
 ${ranked.length?`<div class="card stack"><h3>Practice ranking</h3>${ranked.map(p=>`<div class="row between"><span><b>${p.rank}.</b> ${esc(p.name)}${p.uid===myId()?" (you)":""} ${(ev.shortlist||[]).includes(p.uid)?'<span class="pill ok">shortlisted</span>':""}${p.src==="recap"?' <span class="pill ai">recap-based</span>':""}</span><b>${p.total}</b></div>`).join("")}</div>`:""}
 ${ev.note?`<div class="note">${esc(ev.note)}</div>`:""}
 <div class="row">${S.gdReports.some(r=>r.id==="g_"+ev.slot)?A("/reports/gd/g_"+ev.slot,"Open my full feedback report","btn pri"):""}${A("/gd/group","Book another session","btn ghost")}</div></div>`}
ACT.gdcancel2=async t=>{const slot=+t.dataset.t,m=mySeat(slot);if(!m)return;try{await VIEW.db.doc("gdbookings/"+m.id).delete();delete S.gdBookings[slot];save();toast("Seat cancelled");go("/gd/group")}catch(e){toast("Could not cancel")}};

/* ---------- GD report (individual and group) ---------- */
R(/^\/reports\/gd\/([^/]+)$/,id=>{const r=S.gdReports.find(x=>x.id===id);if(!r)return{private:true,nav:"/reports",html:`<div class="empty"><h3>Report not found</h3><p style="margin-top:10px">${A("/reports","My reports","btn pri")}</p></div>`};
 const sum=r.strengths||r.strongest,weak=r.weaknesses||r.missed,sug=r.suggestions||r.next;
 return{private:true,nav:"/reports",title:"GD report",html:`${crumbs([["/reports","My Reports"],[null,"GD report"]])}<div class="panel notch" style="padding:24px 28px"><span class="eyebrow" style="color:var(--muted)">${esc(r.category||"")} · ${fmtDate(r.date)}</span><h2 style="font-size:clamp(22px,4vw,32px);margin-top:6px">${esc(r.topic)}</h2>${r.overall!=null?`<div class="row" style="gap:24px;margin-top:10px"><div><div class="score">${r.overall}</div><div class="small" style="color:var(--muted)">Score / 100</div></div>${r.rank?`<div><div class="score">${r.rank}<span style="font-size:18px"> / ${r.ranked}</span></div><div class="small" style="color:var(--muted)">Practice rank${r.shortlisted?" · shortlisted":""}</div></div>`:""}</div>`:""}</div>
 <div class="note info" style="margin-top:12px">AI-generated practice assessment from speech-to-text. It is private to you and is not a hiring or admission decision.${r.src==="recap"?" This assessment is based on a spoken recap, which is weaker evidence.":""}</div>
 ${r.limited?`<div class="note" style="margin-top:12px"><b>No score.</b> ${esc(r.note||"")}</div>`:`<div class="grid g2" style="margin-top:16px"><div class="card stack"><h3>Criteria</h3>${gdBars(r.criteria)}</div><div class="card stack"><h3>Strengths</h3>${jl(sum)}<h3>Weaknesses</h3>${jl(weak)}${sug&&sug.length?`<h3>Suggestions</h3>${jl(sug)}`:""}${r.feedback?`<h3>Feedback</h3><p>${esc(r.feedback)}</p>`:""}${r.communication?`<h3>Communication</h3><p>${esc(r.communication)}</p><h3>Content quality</h3><p>${esc(r.content||"")}</p><h3>Structure</h3><p>${esc(r.structure||"")}</p><h3>Clarity</h3><p>${esc(r.clarity||"")}</p>`:""}</div></div>`}
 ${r.board&&r.board.length?`<div class="card stack" style="margin-top:16px"><h3>Practice ranking</h3>${r.board.map(p=>`<div class="row between"><span><b>${p.rank}.</b> ${esc(p.name)} ${p.short?'<span class="pill ok">shortlisted</span>':""}</span><b>${p.total}</b></div>`).join("")}</div>`:""}
 ${(r.caps||[]).length?`<details class="card" style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">Why these scores (${r.caps.length} strict check${r.caps.length==1?"":"s"} applied)</summary><p class="small muted" style="margin:8px 0">The AI proposed scores; automatic checks on your transcript lowered them. Speaking time and confidence are not rewarded.</p>${jl(r.caps,x=>`<li class="small">${esc(x.name)}: ${x.from} → ${x.to}. ${esc(x.why)}</li>`)}</details>`:""}${(r.missed||[]).length?`<div class="card stack" style="margin-top:12px"><h3>Missed opportunities</h3>${jl(r.missed)}</div>`:""}
 ${r.transcript?`<details class="card" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">Transcript</summary><p style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px">${esc(r.transcript)}</p></details>`:""}
 <div class="row" style="margin-top:14px"><a class="btn pri" href="#/gd">Back to GD Arena</a><button class="btn ghost" data-act="gdrdel" data-id="${r.id}">Delete this report</button></div>`}});
ACT.gdrdel=t=>{if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Confirm delete";return}S.gdReports=S.gdReports.filter(r=>r.id!==t.dataset.id);save();go("/reports")};
</script>
