<script>
/* ---------- dashboard ---------- */
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const liveSession=()=>S.sessions.find(s=>s.status==="active"||s.status==="paused");
R(/^\/dashboard$/,()=>{const rp=S.reports.slice(0,3),ls=liveSession(),ready=avg(S.reports.slice(0,5).map(r=>r.overall));
 const gd=(typeof SITE!=="undefined"&&SITE.on&&SITE.summary)?SITE.summary.bookings.map(b=>({id:String(b.slot),start:b.slot,label:"Group GD · "+gdCatLabel(b.pref)})).filter(b=>b.start>Date.now()-3600e3).slice(0,3):Object.entries(S.gdBookings).map(([id,b])=>({id,...b})).filter(b=>/^\d+$/.test(b.id)&&b.start>Date.now()-3600e3).sort((a,b)=>a.start-b.start).slice(0,3);
 const steps=[];if(!S.profile.level)steps.push(["Finish your preferences","/onboarding"]);if(!S.reports.length)steps.push(["Run your first AI mock interview","/interviews/new"]);if(!S.cv)steps.push(["Add your CV for personalised questions (optional)","/cv"]);if(!gd.length)steps.push(["Book a live group discussion","/gd"]);if(S.reports.length&&!S.bookmarks.length)steps.push(["Bookmark questions you want to revise","/questions"]);
 const role=S.profile.roles[0]||"";
 return{private:true,nav:"/dashboard",title:"Dashboard",html:`
<div class="panel notch stack" style="padding:28px 28px 30px"><span class="eyebrow" style="color:var(--muted)">Dashboard</span><h2 style="font-size:clamp(24px,4vw,36px)">Welcome, ${esc(S.user.name.split(" ")[0])}</h2>
<div class="row">${ls?`<a class="btn lav" href="#/interviews/live/${ls.id}">Resume interview at ${esc(ls.company)}</a>`:`<a class="btn lav" href="#/interviews/new">Start a mock interview</a>`}<a class="btn" style="background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)" href="#/companies">Explore companies</a></div></div>
<div class="grid g2" style="margin-top:16px">
 ${typeof SITE!=="undefined"&&SITE.on?SITE.dashCard():""}
 <div class="card stack"><div class="row between"><h3>Interview readiness</h3>${A("/progress","Progress","small")}</div>
  ${ready==null?`<div class="empty" style="padding:18px"><p class="muted">No interviews yet. Your readiness score appears after your first completed mock.</p></div>`:`<div><span class="score">${ready}</span><span class="muted"> / 100 average of last ${Math.min(5,S.reports.length)}</span></div><div class="bar"><i style="width:${ready}%"></i></div><p class="small muted">Practice score only. It does not predict hiring outcomes.</p>`}</div>
 <div class="card stack"><h3>Recommended next steps</h3>${steps.length?steps.slice(0,4).map(([t,h])=>`<a class="row between" style="text-decoration:none;padding:8px 0;border-bottom:1px solid var(--line)" href="#${h}"><span>${t}</span><span aria-hidden="true">→</span></a>`).join(""):`<p class="muted">You are up to date. Run another interview to keep improving.</p>`}</div>
 <div class="card stack"><div class="row between"><h3>Recent company profiles</h3>${A("/companies","All","small")}</div>${S.recent.length?S.recent.slice(0,4).map(s=>`<a class="row between" style="text-decoration:none;padding:6px 0" href="#/company/${s}"><span>${esc(S.companies[s]?.name||s)}</span><span class="muted small">${esc(S.companies[s]?.profile?.industry||"")}</span></a>`).join(""):`<p class="muted">Search a company to see it here.</p>`}</div>
 <div class="card stack"><div class="row between"><h3>Recent interview reports</h3>${A("/reports","All","small")}</div>${rp.length?rp.map(r=>`<a class="row between" style="text-decoration:none;padding:6px 0" href="#/reports/${r.id}"><span>${esc(r.company)} · ${esc(r.role)}</span><b>${r.overall}</b></a>`).join(""):`<p class="muted">Reports appear after you finish an interview.</p>`}</div>
 <div class="card stack"><div class="row between"><h3>Job opportunities</h3>${A("/jobs","Jobs","small")}</div><p class="muted small">No job feed is connected, so ROLEVIA lists no vacancies of its own. Open a live search for your target role:</p><div class="chips">${(S.profile.roles.length?S.profile.roles.slice(0,3):["Marketing"]).map(r=>`<a class="chip" style="text-decoration:none" href="#/jobs/${encodeURIComponent(r)}">${esc(r)}</a>`).join("")}</div></div>
</div>`}});

/* ---------- companies ---------- */
R(/^\/companies$/,()=>({title:"Explore Companies",html:`${crumbs([["/","Home"],[null,"Companies"]])}${head("Explore companies","Search any company. Popular names are listed, but search is not limited to them.")}
<div class="card" style="overflow:visible">${searchBox("cs")}</div>
${S.recent.length?`<h3 style="margin:26px 0 10px">Your recent profiles</h3><div class="chips">${S.recent.slice(0,8).map(s=>`<a class="chip" style="text-decoration:none" href="#/company/${s}">${esc(S.companies[s]?.name||s)}</a>`).join("")}</div>`:""}
<h3 style="margin:26px 0 10px">Popular companies</h3>
<div class="grid g3">${POP.map(([n,i])=>`<a class="card" href="#/search/${encodeURIComponent(n)}"><b>${esc(n)}</b><div class="muted small">${esc(i)}</div></a>`).join("")}</div>`}));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function openCompany(name){const slug=slugify(name);S.companies[slug]=S.companies[slug]||{name};S.companies[slug].name=S.companies[slug].name||name;S.recent=[slug,...S.recent.filter(x=>x!==slug)].slice(0,12);save();go("/company/"+slug)}
ACT.pick=t=>openCompany(t.dataset.name);
R(/^\/search\/(.+)$/,q=>{const exact=POP.find(([n])=>norm(n)===norm(q));
 if(exact){setTimeout(()=>openCompany(exact[0]),0);return{html:loading("Opening "+exact[0]+"…")}}
 const cached=Object.values(S.companies).find(c=>norm(c.name||"")===norm(q));if(cached){setTimeout(()=>openCompany(cached.name),0);return{html:loading("Opening…")}}
 const sg=suggest(q);
 return{title:"Search: "+q,html:`${crumbs([["/","Home"],["/companies","Companies"],[null,"Search"]])}${head("Results for “"+esc(q)+"”")}
 ${sg.length?`<h3 style="margin-bottom:10px">Did you mean</h3><div class="grid g3">${sg.map(x=>`<a class="card" href="#/search/${encodeURIComponent(x.n)}"><b>${esc(x.n)}</b><div class="muted small">${esc(x.i)}</div></a>`).join("")}</div>`:""}
 <div class="card stack" style="margin-top:18px"><h3>${sg.length?"Not one of those?":"Not in the popular list"}</h3><p class="muted">ROLEVIA can look for “${esc(q)}” using Claude's general knowledge. If several companies share the name you will be asked to choose. If nothing reliable is known, you will be told.</p><div id="res"><button class="btn pri" data-act="resolve" data-q="${esc(q)}">Research “${esc(q)}”</button></div></div>`}});
ACT.resolve=async t=>{const q=t.dataset.q,box=$("#res");box.innerHTML=loading("Looking up “"+q+"”…");
 try{const r=await ai(`A user typed the company name "${q}" (may be misspelled or partial) in an interview-preparation app. Identify which real companies it could be, using only what you reliably know. Do not invent companies. Reply with only JSON: {"candidates":[{"name":"official name","industry":"short","description":"one factual sentence","country":"HQ country"}],"note":"string, empty unless nothing reliable is known"}. Up to 5 candidates, best first. Empty array if you do not recognise it.`,{tier:"quick"});
  const c=(r.candidates||[]).filter(x=>x&&x.name);
  if(!c.length){box.innerHTML=`<div class="note">No reliable information found for “${esc(q)}”. ${esc(r.note||"")} It may be very new, very small, or spelled differently. Check the spelling, or try the company's full legal name.</div>`;return}
  box.innerHTML=`<p class="small muted" style="margin-bottom:8px">${c.length>1?"Several matches. Choose the right company:":"Best match:"}</p><div class="stack">${c.map(x=>`<button class="card" style="text-align:left;cursor:pointer;font:inherit;color:inherit" data-act="pick" data-name="${esc(x.name)}"><b>${esc(x.name)}</b> <span class="muted small">${esc([x.industry,x.country].filter(Boolean).join(" · "))}</span><div class="small muted">${esc(x.description||"")}</div></button>`).join("")}</div>`}
 catch(e){box.innerHTML=`<div class="note bad">${esc(aiMsg(e))}</div><p style="margin-top:10px"><button class="btn pri sm" data-act="resolve" data-q="${esc(q)}">Try again</button></p>`}};

/* ---------- company profile ---------- */
let CTAB="overview";
const jl=(a,f)=>(a&&a.length)?`<ul style="margin:6px 0 0;padding-left:20px" class="stack" >${a.map(f||(x=>`<li>${esc(x)}</li>`)).join("")}</ul>`:`<p class="muted">Not available.</p>`;
const careersLink=n=>`https://www.google.com/search?q=${encodeURIComponent(n+" careers official")}`;
R(/^\/company\/([^/]+)$/,slug=>{const c=S.companies[slug];
 if(!c)return{html:`<div class="empty" style="margin-top:30px"><h3>Unknown company page</h3><p class="muted">Search for the company to create its profile.</p><p style="margin-top:12px">${A("/companies","Search companies","btn pri")}</p></div>`};
 CTAB="overview";
 return{title:c.name,html:`${crumbs([["/","Home"],["/companies","Companies"],[null,c.name]])}<div id="cwrap">${loading("Preparing the profile for "+c.name+"…")}</div>`,mount:()=>{drawCompany(slug);}}});
async function ensureProfile(slug){const c=S.companies[slug];if(c.profile)return;
 const p=await ai(`You are building an interview-preparation company profile for "${c.name}". Use ONLY what you reliably know. Hard rules: never invent interview questions, candidate experiences, policies, numbers, or news. If you are unsure of something, use null or an empty array. Recent news: leave empty, you have no live feed. Reply with only JSON:
{"name":"official name","industry":"","headquarters":"","overview":"2-3 sentences","businessModel":"2-3 sentences","products":["..."],"competitors":["..."],"cultureValues":[{"value":"","note":"short; only if publicly stated by the company, else omit the item"}],"hiring":{"knownProcess":"string or null","inferredRounds":["typical rounds for this kind of company, clearly generic"],"confidence":"low|medium|high","note":"what is and is not known"},"groupDiscussionLikely":true,"askInterviewer":["5 thoughtful questions a candidate could ask"],"limitations":"one sentence about what you could not verify"}`);
 c.profile=p;c.generatedAt=Date.now();c.roles=c.roles||{};save()}
async function drawCompany(slug){const w=$("#cwrap");if(!w)return;const c=S.companies[slug];
 try{await ensureProfile(slug)}catch(e){w.innerHTML=`<div class="note bad">${esc(aiMsg(e))}</div><div class="card stack" style="margin-top:12px"><h3>${esc(c.name)}</h3><p class="muted">The profile could not be built. You can still open the company's official careers page, or practise generally.</p><div class="row"><a class="btn ghost sm" target="_blank" rel="noopener" href="${careersLink(c.name)}">Find careers page ↗</a><button class="btn pri sm" data-act="retryco" data-slug="${slug}">Try again</button></div></div>`;return}
 const p=c.profile;
 w.innerHTML=`<div class="panel notch stack" style="padding:26px 28px 28px"><div class="row between"><div><span class="eyebrow" style="color:var(--muted)">${esc(p.industry||"Company")}${p.headquarters?" · "+esc(p.headquarters):""}</span><h2 style="font-size:clamp(26px,4.4vw,40px)">${esc(p.name||c.name)}</h2></div></div>
 <div class="row"><a class="btn lav" href="#/interviews/new/${slug}">Practise an interview here</a><a class="btn" style="background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)" href="#/questions/${slug}">Practice questions</a></div></div>
 <div style="margin-top:14px">${aiNote}</div>
 <div class="tabs" role="tablist">${[["overview","Overview"],["hiring","Hiring & culture"],["role","Role preparation"],["questions","Questions"],["sources","Sources & jobs"]].map(([k,t])=>`<button role="tab" data-act="ctab" data-k="${k}" data-slug="${slug}" aria-current="${CTAB===k}">${t}</button>`).join("")}</div><div id="ctab">${ctab(slug)}</div>`}
ACT.retryco=t=>{$("#cwrap").innerHTML=loading("Retrying…");drawCompany(t.dataset.slug)};
ACT.ctab=t=>{CTAB=t.dataset.k;$$("[data-act=ctab]").forEach(b=>b.setAttribute("aria-current",b.dataset.k===CTAB));$("#ctab").innerHTML=ctab(t.dataset.slug)};
function ctab(slug){const c=S.companies[slug],p=c.profile,k=CTAB;
 if(k==="overview")return`<div class="grid g2"><div class="card stack"><h3>Overview ${AIPILL}</h3><p>${esc(p.overview||"Not available.")}</p></div><div class="card stack"><h3>Business model ${AIPILL}</h3><p>${esc(p.businessModel||"Not available.")}</p></div><div class="card"><h3>Products and services</h3>${jl(p.products)}</div><div class="card"><h3>Competitors</h3>${jl(p.competitors)}</div></div>
 <div class="card" style="margin-top:16px"><h3>Recent news</h3><p class="muted" style="margin-top:6px">Unavailable. No live news feed is connected, and ROLEVIA will not recall news from memory.</p></div>`;
 if(k==="hiring"){const h=p.hiring||{};return`<div class="grid g2"><div class="card stack"><h3>Hiring process ${AIPILL}</h3>${h.knownProcess?`<p>${esc(h.knownProcess)}</p>`:`<p class="muted">No company-specific process is known to ROLEVIA.</p>`}<h4>Typical rounds for this kind of employer (inferred, not company-confirmed)</h4>${jl(h.inferredRounds)}<p class="small muted">Confidence: <b>${esc(h.confidence||"low")}</b>. ${esc(h.note||"")}</p></div>
 <div class="card stack"><h3>Culture and stated values ${AIPILL}</h3>${jl((p.cultureValues||[]).filter(x=>x&&x.value),x=>`<li><b>${esc(x.value)}</b>${x.note?" — "+esc(x.note):""}</li>`)}<p class="small muted">Not linked to a source. Compare with the company's own values page.</p></div>
 <div class="card stack"><h3>Group discussion</h3><p>${p.groupDiscussionLikely?"A group discussion round is plausible for this kind of employer, but no reported GD topics are available.":"No evidence of a group discussion round."}</p>${A("/gd","Practise in the GD Arena","btn ghost sm")}</div>
 <div class="card stack"><h3>Questions to ask the interviewer ${AIPILL}</h3>${jl(p.askInterviewer)}</div></div>`}
 if(k==="role"){const role=CROLE[slug]||S.profile.roles[0]||"Marketing";CROLE[slug]=role;const rd=c.roles&&c.roles[role];
  return`<div class="card stack"><div class="field" style="max-width:320px"><label for="rsel">Role</label><select id="rsel" data-act-change="crole" data-slug="${slug}">${ROLES.map(r=>`<option ${r===role?"selected":""}>${r}</option>`).join("")}</select></div>
  <div id="rbody">${rd?roleHtml(c,role,rd):`<p class="muted">Build preparation content for ${esc(role)} at ${esc(c.name)}.</p><p><button class="btn pri" data-act="genrole" data-slug="${slug}">Generate ${esc(role)} preparation</button></p>`}</div></div>`}
 if(k==="questions"){return`<div class="grid g2"><div class="card stack"><h3>Candidate-reported questions</h3><div class="empty" style="padding:18px"><p class="muted">None available. ROLEVIA has no connected source of candidate-reported interview questions, so it shows none rather than guessing.</p></div><h4>Repeatedly reported patterns</h4><p class="muted">None available, for the same reason.</p></div>
 <div class="card stack"><h3>AI-generated practice questions</h3><p class="muted">Written from company and role research. Not real interview questions.</p><div class="row">${A("/questions/"+slug,"Open practice questions","btn pri sm")}${A("/interviews/new/"+slug,"Start a mock interview","btn ghost sm")}</div></div></div>`}
 return`<div class="grid g2"><div class="card stack"><h3>Sources</h3><p class="muted">No live sources attached. Profile written ${fmtDate(c.generatedAt)} from Claude's general knowledge. ${esc(p.limitations||"")}</p><div class="chips"><span class="pill ai">AI-generated</span><span class="pill">Confidence: ${esc(p.hiring?.confidence||"low")}</span></div><button class="btn ghost sm" style="align-self:flex-start" data-act="regen" data-slug="${slug}">Regenerate profile</button></div>
 <div class="card stack"><h3>Careers and jobs</h3><p class="muted">Search links open external sites. ROLEVIA has not verified any listing.</p><div class="stack"><a class="btn ghost sm" target="_blank" rel="noopener" href="${careersLink(c.name)}">Official careers page search ↗</a>${A("/jobs/"+encodeURIComponent(CROLE[slug]||S.profile.roles[0]||"Marketing")+"/"+encodeURIComponent(c.name),"Job search for this company","btn ghost sm")}</div></div></div>`}
const CROLE={};
document.addEventListener("change",e=>{const s=e.target.closest("[data-act-change=crole]");if(!s)return;CROLE[s.dataset.slug]=s.value;$("#ctab").innerHTML=ctab(s.dataset.slug)});
ACT.regen=t=>{const c=S.companies[t.dataset.slug];delete c.profile;c.roles={};save();$("#cwrap").innerHTML=loading("Rebuilding…");drawCompany(t.dataset.slug)};
function roleHtml(c,role,rd){return`<div class="stack lg" style="margin-top:6px">${AIPILL}<div><h4>Skills that matter for ${esc(role)}</h4>${jl(rd.skills)}</div><div><h4>How this company and role combine</h4>${jl(rd.focus)}</div><div><h4>Preparation tips</h4>${jl(rd.tips)}</div><div><h4>Practice questions (AI-generated)</h4>${jl(rd.questions,x=>`<li>${esc(x.q)} <span class="pill">${esc(x.type||"")}</span></li>`)}</div><div class="row"><a class="btn pri sm" href="#/interviews/new/${slugify(c.name)}">Mock interview for this role</a></div></div>`}
ACT.genrole=async t=>{const slug=t.dataset.slug,c=S.companies[slug],role=CROLE[slug],b=$("#rbody");b.innerHTML=loading("Building "+role+" preparation…");
 try{const r=await ai(`Interview preparation for the ${role} function at "${c.name}" (${c.profile.industry||""}). Business context: ${c.profile.overview||""}. Use only reliable knowledge; do not claim these are real past interview questions. Reply with only JSON: {"skills":["6 skills"],"focus":["4 points on how ${role} interviews at THIS company type differ, tied to its business model"],"tips":["5 concrete tips"],"questions":[{"q":"","type":"Behavioural|Role knowledge|Case / estimation|Situational|Motivation & fit"}]} with 8 questions mixing types.`);
  c.roles=c.roles||{};c.roles[role]=r;save();b.innerHTML=roleHtml(c,role,r)}catch(e){b.innerHTML=`<div class="note bad">${esc(aiMsg(e))}</div><p style="margin-top:8px"><button class="btn pri sm" data-act="genrole" data-slug="${slug}">Try again</button></p>`}};
</script>
