<script>
/* ---------- Question Explorer ---------- */
const QF={company:"",role:"",industry:"",round:"",type:"",level:"",jd:"",kw:"",marked:false};
let QSEL=new Set(),PENDING_SET=null;
const sel=(id,label,opts,v,attr)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}" data-qf="${attr}"><option value="">Any</option>${opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
R(/^\/questions(?:\/([^/]+))?$/,slug=>{if(slug&&S.companies[slug])QF.company=S.companies[slug].name;if(!QF.role&&S.profile.roles[0])QF.role=S.profile.roles[0];if(!QF.level&&S.profile.level)QF.level=S.profile.level;
 return{private:true,nav:"/questions",title:"Question Explorer",html:`${head("Question Explorer","Generate practice questions for a company, role and level, then save the ones you want to rehearse.")}
<div class="note info" style="margin-bottom:14px">These are practice questions, not a list of what any company has asked. ROLEVIA has no verified interview-question feed connected, so nothing here is claimed as a real past question.</div>
<div class="card stack"><div class="grid g3"><div class="field"><label for="qc">Company</label><input id="qc" data-qf="company" value="${esc(QF.company)}" placeholder="Any company" list="cl"><datalist id="cl">${POP.map(p=>`<option value="${esc(p[0])}">`).join("")}</datalist></div>
${sel("qr","Role",ROLES,QF.role,"role")}${sel("qi","Industry",INDUSTRIES,QF.industry,"industry")}${sel("qo","Interview round",ROUNDS,QF.round,"round")}${sel("qt","Question type",QTYPES,QF.type,"type")}${sel("ql","Experience level",LEVELS,QF.level,"level")}</div>
<div class="field"><label for="qj">Job description (optional)</label><textarea id="qj" data-qf="jd" placeholder="Paste the posting to tailor the questions" style="min-height:90px">${esc(QF.jd)}</textarea></div>
<div class="row"><button class="btn pri" data-act="qgen" id="qgbtn">Generate practice questions</button><span class="small muted">${S.cv&&S.cv.use?"Your uploaded CV is used to personalise them.":"Upload a CV in My CV to personalise them."}</span></div><div id="qgstat" aria-live="polite"></div></div>
<div class="row between" style="margin:18px 0 8px"><div class="field" style="flex:1;min-width:200px"><label for="qk">Search saved questions</label><input id="qk" data-qf="kw" value="${esc(QF.kw)}" placeholder="Keyword"></div><label class="row" style="margin:0;font-weight:500"><input type="checkbox" id="qm" data-qf="marked" ${QF.marked?"checked":""} style="width:auto;min-height:0"> Bookmarked only</label></div>
<div id="qlist"></div><div id="qlists"></div>`,mount:()=>{drawQ()}}});
function qmatch(q){const f=QF;return(!f.company||norm(q.company||"").includes(norm(f.company)))&&(!f.role||q.role===f.role)&&(!f.industry||q.industry===f.industry)&&(!f.round||q.round===f.round)&&(!f.type||q.type===f.type)&&(!f.level||q.level===f.level)&&(!f.kw||norm(q.q).includes(norm(f.kw)))&&(!f.marked||S.bookmarks.some(b=>b.id===q.id))}
function qrow(q){const bm=S.bookmarks.some(b=>b.id===q.id);return`<div class="card row" style="align-items:flex-start;flex-wrap:nowrap;margin-bottom:8px"><input type="checkbox" aria-label="Select question" data-act="qsel" data-id="${q.id}" ${QSEL.has(q.id)?"checked":""} style="width:20px;min-height:20px;margin-top:3px"><div class="stack" style="gap:6px;flex:1;min-width:0"><div>${esc(q.q)}</div><div class="chips">${q.label==="reported"?`<span class="pill ok">Candidate-reported${q.src?` · <a href="${esc(q.src.url)}" target="_blank" rel="noopener noreferrer">source</a>`:""}</span>`:`<span class="pill ${q.label==="template"?"":"ai"}">${q.label==="template"?"Template practice question":"AI-generated practice question"}</span>`}${[q.company,q.role,q.round,q.type].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div></div><button class="btn ghost sm" data-act="qbm" data-id="${q.id}" aria-pressed="${bm}">${bm?"★ Saved":"☆ Save"}</button></div>`}
function drawQ(){const L=S.qlib.filter(qmatch);$("#qlist").innerHTML=`<div class="row between" style="margin-bottom:8px"><h3>${L.length} question${L.length==1?"":"s"}</h3><div class="row"><button class="btn blue sm" data-act="qmock" ${QSEL.size?"":"disabled"}>Start mock with ${QSEL.size||"selected"} selected</button><button class="btn ghost sm" data-act="qlist" ${QSEL.size?"":"disabled"}>Save selected to a practice list</button></div></div>${L.length?L.map(qrow).join(""):`<div class="empty"><h3>No questions match</h3><p class="muted">Adjust the filters, or generate AI practice questions for this company and role.</p></div>`}`;
 $("#qlists").innerHTML=S.lists.length?`<h3 style="margin:24px 0 10px">Your practice lists</h3><div class="grid g2">${S.lists.map(l=>`<div class="card stack"><h4>${esc(l.name)}</h4><p class="small muted">${l.items.length} questions</p><div class="row"><button class="btn blue sm" data-act="lmock" data-id="${l.id}">Start mock</button><button class="btn ghost sm" data-act="ldel" data-id="${l.id}">Delete list</button></div></div>`).join("")}</div>`:""}
document.addEventListener("input",e=>{const i=e.target.closest("[data-qf]");if(!i)return;QF[i.dataset.qf]=i.type==="checkbox"?i.checked:i.value;if($("#qlist"))drawQ()});
document.addEventListener("change",e=>{const i=e.target.closest("[data-qf]");if(!i||i.tagName!=="SELECT")return;QF[i.dataset.qf]=i.value;if($("#qlist"))drawQ()});
ACT.qsel=t=>{t.checked?QSEL.add(t.dataset.id):QSEL.delete(t.dataset.id);drawQ()};
ACT.qbm=t=>{const q=S.qlib.find(x=>x.id===t.dataset.id);if(!q)return;const i=S.bookmarks.findIndex(b=>b.id===q.id);i>=0?S.bookmarks.splice(i,1):S.bookmarks.push(q);save();drawQ()};
/* template questions: used only when AI is unavailable, always labelled as templates */
const STOP=new Set("about their there which would should could with from that this have will your must able work team role years experience skills strong ability knowledge including across within based using other such also they them than into more most well need needs good great looking join help make part".split(" "));
function jdKeywords(jd){const c={};(jd||"").toLowerCase().replace(/[^a-z0-9+#& ]+/g," ").split(/\s+/).filter(w=>w.length>4&&!STOP.has(w)).forEach(w=>c[w]=(c[w]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0])}
function templateQs(F){const co=F.company||"this company",ro=F.role||"the role",ar=F.role?"a "+F.role:"the role",rl=F.role?F.role+" role":"role",lv=F.level?"the "+F.level+" level":"your level",kw=jdKeywords(F.jd),cvf=S.cv&&S.cv.use&&S.cv.fields?S.cv.fields:null,sk=cvf?(cvf.skills||[]).slice(0,3):[],ex=cvf?(cvf.experience||[])[0]:"",pr=cvf?(cvf.projects||[])[0]:"";
 const B={
 "HR":[`Walk me through your background and why ${ar} is the right next step for you.`,`Why do you want to work at ${co}?`,`What are your strengths and one weakness you are actively working on?`,`Where do you see yourself in three to five years?`,`What kind of work environment brings out your best?`,`Are you comfortable with the location, hours and travel ${F.role?'this '+F.role+' role':'this role'} may need?`],
 "Behavioural":[`Tell me about a time you led a team or a project under pressure. What was the outcome?`,`Describe a disagreement with a teammate or manager. How did you handle it?`,`Give an example of a failure. What did you change afterwards?`,`Tell me about a time you had to learn something quickly to deliver a result.`,`Describe a time you influenced someone without having authority over them.`,`Tell me about the achievement you are proudest of and your exact contribution.`],
 "Technical":[`Which core concepts or tools matter most for ${ar} at ${lv}, and how have you used them?`,`Explain a concept from your field to a non-expert in two minutes.`,`Walk me through how you would approach a problem you have never seen before in ${rl==='role'?'this field':F.role}.`,`What metrics would you track to judge success in ${F.role?'a '+F.role+' function':'this function'}, and why?`,`Describe a technical or analytical decision you made and the trade-offs involved.`],
 "Situational":[`A deadline is at risk and your team is stretched. What do you do in the first hour?`,`Your manager gives instructions you think are wrong. How do you respond?`,`Two stakeholders ask you for conflicting things on the same day. How do you decide?`,`You discover an error in work you already submitted. What do you do?`,`You join ${co} and find a process that clearly wastes time. What is your approach?`],
 "Role-specific":[`What does a strong first 90 days look like for ${ar} at ${co}?`,`What do you think are the biggest challenges for ${ar} in the ${F.industry||"industry"} today?`,`How would you prioritise your work if you had five competing tasks in ${F.role?'a '+F.role+' role':'this role'}?`,`Which part of the job do you expect to find hardest, and how will you prepare?`],
 "Case / estimation":[`Estimate how many customers ${co} might serve in one city in a month. State your assumptions.`,`Sales at ${co} fell 10% in a quarter. How would you diagnose the cause?`,`How would you decide whether ${co} should enter a new city or segment?`],
 "Motivation & fit":[`What do you know about ${co}'s business and what attracts you to it?`,`Why should we hire you over other candidates for ${F.role?'this '+F.role+' position':'this position'}?`,`What would make you leave a job within a year?`],
 "Current affairs":[`Which recent development in the ${F.industry||"business"} world do you think matters most, and why?`,`How might current economic conditions affect ${co} or its customers?`]};
 const extra=[];
 kw.forEach(k=>extra.push(["Role-specific",`The job description mentions “${k}”. Describe the strongest example of it in your experience.`]));
 sk.forEach(s=>extra.push(["Technical",`Your CV lists “${s}”. Give a concrete example of where you applied it and what changed because of it.`]));
 if(ex)extra.push(["Behavioural",`On your CV you list: “${ex.slice(0,120)}”. What was the hardest part and what would you do differently?`]);
 if(pr)extra.push(["Technical",`Tell me about your project “${pr.slice(0,100)}”: your role, the decisions you made and the result.`]);
 const types=F.type?[F.type]:["HR","Behavioural","Technical","Situational","Role-specific"];
 const pool=[];const idx={};let more=true;
 types.forEach(t=>idx[t]=0);
 while(more){more=false;types.forEach(t=>{const arr=B[t]||[];if(idx[t]<arr.length){pool.push([t,arr[idx[t]++]]);more=true}})}
 const mix=[];const ex2=F.type?extra.filter(e=>e[0]===F.type||true):extra;
 let i=0,e=0;pool.forEach((p,n)=>{mix.push(p);if(n%2===1&&e<ex2.length)mix.push(ex2[e++])});while(e<ex2.length)mix.push(ex2[e++]);
 return mix.slice(0,10).map(([t,q])=>({q,type:t}))}
const mkQ=(x,label)=>({id:uid(),q:String(x.q),type:QTYPES.includes(x.type)?x.type:(QF.type||"Role-specific"),company:QF.company,role:QF.role,industry:QF.industry,round:QF.round,level:QF.level,label,at:Date.now()});
function qSummary(){return [QF.company,QF.role,QF.level].filter(Boolean).join(" · ")}
let QGEN=0;
ACT.qgen=async()=>{const st=$("#qgstat"),btn=$("#qgbtn");
 if(!QF.company&&!QF.role&&!QF.industry){st.innerHTML=`<div class="err" role="alert">Choose a company, a role or an industry first.</div>`;$("#qc")&&$("#qc").focus();return}
 const my=++QGEN;if(btn)btn.disabled=true;st.innerHTML=loading("Generating practice questions…");
 const cvTxt=S.cv&&S.cv.use&&S.cv.fields?`Candidate CV details: ${JSON.stringify(S.cv.fields).slice(0,2000)}`:"";
 const pf=QF.company?packFor(QF.company,QF.role||""):null;const rep=pf?pf.items.reported.filter(x=>x.lit!==false&&!S.qlib.some(z=>z.q===x.q&&z.company===QF.company)).map(x=>({...mkQ({q:x.q,type:"Role-specific"},"reported"),src:pf.srcOf(x.src)})):[];
 const finish=(items,label,note)=>{if(my!==QGEN)return;S.qlib=[...rep,...items.map(x=>mkQ(x,label)),...S.qlib].slice(0,400);save();QF.kw="";const k=$("#qk");if(k)k.value="";drawQ();st.innerHTML=note;if(btn)btn.disabled=false;const l=$("#qlist");if(l&&l.scrollIntoView)l.scrollIntoView({behavior:"smooth",block:"start"})};
 const retry=`<button class="btn pri sm" data-act="qgen">Try AI again</button>`;
 try{const r=await ai(`Write 10 interview PRACTICE questions tailored to: company ${QF.company||"(any)"}, role ${QF.role||"(any)"}, industry ${QF.industry||"(any)"}, interview round ${QF.round||"(any)"}, candidate level ${QF.level||"(any)"}. ${QF.type?"All questions must be of type "+QF.type+".":"Mix these types: HR, Behavioural, Technical, Situational, Role-specific."} ${QF.jd?"Job description to draw on: "+QF.jd.slice(0,3000):""} ${cvTxt} They must be original practice questions and must never be presented as questions the company really asked. Do not state facts about the company that you are not sure of. Reply with only a JSON array: [{"q":"","type":"one of ${QTYPES.join(" | ")}"}]`,{tier:"default",cache:false});
  const items=(Array.isArray(r)?r:Array.isArray(r&&r.questions)?r.questions:[]).filter(x=>x&&x.q&&String(x.q).length>8);
  if(!items.length)throw{code:"invalid_json"};
  finish(items,"ai",`<div class="note ok">Added ${items.length} AI-generated practice questions for ${esc(qSummary())}.</div>`)}
 catch(e){const fb=templateQs(QF);
  finish(fb,"template",`<div class="note bad" role="alert"><b>AI could not generate questions.</b> ${esc(aiMsg(e))}<br>Showing ${fb.length} template practice questions built from your selections instead. They are generic and are not AI-generated. <span style="display:inline-block;margin-top:8px">${retry}</span></div>`)}};
/* save-to-list uses an inline form, since dialogs are blocked */
ACT.qlist=t=>{const box=$("#qlists");box.insertAdjacentHTML("afterbegin",`<form data-form="newlist" class="card row" style="margin-top:16px"><div class="field" style="flex:1"><label for="ln">List name</label><input id="ln" name="name" required placeholder="e.g. Puma marketing round"></div><button class="btn pri" type="submit">Save list</button></form>`);$("#ln").focus()};
FORM.newlist=(f,d)=>{const n=(d.name||"").trim();if(!n)return;S.lists.push({id:uid(),name:n,items:S.qlib.filter(q=>QSEL.has(q.id))});QSEL.clear();save();toast("List saved");drawQ()};
ACT.ldel=t=>{S.lists=S.lists.filter(l=>l.id!==t.dataset.id);save();drawQ()};
ACT.qmock=()=>{PENDING_SET={name:"Selected questions",items:S.qlib.filter(q=>QSEL.has(q.id))};go("/interviews/new")};
ACT.lmock=t=>{const l=S.lists.find(x=>x.id===t.dataset.id);PENDING_SET={name:l.name,items:l.items};go("/interviews/new")};

/* ---------- reports ---------- */
R(/^\/reports$/,()=>({private:true,nav:"/reports",title:"My Reports",html:`${head("My reports","Saved in this browser. Private to you.")}
<h3 style="margin-bottom:10px">AI interviews</h3>${S.reports.length?`<div class="stack">${S.reports.map(r=>`<a class="card row between" href="#/reports/${r.id}"><span><b>${esc(r.company)}</b> · ${esc(r.role)}<br><span class="small muted">${esc(r.round)} · ${fmtDate(r.date)}</span></span><span class="score" style="font-size:28px">${r.overall}</span></a>`).join("")}</div>`:`<div class="empty"><h3>No interview reports</h3><p style="margin-top:10px">${A("/interviews/new","Start your first interview","btn pri")}</p></div>`}
<h3 style="margin:26px 0 10px">Group discussions</h3>${S.gdReports.length?`<div class="stack">${S.gdReports.map(r=>`<a class="card row between" href="#/reports/gd/${r.id}"><span><b>${esc(r.topic)}</b><br><span class="small muted">${fmtDate(r.date)}</span></span><span class="pill">${r.overall!=null?r.overall+"/100":(r.limited?"Limited evidence":"Scored")}</span></a>`).join("")}</div>`:`<div class="empty"><h3>No GD reports</h3><p style="margin-top:10px">${A("/gd","Find a GD session","btn pri")}</p></div>`}`}));
const DIMS=[["communication","Communication"],["clarity","Clarity"],["reasoning","Reasoning"],["roleKnowledge","Role knowledge"],["relevance","Relevance"],["answerQuality","Answer quality"],["cvCredibility","CV credibility"],["roleFit","Role fit"],["domainKnowledge","Domain knowledge"],["problemSolving","Problem-solving and reasoning"],["structure","Structured thinking"]];
R(/^\/reports\/([^/]+)$/,id=>{const r=S.reports.find(x=>x.id===id);if(!r)return{private:true,nav:"/reports",html:`<div class="empty"><h3>Report not found</h3><p style="margin-top:10px">${A("/reports","My reports","btn pri")}</p></div>`};
 return{private:true,nav:"/reports",title:"Report · "+r.company,html:`${crumbs([["/reports","My Reports"],[null,r.company]])}
<div class="panel notch" style="padding:26px 28px"><span class="eyebrow" style="color:var(--muted)">${esc(r.round)} · ${esc(r.difficulty)} · ${fmtDate(r.date)}</span><h2 style="margin:6px 0 14px;font-size:clamp(24px,4vw,34px)">${esc(r.company)} · ${esc(r.role)}</h2><div class="row" style="gap:20px"><div><div class="score" style="">${r.overall}</div><div class="small" style="color:var(--muted)">Interview readiness / 100</div></div><p style="max-width:52ch;color:var(--ink)">${esc(r.summary)}</p></div></div>
${r.strict&&(r.strict.notes||[]).length?`<details class="card" style="margin-top:12px"><summary style="cursor:pointer;font-weight:700">Why this score (${r.strict.notes.length} strict check${r.strict.notes.length==1?"":"s"} applied)</summary><p class="small muted" style="margin:8px 0">The AI proposed scores; these automatic checks on your transcript lowered them. Confidence and speaking time are not rewarded.</p>${jl(r.strict.notes,x=>`<li class="small">${x.q?`Q${x.q}`:"Overall"}: ${x.from} → ${x.to}. ${esc(x.why)}</li>`)}</details>`:""}
<div class="note info" style="margin-top:12px">Readiness measures how this practice interview went. It is separate from your fit for any job and does not predict a hiring decision.</div>
<div class="grid g2" style="margin-top:16px"><div class="card stack"><h3>Score breakdown</h3>${DIMS.filter(([k])=>k in r.dims).map(([k,l])=>`<div><div class="row between small"><span>${l}</span><b>${r.dims[k]==null?"Not assessed":r.dims[k]}</b></div><div class="bar"><i style="width:${+r.dims[k]||0}%"></i></div></div>`).join("")}${(r.notAssessed||[]).length?`<div class="small muted"><b>Not assessed from the transcript:</b> ${r.notAssessed.map(esc).join("; ")}. Tone, pace and body language are never scored.</div>`:""}</div>
<div class="card stack"><h3>Strengths</h3>${jl(r.strengths)}<h3 style="margin-top:8px">To improve</h3>${jl(r.improvements)}</div></div>
${r.cv&&(r.cv.note||(r.cv.consistent||[]).length||(r.cv.unsupported||[]).length)?`<div class="card stack" style="margin-top:16px"><h3>CV credibility</h3><p>${esc(r.cv.note||"")}</p><div class="grid g2"><div><h4>Backed up in your answers</h4>${jl(r.cv.consistent)}</div><div><h4>Stayed vague or unverified</h4>${jl(r.cv.unsupported)}${(r.cv.contradictions||[]).length?`<h4>Conflicts with the CV</h4>${jl(r.cv.contradictions)}`:""}</div></div></div>`:""}
${r.roleFitNote||r.domainNote||r.commNote?`<div class="grid g3" style="margin-top:16px"><div class="card stack"><h4>Role fit</h4><p class="small">${esc(r.roleFitNote||"")}</p></div><div class="card stack"><h4>Domain knowledge</h4><p class="small">${esc(r.domainNote||"")}</p></div><div class="card stack"><h4>Communication</h4><p class="small">${esc(r.commNote||"")}</p></div></div>`:""}
<h3 style="margin:24px 0 10px">Question-by-question feedback</h3><div class="stack">${r.perQuestion.map((p,i)=>{const t=r.turns[i]||{},src=(r.research&&r.research.sources||[]).find(x=>x.id===p.srcId);return`<div class="card stack"><div class="row between"><h4>Q${i+1}. ${esc(p.question)}</h4><span class="pill">${p.score??"–"}/100</span></div><div class="chips"><span class="pill ${p.origin==="reported"?"ok":p.origin==="cv"?"":"ai"}">${esc((typeof ORIGIN_LABEL!=="undefined"&&ORIGIN_LABEL[p.origin])||(t.kind==="followup"?"Follow-up on your answer":"Practice question"))}</span>${p.type&&typeof TYPE_LABEL!=="undefined"&&TYPE_LABEL[p.type]?`<span class="pill">${esc(TYPE_LABEL[p.type])}</span>`:""}</div>${p.basis&&p.origin!=="reported"?`<div class="tiny muted">Why asked: ${esc(p.basis)}</div>`:""}${src?`<div class="tiny muted">Source: <a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">${esc(src.title)}</a></div>`:""}<div class="small muted">Your answer</div><div class="q">${esc((t&&t.a)||"")}</div>${p.quote?`<div class="tiny muted">Evidence from your answer: “${esc(p.quote)}”</div>`:""}${p.words!=null&&p.words<25?`<div class="tiny" style="color:var(--bad)">Only ${p.words} word${p.words==1?"":"s"}: too short to show your thinking.</div>`:""}${p.worked?`<div><b>What worked.</b> ${esc(p.worked)}</div>`:p.feedback?`<div><b>Feedback.</b> ${esc(p.feedback)}</div>`:""}${p.missing?`<div><b>What was missing.</b> ${esc(p.missing)}</div>`:""}${p.improved?`<details><summary style="cursor:pointer;font-weight:700">Stronger answer from your own experience</summary><p style="margin-top:8px">${esc(p.improved)}</p></details>`:""}</div>`}).join("")}</div>
${r.research?`<div class="card stack" style="margin-top:16px"><h3>Research behind this interview</h3><p class="small">${r.research.sources&&r.research.sources.length?`Public candidate reports and guides for <b>${esc(r.company)}</b> were used (role match: ${esc(r.research.match)}, evidence: ${esc(r.research.evidence)}). These are anecdotal and not official.`:`No collected public interview reports exist for <b>${esc(r.company)}</b>. Questions came from your CV and ${r.research.hasBrief?"an AI briefing on the role and domain (general knowledge, unverified)":"standard role templates"}; none is presented as reported by the company.`}</p>${(r.research.sources||[]).map(x=>`<div class="small"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a> <span class="muted">· ${esc(x.kind)}</span></div>`).join("")}<p class="tiny muted">CV analysed ${r.research.cvAi?"by AI plus automatic checks":"by automatic checks only"}. Plan ${r.research.planAi?"designed by AI":"built by rules"}. Label key: ${Object.keys(r.research.origins||{}).map(k=>`${esc((typeof ORIGIN_LABEL!=="undefined"&&ORIGIN_LABEL[k])||k)} (${r.research.origins[k]})`).join(", ")}.</p></div>`:""}
${(r.missed||[]).length?`<div class="card stack" style="margin-top:16px"><h3>Missed opportunities</h3>${jl(r.missed)}</div>`:""}
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Topics to revise</h3>${jl(r.revision)}</div><div class="card"><h3>Your preparation plan</h3>${jl(r.plan,x=>`<li><b>${esc(x.when)}.</b> ${esc(x.step)}</li>`)}</div></div>
<div class="row" style="margin-top:18px"><a class="btn pri" href="#/interviews/new/${slugify(r.company)}">Practise again</a><button class="btn ghost" data-act="rdel" data-id="${r.id}">Delete report</button></div>`}});
ACT.rdel=t=>{if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Confirm delete";return}S.reports=S.reports.filter(r=>r.id!==t.dataset.id);save();toast("Report deleted");go("/reports")};
</script>
