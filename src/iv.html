<script>
/* ---------- Voice-only AI interview ---------- */
const monthN=()=>S.sessions.filter(s=>new Date(s.startedAt).getMonth()===new Date().getMonth()).length;
const sById=id=>S.sessions.find(s=>s.id===id);
const fmtClock=sec=>{sec=Math.max(0,Math.round(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")};
const wc=t=>(String(t||"").trim().match(/\S+/g)||[]).length;

/* ----- speech out (text-to-speech) ----- */
const TTS=typeof speechSynthesis!=="undefined"&&typeof SpeechSynthesisUtterance!=="undefined";
let voiceCache=null,speakTok=0;
function pickVoice(){if(!TTS)return null;const vs=speechSynthesis.getVoices();if(!vs.length)return null;if(voiceCache&&vs.includes(voiceCache))return voiceCache;
 for(const re of [/en[-_]IN/i,/en[-_]GB/i,/en[-_]US/i,/^en/i]){const m=vs.filter(v=>re.test(v.lang));const nat=m.find(v=>/natural|neural|google|online/i.test(v.name))||m[0];if(nat){voiceCache=nat;return nat}}return vs[0]}
function speak(text){const tok=++speakTok;return new Promise((res,rej)=>{if(!TTS){rej(new Error("tts-missing"));return}
 try{speechSynthesis.cancel()}catch(e){}
 const parts=String(text).replace(/\s+/g," ").match(/[^.!?]+[.!?]*/g)||[String(text)];let i=0,started=false;
 const guard=setTimeout(()=>{if(tok===speakTok){try{speechSynthesis.cancel()}catch(e){}started?res():rej(new Error("tts-silent"))}},Math.max(8000,String(text).length*140));
 const next=()=>{if(tok!==speakTok){clearTimeout(guard);res();return}if(i>=parts.length){clearTimeout(guard);res();return}
  const u=new SpeechSynthesisUtterance(parts[i++].trim());const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}u.rate=.97;u.pitch=1;
  u.onstart=()=>{started=true};u.onend=()=>next();u.onerror=ev=>{if(ev&&(ev.error==="interrupted"||ev.error==="canceled")){clearTimeout(guard);res();return}clearTimeout(guard);rej(new Error("tts-error"))};
  try{speechSynthesis.speak(u)}catch(e){clearTimeout(guard);rej(e)}};
 next()})}
function stopSpeak(){speakTok++;try{TTS&&speechSynthesis.cancel()}catch(e){}}
if(TTS)try{speechSynthesis.onvoiceschanged=()=>{voiceCache=null}}catch(e){}

/* ----- speech in (speech recognition with recovery) ----- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const L={rec:null,active:false,base:"",cur:"",silence:null,hold:false,patience:3500,nos:0,net:0,cb:null};
const SRERR={"not-allowed":"Microphone access is blocked. Allow the microphone for this page in your browser's site settings, then retry.","service-not-allowed":"The browser blocked speech recognition for this page. If ROLEVIA is embedded, open it in a full browser tab, then retry.","audio-capture":"No microphone was found. Connect or enable a microphone, then retry.","network":"Speech recognition lost its network connection. Check your internet, then retry.","language-not-supported":"Speech recognition does not support this language setting.","unsupported":"This browser does not support speech recognition. Use Chrome, Edge or Safari on a device with a microphone."};
function lStart(cb){L.cb=cb;L.base="";L.cur="";L.hold=false;L.nos=0;L.net=0;if(!SR){cb.fatal("unsupported");return}L.active=true;lRun()}
function lRun(){if(!L.active)return;let r;try{r=new SR()}catch(e){L.active=false;L.cb.fatal("unsupported");return}
 L.rec=r;r.lang="en-IN";r.continuous=true;r.interimResults=true;
 r.onstart=()=>L.cb.status("listening");
 r.onsoundstart=()=>L.cb.sound&&L.cb.sound();
 r.onresult=e=>{L.nos=0;L.net=0;L.hold=false;const t=Array.from(e.results).map(x=>x[0].transcript).join(" ").trim();L.cur=(L.base+" "+t).trim();L.cb.update(L.cur);clearTimeout(L.silence);
  if(L.cur)L.silence=setTimeout(()=>{if(L.active&&!L.hold&&L.cur.trim().length>1)L.cb.auto(L.cur)},wc(L.cur)<8?L.patience+1500:L.patience)};
 r.onerror=e=>{const c=e.error;
  if(c==="no-speech"){L.nos++;L.cb.quiet&&L.cb.quiet(L.nos)}
  else if(c==="not-allowed"||c==="service-not-allowed"||c==="audio-capture"||c==="language-not-supported"){L.active=false;L.cb.fatal(c)}
  else if(c==="network"){L.net++;if(L.net>2){L.active=false;L.cb.fatal("network")}else L.cb.status("retry")}};
 r.onend=()=>{if(L.active){L.base=L.cur;setTimeout(lRun,250)}};
 try{r.start()}catch(e){setTimeout(()=>{if(L.active)lRun()},400)}}
function lStop(){L.active=false;clearTimeout(L.silence);try{L.rec&&L.rec.abort()}catch(e){}L.rec=null}
function lHold(ms){L.hold=true;clearTimeout(L.silence)}

/* ----- list page ----- */
R(/^\/interviews$/,()=>{const ls=liveSession();return{private:true,nav:"/interviews",title:"AI Mock Interviews",html:`${head("AI voice interviews","The interviewer speaks every question and listens to your spoken answers. There is no typing.")}
<div class="grid g2"><div class="card stack"><h3>Start a new interview</h3><p class="muted">Choose a company, role and round, check your microphone, then talk it through.</p><div>${A("/interviews/new","Set up an interview","btn pri")}</div></div>
<div class="card stack"><h3>This month</h3><p><span class="score" style="font-size:36px">${monthN()}</span> <span class="muted">interviews started. The Free plan includes 3 mock interviews for a year. Limits are configurable and not enforced until billing is set up.</span></p></div></div>
${ls?`<div class="note info" style="margin-top:16px">You have an unfinished interview with ${esc(ls.company)}. ${A("/interviews/live/"+ls.id,"Resume it")}</div>`:""}
<h3 style="margin:24px 0 10px">Previous attempts</h3>${S.reports.length?`<div class="stack">${S.reports.map(r=>`<a class="card row between" href="#/reports/${r.id}"><span><b>${esc(r.company)}</b> · ${esc(r.role)} · ${esc(r.round)}<br><span class="small muted">${fmtDate(r.date)}</span></span><span class="score" style="font-size:28px">${r.overall}</span></a>`).join("")}</div>`:`<div class="empty"><h3>No attempts yet</h3><p class="muted">Finish an interview and its report shows up here.</p></div>`}`}});

/* ----- setup wizard: target, CV and details, prepare (analysis + research + plan) and audio check ----- */
const SU={step:1,v:{},mic:false,spk:false,micMsg:"",micBusy:false,heard:"",prep:null};
const suV=k=>SU.v[k]!==undefined?SU.v[k]:"";
R(/^\/interviews\/new(?:\/([^/]+))?$/,slug=>{const co=slug&&S.companies[slug]?S.companies[slug].name:"";
 const fresh=()=>({company:co,domain:"",role:S.profile.roles[0]||"Marketing",level:S.profile.level||LEVELS[0],round:ROUNDS[0],duration:"20",difficulty:"Standard",jd:""});
 if(!SU.v.role||slug){SU.v=Object.assign(fresh(),slug?{company:co}:{});SU.prep=null}
 if(!SU.v.domain&&SU.v.company){const p=POP.find(x=>normName(x[0])===normName(SU.v.company))||(findPack(SU.v.company)&&[0,findPack(SU.v.company).industry]);if(p)SU.v.domain=p[1]}
 SU.step=1;
 return{private:true,nav:"/interviews",title:"Interview setup",html:`${crumbs([["/interviews","AI Mock Interviews"],[null,"New interview"]])}${head("Set up your voice interview","Questions are built from your CV, the company, the domain and the role.")}<div id="su"></div>`,mount:()=>{drawSetup();return()=>{lStop();stopSpeak()}}}});
const SUSTEPS=["Target","CV and details","Prepare and audio check"];
const suKey=()=>JSON.stringify([SU.v.company,SU.v.domain,SU.v.role,SU.v.level,SU.v.round,SU.v.duration,SU.v.difficulty,(SU.v.jd||"").length,S.cv&&S.cv.updated]);
function suSteps(){return`<div class="tabs" role="list" style="margin-bottom:14px">${SUSTEPS.map((t,i)=>`<span role="listitem" class="tab" ${SU.step===i+1?'aria-current="step"':""} style="${SU.step===i+1?"font-weight:800":"opacity:.6"}">${i+1}. ${t}</span>`).join("")}</div>`}
function cvUploadBlock(){const c=S.cv;return`<div class="card stack" style="background:var(--lav-soft)"><div class="row between"><b>Your CV <span class="small" style="color:var(--bad)">(required)</span></b><span data-cvpill>${cvPill()}</span></div>
 ${window.ROLEVIA_SITE?`<div class="note small">AI features on this website send your CV text and answers to Google’s Gemini API (free tier). Google may use free-tier data to improve its products.</div>`:""}<p class="small muted">The interviewer reads your whole CV and asks about your real experience, results and gaps. PDF or DOCX, up to 5 MB. Upload is the only way to add a CV.</p>
 <label class="drop" for="cf" id="drop"><input id="cf" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" data-act="cvfile" style="position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%"><span><b>${c?"Replace file":"Choose a file"}</b> or drop it here</span></label>
 <div id="cvname" class="small">${c?`Current: <b>${esc(c.fileName)}</b> · ${(c.size/1024).toFixed(0)} KB`:"No file chosen yet"}</div><div id="cvstat"></div><div class="row"><button class="btn ghost sm" id="cvretry" data-act="cvretry" hidden>Retry</button></div></div>`}
function drawSetup(){const el=$("#su");if(!el)return;const set=PENDING_SET;let body="";
 if(SU.step===1){const pf=suV("company")?packFor(suV("company"),suV("role")):null;
  body=`${set?`<div class="note info" style="margin-bottom:12px">Using your “${esc(set.name)}” set (${set.items.length} questions) as extra material.</div>`:""}<div class="grid g2"><div class="field"><label for="ic">Target company</label><input id="ic" name="company" value="${esc(suV("company"))}" list="cl2" placeholder="e.g. Puma" autocomplete="off"><datalist id="cl2">${POP.map(p=>`<option value="${esc(p[0])}">`).join("")}${S.profile.targets.map(t=>`<option value="${esc(t)}">`).join("")}</datalist></div>
  <div class="field"><label for="idm">Domain / industry</label><select id="idm" name="domain"><option value="">Select…</option>${INDUSTRIES.map(r=>`<option ${r===suV("domain")?"selected":""}>${r}</option>`).join("")}</select></div>
  <div class="field"><label for="ir">Job role</label><select id="ir" name="role">${ROLES.map(r=>`<option ${r===suV("role")?"selected":""}>${r}</option>`).join("")}</select></div>
  <div class="field"><label for="il">Experience level</label><select id="il" name="level">${LEVELS.map(l=>`<option ${l===suV("level")?"selected":""}>${l}</option>`).join("")}</select></div>
  <div class="field"><label for="io">Interview round</label><select id="io" name="round">${ROUNDS.map(r=>`<option ${r===suV("round")?"selected":""}>${r}</option>`).join("")}</select></div></div>
  ${pf?`<div class="note info small"><b>Public research found for ${esc(pf.pack.name)}.</b> ${pf.pack.sources.length} source${pf.pack.sources.length==1?"":"s"}; evidence is anecdotal and limited. The match for your role: <b>${pf.match}</b>.</div>`:suV("company")?`<div class="note small">No collected public interview reports for ${esc(suV("company"))}. The interview will use your CV plus an AI briefing on the role and domain, clearly marked as not company-reported.</div>`:""}`}
 else if(SU.step===2)body=`<div class="grid g2"><div class="field"><label for="id">Duration</label><select id="id" name="duration">${[["10","10 minutes · about 4 questions"],["20","20 minutes · about 7 questions"],["30","30 minutes · about 10 questions"]].map(([v,t])=>`<option value="${v}" ${v===suV("duration")?"selected":""}>${t}</option>`).join("")}</select></div>
 <div class="field"><label for="if">Difficulty</label><select id="if" name="difficulty">${["Easy","Standard","Hard"].map(x=>`<option ${x===suV("difficulty")?"selected":""}>${x}</option>`).join("")}</select></div></div>
 <div class="field"><label for="ij">Job description (optional)</label><textarea id="ij" name="jd" placeholder="Paste the posting so the interviewer can tailor questions" style="min-height:90px">${esc(suV("jd"))}</textarea></div>${cvUploadBlock()}`;
 else body=prepPanel();
 const canStart=SU.prep&&SU.prep.status==="done"&&SU.mic&&SU.spk;
 el.innerHTML=`<div class="card stack lg">${suSteps()}${body}<div class="err" id="ierr" role="alert"></div><div class="row">${SU.step>1?`<button class="btn ghost" data-act="suback">Back</button>`:""}${SU.step<3?`<button class="btn pri" data-act="sunext">Continue</button>`:`<button class="btn pri" data-act="sustart" ${canStart?"":"disabled"}>Start interview</button>`}</div></div>`;
 const dz=$("#drop");if(dz){["dragover","dragenter"].forEach(ev=>dz.addEventListener(ev,e=>e.preventDefault()));dz.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)cvHandle(f).then(ok=>{if(ok)drawSetup()})})}}
function prepPanel(){const P=SU.prep;
 const stepRow=(label,st,det)=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span style="width:22px;text-align:center">${st==="done"?"✓":st==="run"?'<span class="spin"></span>':st==="err"?"!":"·"}</span><div><b>${label}</b>${det?`<div class="small muted">${det}</div>`:""}</div></div>`;
 let h=`<div class="stack"><h3>Preparing your interview</h3>`;
 if(!P||P.status==="idle")h+=`<p class="muted">ROLEVIA will analyse your CV, look up what is publicly known about ${esc(suV("company")||"your target")} for this role, and design an interview plan.</p><div><button class="btn pri" data-act="suprep">Analyse CV and prepare</button></div>`;
 else{h+=`<div class="card stack">${stepRow("Reading and analysing your CV",P.s1,P.d1)}${stepRow("Researching "+esc(suV("company")||"the company")+" and the "+esc(suV("role"))+" role",P.s2,P.d2)}${stepRow("Designing your interview plan",P.s3,P.d3)}</div>`;
  if(P.status==="err")h+=`<div class="note bad" role="alert">${esc(P.err)}</div><div class="row"><button class="btn pri" data-act="suprep">Retry</button></div>`;
  if(P.status==="done")h+=prepSummary(P)}
 h+=`</div>`;
 if(P&&P.status==="done")h+=`<div class="stack"><h3>Audio check</h3>${audioCheck()}</div>`;
 return h}
function prepSummary(P){const an=P.an,pf=P.pf,o=planSummary(P.plan);
 return`<div class="grid g2"><div class="card stack"><h4>What an interviewer is likely to question in your CV</h4>${(an.probeAreas||[]).slice(0,6).map(p=>`<div class="small"><b>${esc(p.area)}</b><div class="muted">${esc(p.why)}</div></div>`).join("")||'<p class="muted small">No areas found.</p>'}${an.gaps&&an.gaps.length?`<div class="small"><b>Gaps noticed:</b> ${an.gaps.map(g=>esc(g.what)).join("; ")}</div>`:""}<p class="tiny muted">${an.viaAi?"Analysed by AI plus automatic checks.":"AI was unavailable, so this uses automatic CV checks only."}</p></div>
 <div class="card stack"><h4>Research behind this interview</h4>${pf?`<p class="small"><b>${esc(pf.pack.name)}</b>: ${pf.items.reported.length} reported question${pf.items.reported.length==1?"":"s"} and ${pf.items.process.length+pf.items.patterns.length} process notes apply to a ${esc(suV("role"))} role. Role match: <b>${pf.match}</b>; evidence: <b>${pf.evidence}</b>.</p>${pf.otherRoles.length?`<p class="small muted">The sources are mostly about other roles (${pf.otherRoles.join(", ")}), so they are used only where they transfer.</p>`:""}<div class="small">${pf.pack.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`).join("<br>")}</div>`:`<p class="small">No collected public interview reports for ${esc(suV("company")||"this company")}, so no question will be presented as reported by that company.</p>`}${P.brief?`<p class="small muted">Plus an AI briefing on the role and domain (general knowledge, unverified).</p>`:P.d2err?`<p class="small muted">${esc(P.d2err)}</p>`:""}</div></div>
 <div class="card"><b>Interview plan:</b> <span class="small">${P.plan.length} planned areas ·</span> ${Object.entries(o).map(([k,n])=>`<span class="pill">${n} ${esc(ORIGIN_LABEL[k]||k)}</span>`).join(" ")}<p class="small muted" style="margin-top:6px">${P.planAi?"Planned by AI.":"AI was unavailable, so a rule-based plan from your CV and the research is used. Follow-ups will not adapt."} Questions are not shown in advance; they are spoken and adapt to your answers.</p></div>`}
ACT.suprep=async()=>{suCollect();const er=$("#ierr");if(!S.cv){er.textContent="Upload your CV first (step 2).";return}
 const key=suKey();const P=SU.prep={status:"run",key,s1:"run",s2:"idle",s3:"idle"};drawSetup();
 try{P.an=await analyseCv();P.s1="done";P.d1=(P.an.viaAi?"AI read your full CV":"Automatic checks (AI unavailable)")+` · ${(P.an.probeAreas||[]).length} areas to probe`;
  P.s2="run";drawSetup();const sel={...SU.v,setQs:PENDING_SET?PENDING_SET.items.map(q=>({q:q.q||q.text||String(q),type:q.type,label:q.label,src:q.src})):[]};P.pf=packFor(sel.company,sel.role);
  try{P.brief=await researchBrief(sel,P.pf)}catch(e){P.brief=null;P.d2err="The AI briefing could not be generated ("+aiMsg(e)+"). Only the collected public notes and your CV are used."}
  P.s2="done";P.d2=(P.pf?`${P.pf.pack.name}: ${P.pf.items.reported.length+P.pf.items.process.length+P.pf.items.patterns.length} collected notes (${P.pf.match} role match)`:"No collected reports for this company")+(P.brief?" + AI briefing":"");
  P.s3="run";drawSetup();const total=+sel.duration<=10?4:+sel.duration<=20?7:10;
  const pl=await buildPlan(sel,P.an,P.pf,P.brief,total);P.plan=pl.slots;P.planAi=pl.viaAi;P.s3="done";P.d3=`${P.plan.length} areas`+(pl.viaAi?"":" (rule-based)");
  P.status="done"}
 catch(e){P.status="err";P.err=(e&&e.message)||"Preparation failed. Try again.";if(P.s1==="run")P.s1="err";else if(P.s2==="run")P.s2="err";else P.s3="err"}
 if(SU.step===3)drawSetup()};
function audioCheck(){
 const unsup=!SR||!TTS?`<div class="note bad" role="alert"><b>This browser cannot run a voice interview.</b> ${!SR?SRERR.unsupported:"Speech output is not available."} The interview is voice-only, so use a supported browser.</div>`:"";
 return`<div class="stack"><p class="muted">The interview is voice-only. Check that you can hear the interviewer and that the interviewer can hear you.</p>${unsup}
 <div class="card stack"><div class="row between"><div><b>1. Speaker</b><div class="small muted">Plays a short spoken greeting.</div></div><span class="pill ${SU.spk?"ok":""}">${SU.spk?"Confirmed":"Not checked"}</span></div>
 <div class="row"><button class="btn ghost sm" data-act="testspk" ${TTS?"":"disabled"}>Play test voice</button>${SU.spkPlayed?`<button class="btn blue sm" data-act="spkyes">I heard it</button><button class="btn ghost sm" data-act="spkno">I didn't hear it</button>`:""}</div><div class="small" id="spkmsg">${SU.spkMsg||""}</div></div>
 <div class="card stack"><div class="row between"><div><b>2. Microphone</b><div class="small muted">Click, allow the microphone if asked, and say “I am ready”.</div></div><span class="pill ${SU.mic?"ok":""}">${SU.mic?"Working":SU.micBusy?"Listening…":"Not checked"}</span></div>
 <div class="row"><button class="btn ghost sm" data-act="testmic" ${SR&&!SU.micBusy?"":"disabled"}>${SU.micBusy?"Listening…":"Test microphone"}</button>${SU.micBusy?`<span class="rec"><i></i> Recording</span>`:""}</div>
 <div class="small" id="micmsg" role="status">${SU.micMsg||""}</div></div></div>`}
ACT.testspk=async()=>{SU.spkMsg="Playing…";SU.spkPlayed=false;drawSetup();try{await speak("Hello. This is your interviewer. If you can hear me clearly, press the button that says I heard it.");SU.spkPlayed=true;SU.spkMsg=""}catch(e){SU.spkMsg="No sound could be played. Check your volume and that this tab is not muted, then try again."}drawSetup()};
ACT.spkyes=()=>{SU.spk=true;SU.spkMsg="";drawSetup()};
ACT.spkno=()=>{SU.spk=false;SU.spkMsg="Raise your system volume, unmute this tab, or connect your speakers or headphones, then play the test again.";drawSetup()};
ACT.testmic=()=>{if(SU.micBusy)return;SU.micBusy=true;SU.mic=false;SU.micMsg="Waiting for microphone permission…";drawSetup();let done=false;
 const end=(ok,msg)=>{if(done)return;done=true;lStop();SU.micBusy=false;SU.mic=ok;SU.micMsg=msg;drawSetup()};
 const to=setTimeout(()=>end(false,"Nothing was heard in 12 seconds. Check that the right microphone is selected and not muted, then test again."),12000);
 lStart({status:()=>{SU.micMsg="Listening. Say “I am ready”.";const m=$("#micmsg");if(m)m.textContent=SU.micMsg},sound:()=>{const m=$("#micmsg");if(m)m.textContent="Sound detected…"},update:t=>{if(wc(t)>=1){clearTimeout(to);end(true,"Heard you: “"+t.slice(0,80)+"”. Your microphone works.")}},auto:()=>{},quiet:()=>{},fatal:c=>{clearTimeout(to);end(false,SRERR[c]||SRERR.unsupported)}})};
function suCollect(){const g=id=>{const e=$("#"+id);return e?e.value:undefined};
 const m={company:g("ic"),domain:g("idm"),role:g("ir"),level:g("il"),round:g("io"),duration:g("id"),difficulty:g("if"),jd:g("ij")};for(const k in m)if(m[k]!==undefined)SU.v[k]=m[k]}
document.addEventListener("input",e=>{if(e.target.id==="ic"&&$("#su")){const p=POP.find(x=>normName(x[0])===normName(e.target.value));const pk=findPack(e.target.value);const d=p?p[1]:pk?pk.industry:"";if(d&&$("#idm")&&!$("#idm").value)$("#idm").value=d}});
ACT.suback=()=>{suCollect();lStop();SU.micBusy=false;SU.step=Math.max(1,SU.step-1);drawSetup()};
ACT.sunext=()=>{suCollect();const er=$("#ierr");
 if(SU.step===1){if(!(SU.v.company||"").trim()){er.textContent="Enter a target company to continue.";$("#ic")&&$("#ic").focus();return}if(!SU.v.domain){er.textContent="Choose the domain or industry.";$("#idm")&&$("#idm").focus();return}}
 if(SU.step===2&&!S.cv){er.textContent="Upload your CV to continue. The interview is built from it.";return}
 if(SU.step===2&&SU.prep&&SU.prep.key!==suKey())SU.prep=null;
 SU.step=Math.min(3,SU.step+1);drawSetup();if(SU.step===3&&!SU.prep)ACT.suprep()};
ACT.sustart=()=>{suCollect();lStop();stopSpeak();const v=SU.v,P=SU.prep,co=(v.company||"").trim(),dur=+v.duration||20,total=dur<=10?4:dur<=20?7:10;
 if(!P||P.status!=="done"){$("#ierr").textContent="Finish preparing the interview first.";return}
 if(!SU.mic||!SU.spk){$("#ierr").textContent="Complete both audio checks first.";return}
 if(P.key!==suKey()){$("#ierr").textContent="Your details changed after preparation. Prepare again.";SU.prep=null;drawSetup();return}
 const s={id:uid(),company:co,domain:v.domain,slug:slugify(co),role:v.role,level:v.level,round:v.round,duration:dur,difficulty:v.difficulty,jd:(v.jd||"").slice(0,4000),useCv:true,custom:null,total,turns:[],status:"active",elapsed:0,startedAt:Date.now(),voice:true,
