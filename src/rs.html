 {id:"deloitte",name:"Deloitte",aka:["deloitte","deloitte india","deloitte usi"],industry:"Consulting",
  sources:[{id:"s1",title:"GeeksforGeeks: Deloitte India on-campus 2024 (Analyst)",url:"https://geeksforgeeks.org/deloitte-india-interview-experience-on-campus-2024",kind:"candidate report"},{id:"s2",title:"Glassdoor: Deloitte Analyst interview report",url:"https://www.glassdoor.co.in/Interview/Deloitte-Interview-E2763-RVW4881008.htm",kind:"candidate reports"}],
  process:[{role:"consulting",src:"s1",text:"2024 campus (Analyst): 60-minute online test (cognitive plus technical MCQs), then a group case discussion (groups of 7-9, one moderator; the case was improving sales for an automobile company), then a resume-based interview."},{role:"consulting",src:"s2",text:"Older and other Analyst reports: written test, case study (one was pharma), group discussion with eliminations, resume interview that can include puzzles; a recorded HireVue behavioural round is also reported."}],
  reported:[{role:"any",src:"s1",q:"Introduce yourself, then explain the projects and skills listed on your resume."},{role:"consulting",src:"s2",lit:false,q:"Puzzles to test analytical thinking were reported; the wording was not given."}],

 {id:"hul",name:"Hindustan Unilever",aka:["hindustan unilever","hul","unilever"],industry:"FMCG",
  sources:[{id:"s1",title:"AmbitionBox: Hindustan Unilever interview reports (Associate Manager)",url:"https://www.ambitionbox.com/interviews/hindustan-unilever-interview-questions/associate-manager",kind:"candidate report"},{id:"s2",title:"Glassdoor: Unilever placement-student interview reports (not India-specific)",url:"https://www.glassdoor.ie/Interview/Unilever-Interview-E3513-RVW102646497.htm",kind:"candidate reports"}],
  process:[{role:"mgmt",src:"s1",text:"Associate Manager (one report, Jan 2023): resume shortlist, a 10-minute group discussion on a trending general-knowledge topic, then a one-on-one covering introduction, expectations, a case-based situation and brand knowledge."}],
  reported:[{role:"any",src:"s1",q:"Who are you? Where do you see yourself in five years?"},{role:"any",src:"s2",q:"Walk me through an experience of tackling a daunting project."},{role:"any",src:"s2",q:"Describe an experience outside work or academia where you learnt a new skill."}],
  patterns:[{role:"mgmt",src:"s1",text:"Case-based situations and awareness of the company's brands are part of the one-on-one."}],strength:"limited"},
 {id:"amazon",name:"Amazon",aka:["amazon","amazon india"],industry:"E-commerce",
  sources:[{id:"s1",title:"ClavePrep: Amazon interview preparation India 2026 (third-party guide, no candidate-report citations)",url:"https://claveprep.com/blog/amazon-interview-preparation-india-2026",kind:"third-party guide"}],
  process:[{role:"any",src:"s1",text:"A third-party guide describes an online assessment (with a work-style section tied to the Leadership Principles), a recruiter screen, a phone or video screen, a loop of several interviews where each interviewer owns specific Leadership Principles, and a Bar Raiser interviewer from outside the hiring team. These details are unverified."}],
  reported:[],
  patterns:[{role:"any",src:"s1",text:"Behavioural questions are mapped to Leadership Principles such as Ownership, Dive Deep, Bias for Action, Have Backbone and Disagree and Commit, with repeated follow-ups on what the candidate personally did."}],strength:"limited"},
 {id:"flipkart",name:"Flipkart",aka:["flipkart"],industry:"E-commerce",
  sources:[{id:"s1",title:"Hyring: Flipkart interview process (third-party summary citing Glassdoor reports)",url:"https://hyring.com/jobseeker-toolkit/interview-questions/company/flipkart",kind:"third-party guide"}],
  process:[{role:"any",src:"s1",text:"A third-party summary says public reports describe 3 to 5 rounds that depend on the role: a screen, a skills test or role task, product or data-and-business rounds (metrics, marketplace and category cases, trade-offs), then hiring manager and HR."}],
  reported:[],patterns:[{role:"marketing",src:"s1",text:"For business, category and marketing roles, the summary points to P&L thinking, customer behaviour, business metrics and stakeholder examples. It lists no actual reported questions."}],strength:"limited"},
 {id:"accenture",name:"Accenture",aka:["accenture","accenture india"],industry:"Consulting",
  sources:[{id:"s1",title:"Glassdoor: Accenture Associate Software Engineer interview reports (India and Philippines)",url:"https://www.glassdoor.fr/Entretien/Accenture-Entretien-E4138-RVW82258502.htm",kind:"candidate reports"}],
  process:[{role:"tech",src:"s1",text:"India reports describe about four rounds: aptitude and technical MCQs, coding, a communication round, and HR."}],
  reported:[{role:"tech",src:"s1",lit:false,q:"Questions on the resume and its projects plus data structures and programming fundamentals were reported."},{role:"any",src:"s1",q:"Tell us about a group project, how you handled conflict, and what you learned and implemented."},{role:"any",src:"s1",q:"HR: your strengths and weaknesses, and where you see yourself in five years."}],
  patterns:[{role:"tech",src:"s1",text:"Resume and project questions come alongside core technical fundamentals."}],strength:"limited"}
];
const ROLE_TAGS={"Marketing":["marketing","sales"],"Sales":["sales","marketing"],"Finance":["finance"],"Consulting":["consulting"],"Product Management":["tech","marketing"],"Operations":["ops","mgmt"],"Technology":["tech"],"Human Resources":["hr","mgmt"],"Data & Analytics":["tech","consulting"]};
const normName=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
function findPack(company){const n=normName(company);if(!n)return null;return PACKS.find(p=>p.aka.some(a=>n===a||n.startsWith(a+" ")))||null}
/* local relevance logic: which pack items apply to the chosen role */
function packFor(company,role){const p=findPack(company);if(!p)return null;const tags=ROLE_TAGS[role]||[];const fit=x=>x.role==="any"||tags.includes(x.role);
 const direct=a=>a.filter(x=>x.role!=="any"&&tags.includes(x.role)),use=a=>a.filter(fit);
 const items={process:use(p.process),reported:use(p.reported),patterns:use(p.patterns)};
 const hasDirect=direct(p.process).length+direct(p.reported).length+direct(p.patterns).length>0;
 const anyRep=p.reported.filter(x=>x.role==="any").length>0;
 const match=hasDirect?"direct":(items.process.length+items.reported.length+items.patterns.length>0?"adjacent":"none");
 const srcOf=id=>p.sources.find(s=>s.id===id);
 const otherRoles=[...new Set([...p.process,...p.reported,...p.patterns].map(x=>x.role).filter(r=>r!=="any"&&!tags.includes(r)))];
 return{pack:p,items,match,srcOf,otherRoles,evidence:hasDirect&&p.strength!=="limited"?"moderate":hasDirect?"limited":"adjacent only"}}
/* AI research brief for companies or roles the packs do not cover; clearly labelled as general knowledge */
const RS_KEY=(c,r,d)=>normName(c)+"|"+normName(r)+"|"+normName(d);

/* ----- current web research on any company (Google Search grounding through /api/research). Site only. ----- */
const WEB_ON=()=>!!window.ROLEVIA_SITE&&typeof SITE!=="undefined"&&SITE.on&&typeof ROLEVIA_AUTH!=="undefined";
async function webLookup(company,role,domain,force){S.lookups=S.lookups||{};const key=normName(company);const c=S.lookups[key];
 if(!force&&c&&Date.now()-c.at<7*864e5&&c.role===role)return c;
 const token=await ROLEVIA_AUTH.token();
 const r=await fetch("/api/research",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+token},body:JSON.stringify({company,role,domain})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw{code:j.code||"unavailable",message:j.error||"Research is unavailable right now."};
 const out={...j,at:Date.now(),role,query:company};S.lookups[key]=out;save();return out}
function briefFromLookup(lk){const known=x=>({point:x,confidence:"known"});
 return{roleReality:[lk.summary,lk.businessModel?"How it makes money: "+lk.businessModel:""].filter(Boolean).join(" "),competencies:lk.roleRequirements||[],
  domainTopics:[...(lk.products||[]).map(x=>"Product or service: "+x),...(lk.likelyCaseAreas||[])].slice(0,10),
  companyAngles:[lk.businessModel?known("Business model: "+lk.businessModel):null,...(lk.products||[]).map(x=>known("Offers: "+x)),...(lk.culture||[]).map(x=>known("Stated culture: "+x)),...(lk.recentDevelopments||[]).map(x=>known("Recent"+(x.date?" ("+x.date+")":"")+": "+x.item))].filter(Boolean),
  stylesOfQuestioning:lk.interviewSignals||[],caution:lk.limits||"",grounded:true,sources:lk.sources||[],retrieved:lk.retrieved,officialName:lk.officialName,at:Date.now()}}
function lookupPanel(){const co=(SU.v.company||"").trim();if(!WEB_ON()||co.length<2)return"";
 const lk=(S.lookups||{})[normName(co)],L_=SU.look&&SU.look.company===normName(co)?SU.look:null;
 const btn=`<button class="btn ghost sm" data-act="colookup" ${L_&&L_.status==="busy"?"disabled":""}>${L_&&L_.status==="busy"?"Researching…":lk?"Refresh research":"Research this company"}</button>`;
 let body="";
 if(L_&&L_.status==="busy")body=`<p class="small muted" role="status">Searching the web for ${esc(co)}. This takes 10 to 20 seconds.</p>`;
 else if(L_&&L_.status==="err")body=`<div class="note bad small" role="alert">${esc(L_.err)}</div>`;
 else if(lk&&lk.found){const li=a=>(a||[]).length?`<ul class="small" style="margin:4px 0 0;padding-left:18px">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  body=`<div class="small stack"><div><b>${esc(lk.officialName||co)}</b>: ${esc(lk.summary||"")}</div>${lk.businessModel?`<div><b>Business model.</b> ${esc(lk.businessModel)}</div>`:""}${(lk.products||[]).length?`<div><b>Products and services.</b>${li(lk.products)}</div>`:""}${(lk.culture||[]).length?`<div><b>Culture the company states.</b>${li(lk.culture)}</div>`:""}${(lk.recentDevelopments||[]).length?`<div><b>Recent developments.</b>${li(lk.recentDevelopments.map(x=>(x.date?x.date+": ":"")+x.item))}</div>`:""}${(lk.roleRequirements||[]).length?`<div><b>What the role asks for.</b>${li(lk.roleRequirements)}</div>`:""}
  <div><b>Sources</b> (retrieved ${esc(lk.retrieved||"")}): ${(lk.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>`).join(" · ")}</div>${lk.limits?`<div class="muted">Limits: ${esc(lk.limits)}</div>`:""}<div class="muted">Summarised by AI from the web pages above. Check the links before relying on any fact. Questions use these facts for company context only; none is presented as a real interview question.</div></div>`}
 else if(lk&&!lk.found)body=`<div class="note small">We could not verify a company called “${esc(co)}” from public web sources. The interview will use <b>industry-based practice questions</b> for your domain and role plus your CV, and no company facts are assumed.</div>`;
 return`<div class="card stack" style="margin-top:12px"><div class="row between"><b>Company research</b>${btn}</div>${body||`<p class="small muted">Optional. Searches the web for this company’s business, products, culture, recent news and what the role needs, then uses it to tailor questions. Results appear here with links.</p>`}</div>`}
ACT.colookup=async()=>{const co=(SU.v.company||"").trim();if(co.length<2)return;const k=normName(co);SU.look={company:k,status:"busy"};drawSetup();
 try{await webLookup(co,SU.v.role,SU.v.domain,true);SU.look=null}catch(e){SU.look={company:k,status:"err",err:(e&&e.message)||"Research is unavailable right now."}}drawSetup()};
async function researchBrief(sel,pf){S.research=S.research||{};const key=RS_KEY(sel.company,sel.role,sel.domain);const c=S.research[key];if(c&&Date.now()-c.at<30*864e5)return c;
 if(WEB_ON()&&sel.company){try{const lk=await webLookup(sel.company,sel.role,sel.domain);if(lk&&lk.found){const b=briefFromLookup(lk);S.research[key]=b;save();return b}}catch(e){}}
 const known=pf?JSON.stringify({process:pf.items.process.map(x=>x.text),patterns:pf.items.patterns.map(x=>x.text)}).slice(0,2500):"none";
 const r=await ai(`You are preparing a recruiter-style briefing for a mock interview. Company: ${sel.company||"(not specified)"}. Domain/industry: ${sel.domain}. Role: ${sel.role}. Level: ${sel.level}. Round: ${sel.round}.
Publicly sourced notes already collected (verified by a person, anecdotal): ${known}.
Write from your general knowledge ONLY what you reasonably know, and say so when unsure. NEVER invent past interview questions or claim any question was asked by this company. Describe: what this role/function typically does at a company like this, what competencies hiring panels in this domain assess, domain topics a candidate should know, and company-specific angles (business model, products, current priorities) you are reasonably confident about. Mark each company fact as "known" or "inferred".
Reply with only JSON: {"roleReality":"2-3 sentences","competencies":["..."],"domainTopics":["specific topics to probe"],"companyAngles":[{"point":"","confidence":"known|inferred"}],"stylesOfQuestioning":["how interviewers in this domain probe, e.g. case, project deep-dive"],"caution":"one sentence on what you are unsure about"}`,{tier:"default",cache:false});
 if(!r||!Array.isArray(r.competencies))throw{code:"invalid_json"};const out={...r,at:Date.now()};S.research[key]=out;save();return out}
</script>
