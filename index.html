<style>
/* Layout: off-white canvas, royal-blue panels with one notched corner (from the flyer reference), uppercase Sora headlines, lavender as the single accent. */
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#111111;--muted:#5C5C63;--line:#E2E2E6;
  --blue:#111111;--on-blue:#FFFFFF;--lav:#E4E4E8;--lav-soft:#F3F3F5;
  --accent:#111111;--on-accent:#FFFFFF;--black:#111111;--on-black:#FFFFFF;
  --good:#12704A;--good-bg:#DDF3E8;--warn:#8A5A00;--warn-bg:#FFF0CC;--bad:#A3202F;--bad-bg:#FBE1E4;
  --display:'Sora','Trebuchet MS',system-ui,sans-serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
body:has(#app.lp){--bg:#EDEDF0;--surface:#FFFFFF;--ink:#0B0F3A;--muted:#575B7E;--line:#D5D6E4;--blue:#0A14B8;--on-blue:#FFFFFF;--lav:#A9A8F5;--lav-soft:#E6E5FD;--accent:#0A14B8;--on-accent:#FFFFFF;--black:#171717;--on-black:#FFFFFF}
.lp .panel{background:var(--blue);color:#fff}.lp .btn.lav{background:var(--lav);color:#0B0F3A}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(34px,7vw,64px);font-weight:800;text-transform:uppercase}
h2{font-size:clamp(22px,3.6vw,32px);font-weight:800;text-transform:uppercase}
h3{font-size:18px;font-weight:700}h4{font-size:15px;font-weight:700}
p{margin:0}a{color:inherit}
.wrap{max-width:1180px;margin:0 auto}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.eyebrow{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* header */
.top{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.logo{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:20px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.logo i{width:22px;height:22px;background:var(--blue);display:inline-block;clip-path:polygon(0 0,70% 0,100% 30%,100% 100%,0 100%)}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--lav-soft)}
/* buttons */
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn.pri{background:var(--black);color:var(--on-black)}
.btn.blue{background:var(--blue);color:var(--on-blue)}
.btn.lav{background:var(--black);color:var(--on-black)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{padding:8px 14px;min-height:36px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
a.card{display:block;text-decoration:none}a.card:hover{border-color:var(--ink)}
.notch{clip-path:polygon(0 0,calc(100% - 56px) 0,100% 56px,100% 100%,0 100%);border-radius:28px 0 28px 28px}
.panel{background:var(--lav-soft);color:var(--ink);border-radius:28px;padding:28px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}.stack.lg{gap:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--lav-soft);color:var(--ink);white-space:nowrap}
.pill.ai{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--good-bg);color:var(--good)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
/* forms */
label{font-weight:700;font-size:13px;display:block;margin-bottom:6px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;min-height:44px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--lav-soft)}
.field{display:flex;flex-direction:column;min-width:0}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;font-weight:500;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--black);color:var(--on-black);border-color:var(--black)}
/* notices */
.note{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn)}
.note.info{background:var(--lav-soft);color:var(--ink)}.note.bad{background:var(--bad-bg);color:var(--bad)}.note.ok{background:var(--good-bg);color:var(--good)}
.empty{border:1.5px dashed var(--line);border-radius:20px;padding:32px 20px;text-align:center}
.empty h3{margin-bottom:6px}
/* app shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding-bottom:48px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px;padding-top:12px}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:500;font-size:14px}
.side a:hover{background:var(--lav-soft)}
.side a[aria-current="page"]{background:var(--black);color:var(--on-black);font-weight:700}
.main{min-width:0;padding-top:12px;animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.main,.page{animation:none}}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr);gap:8px}
 .side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:8px;gap:6px;-webkit-overflow-scrolling:touch}
 .side a{white-space:nowrap;border:1px solid var(--line);padding:8px 12px}}
.page{animation:fade .22s ease both}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}.crumbs a{color:var(--muted)}
.pagehead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
/* bars + charts */
.bar{height:10px;border-radius:999px;background:var(--lav-soft);overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue);border-radius:999px}
.score{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.tablewrap{overflow-x:auto}
.q{border-left:3px solid var(--lav);padding:4px 0 4px 14px}
.msg{padding:12px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{background:var(--lav-soft)}.msg.me{background:var(--black);color:var(--on-black);align-self:flex-end}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;align-items:stretch}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.footer{border-top:1px solid var(--line);margin-top:48px;padding:28px 0 40px;display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between}
.footer a{display:block;text-decoration:none;color:var(--muted);padding:3px 0}.footer a:hover{color:var(--ink)}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.suggest{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;z-index:4}
.suggest a{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;text-decoration:none}.suggest a:hover{background:var(--lav-soft)}
.kv{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:6px 14px;font-size:14px}
@media (max-width:520px){.kv{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs a,.tabs button{font:inherit;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer}
.tabs [aria-current="true"]{background:var(--black);color:var(--on-black);border-color:var(--black)}
.drop{position:relative;display:flex;align-items:center;justify-content:center;min-height:110px;border:2px dashed var(--line);border-radius:14px;background:var(--lav-soft);text-align:center;padding:16px}.drop:focus-within,.drop:hover{border-color:var(--ink)}
.mic{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:var(--lav-soft);border:3px solid var(--line);margin:0 auto;font-size:40px;transition:.2s}.mic.listen{border-color:#B3261E;box-shadow:0 0 0 10px rgba(179,38,30,.12);animation:pulse 1.4s infinite}.mic.speak{border-color:var(--ink);box-shadow:0 0 0 10px rgba(17,17,17,.08);animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.05)}}
.rec{display:inline-flex;align-items:center;gap:6px;font-weight:700}.rec i{width:10px;height:10px;border-radius:50%;background:#B3261E;animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}.slot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;min-height:56px}.slot:hover{border-color:var(--ink)}.slot.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}.slot.mine{background:var(--good-bg)}.slot[data-full]{opacity:.55;text-decoration:line-through}
</style>

<body>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite" style="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;pointer-events:none"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const slugify=s=>String(s).toLowerCase().trim().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48)||"company";
const fmtDate=t=>new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const fmtTime=t=>new Date(t).toLocaleString("en-IN",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function toast(m){const t=$("#toast");t.innerHTML='<div style="background:var(--black);color:var(--on-black);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML="",2600)}
const A=(h,t,c="")=>`<a class="${c}" href="#${h}">${t}</a>`;

/* ---------- persistence (per-viewer, this browser only) ---------- */
const KEY="rolevia.v1";
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
const S=Object.assign({user:null,profile:{level:"",roles:[],industries:[],goals:[],targets:[]},cv:null,bookmarks:[],lists:[],qlib:[],reports:[],sessions:[],companies:{},recent:[],gdReports:[],gdBookings:{}},load()||{});
S.profile=Object.assign({level:"",roles:[],industries:[],goals:[],targets:[]},S.profile||{});["roles","industries","goals","targets"].forEach(k=>{if(!Array.isArray(S.profile[k]))S.profile[k]=[]});["bookmarks","lists","qlib","reports","sessions","recent","gdReports"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});if(!S.companies||typeof S.companies!=="object")S.companies={};if(!S.research||typeof S.research!=="object")S.research={};if(!S.gdBookings||typeof S.gdBookings!=="object")S.gdBookings={};
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* a CV counts as uploaded only if a real file was read and processed: name, readable text, extracted fields, timestamp */
function cvValid(c){return !!c&&typeof c==="object"&&typeof c.fileName==="string"&&c.fileName.trim().length>0&&typeof c.text==="string"&&c.text.replace(/\s+/g,"").length>=80&&!!c.fields&&typeof c.fields==="object"&&Object.values(c.fields).some(a=>Array.isArray(a)&&a.length>0)&&typeof c.updated==="number"&&c.updated>0}
function cvVerify(){if(S.cv&&!cvValid(S.cv)){S.cv=null;S.cvDiscarded=true;try{save()}catch(e){}}return !!S.cv}
cvVerify();

/* ---------- config: plans are data, not code ---------- */
const PLANS=([{"id":"free","name":"Free","amountInr":0,"price":"₹0","per":"one-time","buyable":false,"grants":{"interview":1,"gd":1},"validDays":null,"feats":["1 free AI mock interview","1 free live group GD","Unlimited-style solo GD practice (fair-use daily cap)","Basic company research","Basic feedback"]},{"id":"gd","name":"Individual GD","amountInr":179,"price":"₹179","per":"/session","buyable":true,"grants":{"gd":1},"validDays":null,"feats":["1 scheduled live GD session with real candidates","Individual AI feedback"]},{"id":"combo","name":"1 GD + 1 Interview","amountInr":179,"price":"₹179","usd":"≈ $2","per":"/package","buyable":true,"grants":{"gd":1,"interview":1},"validDays":null,"feats":["1 live group GD session","1 company-specific AI voice interview","Strict, evidence-based reports for both"]},{"id":"gd3","name":"3 GD Session Pack","amountInr":537,"price":"₹537","per":"/pack of 3","buyable":true,"grants":{"gd":3},"validDays":null,"feats":["3 scheduled live GD sessions (₹179 each, no discount applied)","Individual AI feedback after every session","Book any 3 slots, one per slot"]},{"id":"pro","name":"Placement Pro","amountInr":599,"price":"₹599","per":"/30 days","buyable":true,"grants":{"interview":60,"gd":8},"validDays":30,"feats":["60 AI mock interviews (30 days)","8 live GD sessions (30 days)","Advanced role-specific preparation","Detailed analytics and personalised preparation","Priority GD booking"]},{"id":"premium","name":"Premium","amountInr":799,"price":"₹799","per":"/30 days","buyable":true,"grants":{"interview":30,"gd":4},"validDays":30,"feats":["30 AI mock interviews (30 days)","4 live GD sessions (30 days)","Detailed company-specific preparation","CV-based questions and feedback","Progress tracking and preparation plans"]},{"id":"college","name":"College Plan","amountInr":1799,"price":"From ₹1,799","per":"/student/year","buyable":false,"grants":{},"validDays":null,"feats":["Student interview and GD preparation","Placement-cell dashboard","Aggregate, privacy-conscious insights"]}]).map(x=>({...x,amount:x.amountInr}));
const PLANS_ASC=PLANS.slice().sort((a,b)=>a.amount-b.amount||a.name.localeCompare(b.name));
const ROLES=["Marketing","Finance","Consulting","Sales","Product Management","Operations","Technology","Human Resources","Data & Analytics"];
const INDUSTRIES=["Consulting","Banking & Finance","FMCG","Technology","Manufacturing & Steel","E-commerce","Healthcare & Pharma","Automotive","Media & Advertising","Retail & Apparel"];
const ROUNDS=["HR / Behavioural","Case / Problem solving","Technical / Role knowledge","Managerial","Final / Leadership"];
const QTYPES=["HR","Behavioural","Technical","Situational","Role-specific","Case / estimation","Motivation & fit","Current affairs"];
const LEVELS=["Student / Fresher","0–2 years","3–6 years","7+ years"];
const GD_CATS=["Current affairs","Business","Marketing","Economics","Technology","Social issues","Abstract"];
/* popular companies: names and industries only (used for suggestions, not as profile data) */
const POP=[["Google","Technology"],["Amazon","E-commerce"],["Microsoft","Technology"],["Apple","Technology"],["Meta","Technology"],["Flipkart","E-commerce"],["Deloitte","Consulting"],["McKinsey & Company","Consulting"],["Boston Consulting Group","Consulting"],["Bain & Company","Consulting"],["KPMG","Consulting"],["PwC","Consulting"],["EY","Consulting"],["Accenture","Consulting"],["Tata Consultancy Services","Technology"],["Infosys","Technology"],["Wipro","Technology"],["HCLTech","Technology"],["HDFC Bank","Banking & Finance"],["ICICI Bank","Banking & Finance"],["State Bank of India","Banking & Finance"],["Goldman Sachs","Banking & Finance"],["JPMorgan Chase","Banking & Finance"],["Hindustan Unilever","FMCG"],["Procter & Gamble","FMCG"],["Nestlé","FMCG"],["ITC","FMCG"],["Puma","Retail & Apparel"],["Nike","Retail & Apparel"],["Adidas","Retail & Apparel"],["Tata Steel","Manufacturing & Steel"],["JSW Steel","Manufacturing & Steel"],["SAIL","Manufacturing & Steel"],["Tata Motors","Automotive"],["Mahindra & Mahindra","Automotive"],["Maruti Suzuki","Automotive"],["Reliance Industries","Manufacturing & Steel"],["Swiggy","E-commerce"],["Zomato","E-commerce"],["Pepperfry","E-commerce"],["Licious","E-commerce"],["Cipla","Healthcare & Pharma"],["Sun Pharma","Healthcare & Pharma"],["Ogilvy","Media & Advertising"],["L'Oréal","FMCG"],["Galderma","Healthcare & Pharma"],["Samagra","Consulting"]];
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i]}for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function suggest(q){q=q.toLowerCase().trim();if(!q)return[];
 return POP.map(([n,i])=>{const l=n.toLowerCase();let s=99;
  if(l.startsWith(q))s=0;else if(l.includes(q))s=1;else{const toks=l.split(/[^a-z0-9]+/);const d=Math.min(...toks.map(t=>lev(t.slice(0,q.length+1),q)));if(d<=Math.max(1,Math.floor(q.length/4)))s=2+d}
  return{n,i,s}}).filter(x=>x.s<99).sort((a,b)=>a.s-b.s).slice(0,6)}

/* ---------- AI boundary (viewer's own Claude via the sample capability) ---------- */
let _sample;const getSample=async()=>{if(_sample!==undefined)return _sample;try{_sample=await window.claude.use("sample")}catch(e){_sample=null}return _sample};
const AIERR={not_granted:"Claude access was declined for this page. Allow it to use AI features.",sampling_disabled:"Claude is not available for this account or organisation.",rate_limited:"Too many requests, or your usage limit was reached. Try again shortly.",session_expired:"Your session expired. Sign in again.",unavailable:window.ROLEVIA_SITE?"The AI service is not reachable right now. Check your connection, or try again later. The site owner may not have configured it yet.":"AI is not available in this view. Open the page inside Claude to enable it.",invalid_json:"The AI reply could not be read. Try again.",upstream_error:"The AI service had a problem. Try again.",cancelled:"Cancelled.",session_closed:"This session is already finished.",session_cap:"This session reached its AI limit.",bad_session:"This session could not be verified. Start a new one.",daily_cap:"You reached today's AI limit. Try again tomorrow.",no_credits:"You have no sessions left for this. See Pricing to get more."};
const aiMsg=e=>AIERR[e&&e.code]||"Something went wrong. Try again.";
const AI_CTX={id:null};
async function ai(prompt,o={}){const sm=await getSample();if(!sm)throw{code:"unavailable"};return sm.json(prompt,{modelTier:o.tier||"default",cache:o.cache===false?false:undefined,signal:o.signal,sessionId:o.sessionId===undefined?AI_CTX.id:o.sessionId})}
const aiOn=async()=>!!(await getSample());

/* ---------- identity: viewer-level (claude.ai) data for GD ---------- */
const VIEW={me:null,db:null,room:null,canEdit:false};
async function initCaps(){try{const u=await window.claude.use("user");if(u){VIEW.me=await u.me();VIEW.canEdit=await u.canEdit()}}catch(e){}
 try{VIEW.db=await window.claude.use("db")}catch(e){} try{VIEW.room=await window.claude.use("room")}catch(e){}}

/* ---------- layout ---------- */
function footer(){return `<footer class="footer"><div><div class="logo"><i></i>ROLEVIA</div><p class="small muted" style="margin-top:8px;max-width:30ch">Know the company. Prepare for the role. Own the room.</p></div>
<div><h4>Product</h4>${A("/companies","Companies")}${A("/pricing","Pricing")}${A("/gd","GD Arena")}</div>
<div><h4>Company</h4>${A("/about","About")}${A("/contact","Contact")}${A("/help","Help")}</div>
<div><h4>Legal</h4>${A("/privacy","Privacy Policy")}${A("/terms","Terms")}</div></footer>`}
function pubHead(){return `<header class="top"><a class="logo" href="#/"><i></i>ROLEVIA</a><nav class="nav" aria-label="Main">
${A("/features","Features")}${A("/how-it-works","How It Works")}${A("/pricing","Pricing")}

/* ---------- router ---------- */
const ROUTES=[];const R=(re,fn)=>ROUTES.push([re,fn]);
let cleanup=null;
let RT=0;
function go(h){const t="#"+h;if(location.hash!==t)location.hash=t;render()}
function errCard(err){return pubShell(`<div class="empty" style="margin-top:40px"><h3>This page could not load</h3><p class="muted">${esc((err&&err.message)||"Unexpected error")}</p><p style="margin-top:14px"><button class="btn pri" data-act="reload">Try again</button> ${A("/dashboard","Go to dashboard","btn ghost")}</p></div>`)}
async function render(){cvVerify();
 const my=++RT;
 if(cleanup){try{cleanup()}catch(e){}cleanup=null}
 let path=(location.hash||"#/").slice(1)||"/";path=path.split("?")[0];if(path.length>1)path=path.replace(/\/$/,"");
 try{
 for(const [re,fn] of ROUTES){const m=path.match(re);if(m){let pg;try{pg=await fn(...m.slice(1).map(x=>x===undefined?undefined:decodeURIComponent(x)))}catch(err){if(!S.user){S.next=path;return go("/login")}throw err}
  if(my!==RT)return;
  if(pg.private&&!S.user){S.next=path;return go("/login")}
  const app=$("#app");app.className=pg.lp?"lp":"";app.innerHTML=pg.private?appShell(pg.html,pg.nav):pubShell(pg.html);
  if(pg.title)document.title=pg.title+" · ROLEVIA";else document.title="ROLEVIA";
  window.scrollTo(0,0);if(pg.mount)cleanup=pg.mount()||null;return}}
 $("#app").innerHTML=pubShell(`<div class="empty" style="margin-top:40px"><h3>Page not found</h3><p class="muted">That address does not match a ROLEVIA page.</p><p style="margin-top:14px">${A("/","Go home","btn pri")}</p></div>`);
 }catch(err){console.error(err);if(my===RT){const app=$("#app");app.className="";app.innerHTML=errCard(err)}}
}
addEventListener("hashchange",()=>{render()});
/* click + submit delegation */
const ACT={};const FORM={};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener("submit",e=>{const t=e.target.closest("[data-form]");if(!t)return;e.preventDefault();const f=FORM[t.dataset.form];if(f)f(t,Object.fromEntries(new FormData(t)),e)});
ACT.reload=()=>render();
ACT.logout=()=>{S.user=null;save();toast("Signed out");go("/")};

async function ensureProfile(slug){const c=S.companies[slug];if(c.profile)return;
 const p=await ai(`You are building an interview-preparation company profile for "${c.name}". Use ONLY what you reliably know. Hard rules: never invent interview questions, candidate experiences, policies, numbers, or news. If you are unsure of something, use null or an empty array. Recent news: leave empty, you have no live feed. Reply with only JSON:

 const p=c.profile;
 w.innerHTML=`<div class="panel notch stack" style="padding:26px 28px 28px"><div class="row between"><div><span class="eyebrow" style="color:var(--muted)">${esc(p.industry||"Company")}${p.headquarters?" · "+esc(p.headquarters):""}</span><h2 style="font-size:clamp(26px,4.4vw,40px)">${esc(p.name||c.name)}</h2></div></div>
 <div class="row"><a class="btn lav" href="#/interviews/new/${slug}">Practise an interview here</a><a class="btn" style="background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)" href="#/questions/${slug}">Practice questions</a></div></div>

 if(k==="overview")return`<div class="grid g2"><div class="card stack"><h3>Overview ${AIPILL}</h3><p>${esc(p.overview||"Not available.")}</p></div><div class="card stack"><h3>Business model ${AIPILL}</h3><p>${esc(p.businessModel||"Not available.")}</p></div><div class="card"><h3>Products and services</h3>${jl(p.products)}</div><div class="card"><h3>Competitors</h3>${jl(p.competitors)}</div></div>
 <div class="card" style="margin-top:16px"><h3>Recent news</h3><p class="muted" style="margin-top:6px">Unavailable. No live news feed is connected, and ROLEVIA will not recall news from memory.</p></div>`;
 if(k==="hiring"){const h=p.hiring||{};return`<div class="grid g2"><div class="card stack"><h3>Hiring process ${AIPILL}</h3>${h.knownProcess?`<p>${esc(h.knownProcess)}</p>`:`<p class="muted">No company-specific process is known to ROLEVIA.</p>`}<h4>Typical rounds for this kind of employer (inferred, not company-confirmed)</h4>${jl(h.inferredRounds)}<p class="small muted">Confidence: <b>${esc(h.confidence||"low")}</b>. ${esc(h.note||"")}</p></div>
 <div class="card stack"><h3>Culture and stated values ${AIPILL}</h3>${jl((p.cultureValues||[]).filter(x=>x&&x.value),x=>`<li><b>${esc(x.value)}</b>${x.note?" — "+esc(x.note):""}</li>`)}<p class="small muted">Not linked to a source. Compare with the company's own values page.</p></div>
 <div class="card stack"><h3>Group discussion</h3><p>${p.groupDiscussionLikely?"A group discussion round is plausible for this kind of employer, but no reported GD topics are available.":"No evidence of a group discussion round."}</p>${A("/gd","Practise in the GD Arena","btn ghost sm")}</div>
 <div class="card stack"><h3>Questions to ask the interviewer ${AIPILL}</h3>${jl(p.askInterviewer)}</div></div>`}

  return`<div class="card stack"><div class="field" style="max-width:320px"><label for="rsel">Role</label><select id="rsel" data-act-change="crole" data-slug="${slug}">${ROLES.map(r=>`<option ${r===role?"selected":""}>${r}</option>`).join("")}</select></div>

 if(k==="questions"){return`<div class="grid g2"><div class="card stack"><h3>Candidate-reported questions</h3><div class="empty" style="padding:18px"><p class="muted">None available. ROLEVIA has no connected source of candidate-reported interview questions, so it shows none rather than guessing.</p></div><h4>Repeatedly reported patterns</h4><p class="muted">None available, for the same reason.</p></div>
 <div class="card stack"><h3>AI-generated practice questions</h3><p class="muted">Written from company and role research. Not real interview questions.</p><div class="row">${A("/questions/"+slug,"Open practice questions","btn pri sm")}${A("/interviews/new/"+slug,"Start a mock interview","btn ghost sm")}</div></div></div>`}
 return`<div class="grid g2"><div class="card stack"><h3>Sources</h3><p class="muted">No live sources attached. Profile written ${fmtDate(c.generatedAt)} from Claude's general knowledge. ${esc(p.limitations||"")}</p><div class="chips"><span class="pill ai">AI-generated</span><span class="pill">Confidence: ${esc(p.hiring?.confidence||"low")}</span></div><button class="btn ghost sm" style="align-self:flex-start" data-act="regen" data-slug="${slug}">Regenerate profile</button></div>
 <div class="card stack"><h3>Careers and jobs</h3><p class="muted">Search links open external sites. ROLEVIA has not verified any listing.</p><div class="stack"><a class="btn ghost sm" target="_blank" rel="noopener" href="${careersLink(c.name)}">Official careers page search ↗</a>${A("/jobs/"+encodeURIComponent(CROLE[slug]||S.profile.roles[0]||"Marketing")+"/"+encodeURIComponent(c.name),"Job search for this company","btn ghost sm")}</div></div></div>`}

  c.roles=c.roles||{};c.roles[role]=r;save();b.innerHTML=roleHtml(c,role,r)}catch(e){b.innerHTML=`<div class="note bad">${esc(aiMsg(e))}</div><p style="margin-top:8px"><button class="btn pri sm" data-act="genrole" data-slug="${slug}">Try again</button></p>`}};

<script>
/* ---------- Question Explorer ---------- */
const QF={company:"",role:"",industry:"",round:"",type:"",level:"",jd:"",kw:"",marked:false};

const sel=(id,label,opts,v,attr)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}" data-qf="${attr}"><option value="">Any</option>${opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;

 return{private:true,nav:"/questions",title:"Question Explorer",html:`${head("Question Explorer","Generate practice questions for a company, role and level, then save the ones you want to rehearse.")}

${sel("qr","Role",ROLES,QF.role,"role")}${sel("qi","Industry",INDUSTRIES,QF.industry,"industry")}${sel("qo","Interview round",ROUNDS,QF.round,"round")}${sel("qt","Question type",QTYPES,QF.type,"type")}${sel("ql","Experience level",LEVELS,QF.level,"level")}</div>

<div class="row"><button class="btn pri" data-act="qgen" id="qgbtn">Generate practice questions</button><span class="small muted">${S.cv&&S.cv.use?"Your uploaded CV is used to personalise them.":"Upload a CV in My CV to personalise them."}</span></div><div id="qgstat" aria-live="polite"></div></div>
<div class="row between" style="margin:18px 0 8px"><div class="field" style="flex:1;min-width:200px"><label for="qk">Search saved questions</label><input id="qk" data-qf="kw" value="${esc(QF.kw)}" placeholder="Keyword"></div><label class="row" style="margin:0;font-weight:500"><input type="checkbox" id="qm" data-qf="marked" ${QF.marked?"checked":""} style="width:auto;min-height:0"> Bookmarked only</label></div>
<div id="qlist"></div><div id="qlists"></div>`,mount:()=>{drawQ()}}});
function qmatch(q){const f=QF;return(!f.company||norm(q.company||"").includes(norm(f.company)))&&(!f.role||q.role===f.role)&&(!f.industry||q.industry===f.industry)&&(!f.round||q.round===f.round)&&(!f.type||q.type===f.type)&&(!f.level||q.level===f.level)&&(!f.kw||norm(q.q).includes(norm(f.kw)))&&(!f.marked||S.bookmarks.some(b=>b.id===q.id))}
function qrow(q){const bm=S.bookmarks.some(b=>b.id===q.id);return`<div class="card row" style="align-items:flex-start;flex-wrap:nowrap;margin-bottom:8px"><input type="checkbox" aria-label="Select question" data-act="qsel" data-id="${q.id}" ${QSEL.has(q.id)?"checked":""} style="width:20px;min-height:20px;margin-top:3px"><div class="stack" style="gap:6px;flex:1;min-width:0"><div>${esc(q.q)}</div><div class="chips">${q.label==="reported"?`<span class="pill ok">Candidate-reported${q.src?` · <a href="${esc(q.src.url)}" target="_blank" rel="noopener noreferrer">source</a>`:""}</span>`:`<span class="pill ${q.label==="template"?"":"ai"}">${q.label==="template"?"Template practice question":"AI-generated practice question"}</span>`}${[q.company,q.role,q.round,q.type].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div></div><button class="btn ghost sm" data-act="qbm" data-id="${q.id}" aria-pressed="${bm}">${bm?"★ Saved":"☆ Save"}</button></div>`}
function drawQ(){const L=S.qlib.filter(qmatch);$("#qlist").innerHTML=`<div class="row between" style="margin-bottom:8px"><h3>${L.length} question${L.length==1?"":"s"}</h3><div class="row"><button class="btn blue sm" data-act="qmock" ${QSEL.size?"":"disabled"}>Start mock with ${QSEL.size||"selected"} selected</button><button class="btn ghost sm" data-act="qlist" ${QSEL.size?"":"disabled"}>Save selected to a practice list</button></div></div>${L.length?L.map(qrow).join(""):`<div class="empty"><h3>No questions match</h3><p class="muted">Adjust the filters, or generate AI practice questions for this company and role.</p></div>`}`;
 $("#qlists").innerHTML=S.lists.length?`<h3 style="margin:24px 0 10px">Your practice lists</h3><div class="grid g2">${S.lists.map(l=>`<div class="card stack"><h4>${esc(l.name)}</h4><p class="small muted">${l.items.length} questions</p><div class="row"><button class="btn blue sm" data-act="lmock" data-id="${l.id}">Start mock</button><button class="btn ghost sm" data-act="ldel" data-id="${l.id}">Delete list</button></div></div>`).join("")}</div>`:""}
document.addEventListener("input",e=>{const i=e.target.closest("[data-qf]");if(!i)return;QF[i.dataset.qf]=i.type==="checkbox"?i.checked:i.value;if($("#qlist"))drawQ()});

ACT.qbm=t=>{const q=S.qlib.find(x=>x.id===t.dataset.id);if(!q)return;const i=S.bookmarks.findIndex(b=>b.id===q.id);i>=0?S.bookmarks.splice(i,1):S.bookmarks.push(q);save();drawQ()};
/* template questions: used only when AI is unavailable, always labelled as templates */
const STOP=new Set("about their there which would should could with from that this have will your must able work team role years experience skills strong ability knowledge including across within based using other such also they them than into more most well need needs good great looking join help make part".split(" "));
function jdKeywords(jd){const c={};(jd||"").toLowerCase().replace(/[^a-z0-9+#& ]+/g," ").split(/\s+/).filter(w=>w.length>4&&!STOP.has(w)).forEach(w=>c[w]=(c[w]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0])}
function templateQs(F){const co=F.company||"this company",ro=F.role||"the role",ar=F.role?"a "+F.role:"the role",rl=F.role?F.role+" role":"role",lv=F.level?"the "+F.level+" level":"your level",kw=jdKeywords(F.jd),cvf=S.cv&&S.cv.use&&S.cv.fields?S.cv.fields:null,sk=cvf?(cvf.skills||[]).slice(0,3):[],ex=cvf?(cvf.experience||[])[0]:"",pr=cvf?(cvf.projects||[])[0]:"";
 const B={
 "HR":[`Walk me through your background and why ${ar} is the right next step for you.`,`Why do you want to work at ${co}?`,`What are your strengths and one weakness you are actively working on?`,`Where do you see yourself in three to five years?`,`What kind of work environment brings out your best?`,`Are you comfortable with the location, hours and travel ${F.role?'this '+F.role+' role':'this role'} may need?`],
 "Behavioural":[`Tell me about a time you led a team or a project under pressure. What was the outcome?`,`Describe a disagreement with a teammate or manager. How did you handle it?`,`Give an example of a failure. What did you change afterwards?`,`Tell me about a time you had to learn something quickly to deliver a result.`,`Describe a time you influenced someone without having authority over them.`,`Tell me about the achievement you are proudest of and your exact contribution.`],
 "Technical":[`Which core concepts or tools matter most for ${ar} at ${lv}, and how have you used them?`,`Explain a concept from your field to a non-expert in two minutes.`,`Walk me through how you would approach a problem you have never seen before in ${rl==='role'?'this field':F.role}.`,`What metrics would you track to judge success in ${F.role?'a '+F.role+' function':'this function'}, and why?`,`Describe a technical or analytical decision you made and the trade-offs involved.`],
 "Situational":[`A deadline is at risk and your team is stretched. What do you do in the first hour?`,`Your manager gives instructions you think are wrong. How do you respond?`,`Two stakeholders ask you for conflicting things on the same day. How do you decide?`,`You discover an error in work you already submitted. What do you do?`,`You join ${co} and find a process that clearly wastes time. What is your approach?`],
 "Role-specific":[`What does a strong first 90 days look like for ${ar} at ${co}?`,`What do you think are the biggest challenges for ${ar} in the ${F.industry||"industry"} today?`,`How would you prioritise your work if you had five competing tasks in ${F.role?'a '+F.role+' role':'this role'}?`,`Which part of the job do you expect to find hardest, and how will you prepare?`],
 "Case / estimation":[`Estimate how many customers ${co} might serve in one city in a month. State your assumptions.`,`Sales at ${co} fell 10% in a quarter. How would you diagnose the cause?`,`How would you decide whether ${co} should enter a new city or segment?`],
 "Motivation & fit":[`What do you know about ${co}'s business and what attracts you to it?`,`Why should we hire you over other candidates for ${F.role?'this '+F.role+' position':'this position'}?`,`What would make you leave a job within a year?`],
 "Current affairs":[`Which recent development in the ${F.industry||"business"} world do you think matters most, and why?`,`How might current economic conditions affect ${co} or its customers?`]};
 const extra=[];
 kw.forEach(k=>extra.push(["Role-specific",`The job description mentions “${k}”. Describe the strongest example of it in your experience.`]));
 sk.forEach(s=>extra.push(["Technical",`Your CV lists “${s}”. Give a concrete example of where you applied it and what changed because of it.`]));
 if(ex)extra.push(["Behavioural",`On your CV you list: “${ex.slice(0,120)}”. What was the hardest part and what would you do differently?`]);
 if(pr)extra.push(["Technical",`Tell me about your project “${pr.slice(0,100)}”: your role, the decisions you made and the result.`]);
 const types=F.type?[F.type]:["HR","Behavioural","Technical","Situational","Role-specific"];
 const pool=[];const idx={};let more=true;
 types.forEach(t=>idx[t]=0);
 while(more){more=false;types.forEach(t=>{const arr=B[t]||[];if(idx[t]<arr.length){pool.push([t,arr[idx[t]++]]);more=true}})}
 const mix=[];const ex2=F.type?extra.filter(e=>e[0]===F.type||true):extra;
 let i=0,e=0;pool.forEach((p,n)=>{mix.push(p);if(n%2===1&&e<ex2.length)mix.push(ex2[e++])});while(e<ex2.length)mix.push(ex2[e++]);
 return mix.slice(0,10).map(([t,q])=>({q,type:t}))}
const mkQ=(x,label)=>({id:uid(),q:String(x.q),type:QTYPES.includes(x.type)?x.type:(QF.type||"Role-specific"),company:QF.company,role:QF.role,industry:QF.industry,round:QF.round,level:QF.level,label,at:Date.now()});
function qSummary(){return [QF.company,QF.role,QF.level].filter(Boolean).join(" · ")}
let QGEN=0;
ACT.qgen=async()=>{const st=$("#qgstat"),btn=$("#qgbtn");
 if(!QF.company&&!QF.role&&!QF.industry){st.innerHTML=`<div class="err" role="alert">Choose a company, a role or an industry first.</div>`;$("#qc")&&$("#qc").focus();return}
 const my=++QGEN;if(btn)btn.disabled=true;st.innerHTML=loading("Generating practice questions…");
 const cvTxt=S.cv&&S.cv.use&&S.cv.fields?`Candidate CV details: ${JSON.stringify(S.cv.fields).slice(0,2000)}`:"";
 const pf=QF.company?packFor(QF.company,QF.role||""):null;const rep=pf?pf.items.reported.filter(x=>x.lit!==false&&!S.qlib.some(z=>z.q===x.q&&z.company===QF.company)).map(x=>({...mkQ({q:x.q,type:"Role-specific"},"reported"),src:pf.srcOf(x.src)})):[];
 const finish=(items,label,note)=>{if(my!==QGEN)return;S.qlib=[...rep,...items.map(x=>mkQ(x,label)),...S.qlib].slice(0,400);save();QF.kw="";const k=$("#qk");if(k)k.value="";drawQ();st.innerHTML=note;if(btn)btn.disabled=false;const l=$("#qlist");if(l&&l.scrollIntoView)l.scrollIntoView({behavior:"smooth",block:"start"})};
 const retry=`<button class="btn pri sm" data-act="qgen">Try AI again</button>`;
 try{const r=await ai(`Write 10 interview PRACTICE questions tailored to: company ${QF.company||"(any)"}, role ${QF.role||"(any)"}, industry ${QF.industry||"(any)"}, interview round ${QF.round||"(any)"}, candidate level ${QF.level||"(any)"}. ${QF.type?"All questions must be of type "+QF.type+".":"Mix these types: HR, Behavioural, Technical, Situational, Role-specific."} ${QF.jd?"Job description to draw on: "+QF.jd.slice(0,3000):""} ${cvTxt} They must be original practice questions and must never be presented as questions the company really asked. Do not state facts about the company that you are not sure of. Reply with only a JSON array: [{"q":"","type":"one of ${QTYPES.join(" | ")}"}]`,{tier:"default",cache:false});
  const items=(Array.isArray(r)?r:Array.isArray(r&&r.questions)?r.questions:[]).filter(x=>x&&x.q&&String(x.q).length>8);
  if(!items.length)throw{code:"invalid_json"};
  finish(items,"ai",`<div class="note ok">Added ${items.length} AI-generated practice questions for ${esc(qSummary())}.</div>`)}
 catch(e){const fb=templateQs(QF);
  finish(fb,"template",`<div class="note bad" role="alert"><b>AI could not generate questions.</b> ${esc(aiMsg(e))}<br>Showing ${fb.length} template practice questions built from your selections instead. They are generic and are not AI-generated. <span style="display:inline-block;margin-top:8px">${retry}</span></div>`)}};
/* save-to-list uses an inline form, since dialogs are blocked */
ACT.qlist=t=>{const box=$("#qlists");box.insertAdjacentHTML("afterbegin",`<form data-form="newlist" class="card row" style="margin-top:16px"><div class="field" style="flex:1"><label for="ln">List name</label><input id="ln" name="name" required placeholder="e.g. Puma marketing round"></div><button class="btn pri" type="submit">Save list</button></form>`);$("#ln").focus()};
FORM.newlist=(f,d)=>{const n=(d.name||"").trim();if(!n)return;S.lists.push({id:uid(),name:n,items:S.qlib.filter(q=>QSEL.has(q.id))});QSEL.clear();save();toast("List saved");drawQ()};
ACT.ldel=t=>{S.lists=S.lists.filter(l=>l.id!==t.dataset.id);save();drawQ()};
ACT.qmock=()=>{PENDING_SET={name:"Selected questions",items:S.qlib.filter(q=>QSEL.has(q.id))};go("/interviews/new")};
ACT.lmock=t=>{const l=S.lists.find(x=>x.id===t.dataset.id);PENDING_SET={name:l.name,items:l.items};go("/interviews/new")};

/* ---------- reports ---------- */
R(/^\/reports$/,()=>({private:true,nav:"/reports",title:"My Reports",html:`${head("My reports","Saved in this browser. Private to you.")}
<h3 style="margin-bottom:10px">AI interviews</h3>${S.reports.length?`<div class="stack">${S.reports.map(r=>`<a class="card row between" href="#/reports/${r.id}"><span><b>${esc(r.company)}</b> · ${esc(r.role)}<br><span class="small muted">${esc(r.round)} · ${fmtDate(r.date)}</span></span><span class="score" style="font-size:28px">${r.overall}</span></a>`).join("")}</div>`:`<div class="empty"><h3>No interview reports</h3><p style="margin-top:10px">${A("/interviews/new","Start your first interview","btn pri")}</p></div>`}
<h3 style="margin:26px 0 10px">Group discussions</h3>${S.gdReports.length?`<div class="stack">${S.gdReports.map(r=>`<a class="card row between" href="#/reports/gd/${r.id}"><span><b>${esc(r.topic)}</b><br><span class="small muted">${fmtDate(r.date)}</span></span><span class="pill">${r.overall!=null?r.overall+"/100":(r.limited?"Limited evidence":"Scored")}</span></a>`).join("")}</div>`:`<div class="empty"><h3>No GD reports</h3><p style="margin-top:10px">${A("/gd","Find a GD session","btn pri")}</p></div>`}`}));
const DIMS=[["communication","Communication and clarity"],["cvCredibility","CV credibility"],["roleFit","Role fit"],["domainKnowledge","Domain knowledge"],["problemSolving","Problem-solving and reasoning"],["structure","Structured thinking"]];
R(/^\/reports\/([^/]+)$/,id=>{const r=S.reports.find(x=>x.id===id);if(!r)return{private:true,nav:"/reports",html:`<div class="empty"><h3>Report not found</h3><p style="margin-top:10px">${A("/reports","My reports","btn pri")}</p></div>`};
 return{private:true,nav:"/reports",title:"Report · "+r.company,html:`${crumbs([["/reports","My Reports"],[null,r.company]])}
<div class="panel notch" style="padding:26px 28px"><span class="eyebrow" style="color:var(--muted)">${esc(r.round)} · ${esc(r.difficulty)} · ${fmtDate(r.date)}</span><h2 style="margin:6px 0 14px;font-size:clamp(24px,4vw,34px)">${esc(r.company)} · ${esc(r.role)}</h2><div class="row" style="gap:20px"><div><div class="score" style="">${r.overall}</div><div class="small" style="color:var(--muted)">Interview readiness / 100</div></div><p style="max-width:52ch;color:var(--ink)">${esc(r.summary)}</p></div></div>
<div class="note info" style="margin-top:12px">Readiness measures how this practice interview went. It is separate from your fit for any job and does not predict a hiring decision.</div>
<div class="grid g2" style="margin-top:16px"><div class="card stack"><h3>Score breakdown</h3>${DIMS.map(([k,l])=>`<div><div class="row between small"><span>${l}</span><b>${r.dims[k]??"–"}</b></div><div class="bar"><i style="width:${+r.dims[k]||0}%"></i></div></div>`).join("")}</div>
<div class="card stack"><h3>Strengths</h3>${jl(r.strengths)}<h3 style="margin-top:8px">To improve</h3>${jl(r.improvements)}</div></div>
${r.cv&&(r.cv.note||(r.cv.consistent||[]).length||(r.cv.unsupported||[]).length)?`<div class="card stack" style="margin-top:16px"><h3>CV credibility</h3><p>${esc(r.cv.note||"")}</p><div class="grid g2"><div><h4>Backed up in your answers</h4>${jl(r.cv.consistent)}</div><div><h4>Stayed vague or unverified</h4>${jl(r.cv.unsupported)}${(r.cv.contradictions||[]).length?`<h4>Conflicts with the CV</h4>${jl(r.cv.contradictions)}`:""}</div></div></div>`:""}
${r.roleFitNote||r.domainNote||r.commNote?`<div class="grid g3" style="margin-top:16px"><div class="card stack"><h4>Role fit</h4><p class="small">${esc(r.roleFitNote||"")}</p></div><div class="card stack"><h4>Domain knowledge</h4><p class="small">${esc(r.domainNote||"")}</p></div><div class="card stack"><h4>Communication</h4><p class="small">${esc(r.commNote||"")}</p></div></div>`:""}
<h3 style="margin:24px 0 10px">Question-by-question feedback</h3><div class="stack">${r.perQuestion.map((p,i)=>{const t=r.turns[i]||{},src=(r.research&&r.research.sources||[]).find(x=>x.id===p.srcId);return`<div class="card stack"><div class="row between"><h4>Q${i+1}. ${esc(p.question)}</h4><span class="pill">${p.score??"–"}/100</span></div><div class="chips"><span class="pill ${p.origin==="reported"?"ok":p.origin==="cv"?"":"ai"}">${esc((typeof ORIGIN_LABEL!=="undefined"&&ORIGIN_LABEL[p.origin])||(t.kind==="followup"?"Follow-up on your answer":"Practice question"))}</span>${p.type&&typeof TYPE_LABEL!=="undefined"&&TYPE_LABEL[p.type]?`<span class="pill">${esc(TYPE_LABEL[p.type])}</span>`:""}</div>${p.basis&&p.origin!=="reported"?`<div class="tiny muted">Why asked: ${esc(p.basis)}</div>`:""}${src?`<div class="tiny muted">Source: <a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">${esc(src.title)}</a></div>`:""}<div class="small muted">Your answer</div><div class="q">${esc((t&&t.a)||"")}</div>${p.worked?`<div><b>What worked.</b> ${esc(p.worked)}</div>`:p.feedback?`<div><b>Feedback.</b> ${esc(p.feedback)}</div>`:""}${p.missing?`<div><b>What was missing.</b> ${esc(p.missing)}</div>`:""}${p.improved?`<details><summary style="cursor:pointer;font-weight:700">Stronger answer from your own experience</summary><p style="margin-top:8px">${esc(p.improved)}</p></details>`:""}</div>`}).join("")}</div>
${r.research?`<div class="card stack" style="margin-top:16px"><h3>Research behind this interview</h3><p class="small">${r.research.sources&&r.research.sources.length?`Public candidate reports and guides for <b>${esc(r.company)}</b> were used (role match: ${esc(r.research.match)}, evidence: ${esc(r.research.evidence)}). These are anecdotal and not official.`:`No collected public interview reports exist for <b>${esc(r.company)}</b>. Questions came from your CV and ${r.research.hasBrief?"an AI briefing on the role and domain (general knowledge, unverified)":"standard role templates"}; none is presented as reported by the company.`}</p>${(r.research.sources||[]).map(x=>`<div class="small"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a> <span class="muted">· ${esc(x.kind)}</span></div>`).join("")}<p class="tiny muted">CV analysed ${r.research.cvAi?"by AI plus automatic checks":"by automatic checks only"}. Plan ${r.research.planAi?"designed by AI":"built by rules"}. Label key: ${Object.keys(r.research.origins||{}).map(k=>`${esc((typeof ORIGIN_LABEL!=="undefined"&&ORIGIN_LABEL[k])||k)} (${r.research.origins[k]})`).join(", ")}.</p></div>`:""}
<div class="grid g2" style="margin-top:16px"><div class="card"><h3>Topics to revise</h3>${jl(r.revision)}</div><div class="card"><h3>Your preparation plan</h3>${jl(r.plan,x=>`<li><b>${esc(x.when)}.</b> ${esc(x.step)}</li>`)}</div></div>
<div class="row" style="margin-top:18px"><a class="btn pri" href="#/interviews/new/${slugify(r.company)}">Practise again</a><button class="btn ghost" data-act="rdel" data-id="${r.id}">Delete report</button></div>`}});

const PACKS=[
 {id:"tata-steel",name:"Tata Steel",aka:["tata steel","tsl"],industry:"Manufacturing & Steel",

 {id:"jsw-steel",name:"JSW Steel",aka:["jsw steel","jsw"],industry:"Manufacturing & Steel",

 return{gaps:gaps.slice(0,4),metricClaims,responsibilityClaims,unquantified,unevidencedSkills,certifications:sec.certifications.slice(0,8),achievements:sec.achievements.slice(0,8),sections:Object.fromEntries(Object.entries(sec).map(([k,v])=>[k,v.length]))}}

/* ----- speech out (text-to-speech) ----- */
const TTS=typeof speechSynthesis!=="undefined"&&typeof SpeechSynthesisUtterance!=="undefined";
let voiceCache=null,speakTok=0;
function pickVoice(){if(!TTS)return null;const vs=speechSynthesis.getVoices();if(!vs.length)return null;if(voiceCache&&vs.includes(voiceCache))return voiceCache;
 for(const re of [/en[-_]IN/i,/en[-_]GB/i,/en[-_]US/i,/^en/i]){const m=vs.filter(v=>re.test(v.lang));const nat=m.find(v=>/natural|neural|google|online/i.test(v.name))||m[0];if(nat){voiceCache=nat;return nat}}return vs[0]}
function speak(text){const tok=++speakTok;return new Promise((res,rej)=>{if(!TTS){rej(new Error("tts-missing"));return}
 try{speechSynthesis.cancel()}catch(e){}
 const parts=String(text).replace(/\s+/g," ").match(/[^.!?]+[.!?]*/g)||[String(text)];let i=0,started=false;
 const guard=setTimeout(()=>{if(tok===speakTok){try{speechSynthesis.cancel()}catch(e){}started?res():rej(new Error("tts-silent"))}},Math.max(8000,String(text).length*140));
 const next=()=>{if(tok!==speakTok){clearTimeout(guard);res();return}if(i>=parts.length){clearTimeout(guard);res();return}
  const u=new SpeechSynthesisUtterance(parts[i++].trim());const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}u.rate=.97;u.pitch=1;
  u.onstart=()=>{started=true};u.onend=()=>next();u.onerror=ev=>{if(ev&&(ev.error==="interrupted"||ev.error==="canceled")){clearTimeout(guard);res();return}clearTimeout(guard);rej(new Error("tts-error"))};
  try{speechSynthesis.speak(u)}catch(e){clearTimeout(guard);rej(e)}};
 next()})}
function stopSpeak(){speakTok++;try{TTS&&speechSynthesis.cancel()}catch(e){}}
if(TTS)try{speechSynthesis.onvoiceschanged=()=>{voiceCache=null}}catch(e){}

/* ----- speech in (speech recognition with recovery) ----- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const L={rec:null,active:false,base:"",cur:"",silence:null,hold:false,patience:3500,nos:0,net:0,cb:null};
const SRERR={"not-allowed":"Microphone access is blocked. Allow the microphone for this page in your browser's site settings, then retry.","service-not-allowed":"The browser blocked speech recognition for this page. If ROLEVIA is embedded, open it in a full browser tab, then retry.","audio-capture":"No microphone was found. Connect or enable a microphone, then retry.","network":"Speech recognition lost its network connection. Check your internet, then retry.","language-not-supported":"Speech recognition does not support this language setting.","unsupported":"This browser does not support speech recognition. Use Chrome, Edge or Safari on a device with a microphone."};
function lStart(cb){L.cb=cb;L.base="";L.cur="";L.hold=false;L.nos=0;L.net=0;if(!SR){cb.fatal("unsupported");return}L.active=true;lRun()}
function lRun(){if(!L.active)return;let r;try{r=new SR()}catch(e){L.active=false;L.cb.fatal("unsupported");return}
 L.rec=r;r.lang="en-IN";r.continuous=true;r.interimResults=true;
 r.onstart=()=>L.cb.status("listening");
 r.onsoundstart=()=>L.cb.sound&&L.cb.sound();
 r.onresult=e=>{L.nos=0;L.net=0;L.hold=false;const t=Array.from(e.results).map(x=>x[0].transcript).join(" ").trim();L.cur=(L.base+" "+t).trim();L.cb.update(L.cur);clearTimeout(L.silence);
  if(L.cur)L.silence=setTimeout(()=>{if(L.active&&!L.hold&&L.cur.trim().length>1)L.cb.auto(L.cur)},wc(L.cur)<8?L.patience+1500:L.patience)};
 r.onerror=e=>{const c=e.error;
  if(c==="no-speech"){L.nos++;L.cb.quiet&&L.cb.quiet(L.nos)}
  else if(c==="not-allowed"||c==="service-not-allowed"||c==="audio-capture"||c==="language-not-supported"){L.active=false;L.cb.fatal(c)}
  else if(c==="network"){L.net++;if(L.net>2){L.active=false;L.cb.fatal("network")}else L.cb.status("retry")}};
 r.onend=()=>{if(L.active){L.base=L.cur;setTimeout(lRun,250)}};
 try{r.start()}catch(e){setTimeout(()=>{if(L.active)lRun()},400)}}
function lStop(){L.active=false;clearTimeout(L.silence);try{L.rec&&L.rec.abort()}catch(e){}L.rec=null}
function lHold(ms){L.hold=true;clearTimeout(L.silence)}

 try{gdUnsubs.push(VIEW.db.collection("gdbookings").onSnapshot(s=>{GDB=s.docs.map(d=>({id:d.id,...d.data()}));onChange()},()=>{}));
  gdUnsubs.push(VIEW.db.collection("gdreports").onSnapshot(s=>{GDR=s.docs.map(d=>({id:d.id,...d.data()}));onChange()},()=>{}))}catch(e){}}

/* ---------- GD home: two options ---------- */
R(/^\/gd$/,()=>({private:true,nav:"/gd",title:"GD Arena",html:`${head("Group discussion practice","Choose how you want to practise.")}
<div class="grid g2"><div class="card stack lg"><span class="pill" style="align-self:flex-start">Option A</span><h3>Individual GD practice</h3><p class="muted">Practise GD topics on your own, improve your communication, and receive AI-powered feedback on your performance.</p><ul class="small muted" style="margin:0;padding-left:18px"><li>Pick a category or get a random topic</li><li>Speak on it through your microphone</li><li>Score out of 100 with detailed feedback</li><li>No group and no booking needed</li></ul><div>${A("/gd/practice","Start individual practice","btn pri")}</div></div>
<div class="card stack lg"><span class="pill" style="align-self:flex-start">Option B</span><h3>Join a group GD session</h3><p class="muted">Participate in a live group discussion with other candidates, practise speaking in a competitive environment, and receive feedback on your performance.</p><ul class="small muted" style="margin:0;padding-left:18px"><li>Book a 30-minute slot, up to ${GD_CAP} seats each</li><li>Live video and audio call, 6-minute discussion</li><li>Topic revealed to everyone at the start</li><li>AI feedback and practice ranking after</li></ul><div>${A("/gd/group","Book a group session","btn pri")}</div></div></div>
<div id="gdmine"></div>`,mount:()=>{const draw=()=>{const el=$("#gdmine");if(!el)return;const L=Object.entries(S.gdBookings).map(([id,b])=>({id,...b})).filter(b=>b.start+GD_LEN+GD_LOBBY>Date.now()).sort((a,b)=>a.start-b.start);el.innerHTML=L.length?`<h3 style="margin:24px 0 10px">Your booked sessions</h3><div class="stack">${L.map(b=>`<a class="card row between" href="#/gd/group/${b.id}"><span><b>${dfmt(b.start)}, ${tfmt(b.start)}</b><br><span class="small muted">${esc(b.label||"Group GD")}</span></span><span class="pill ok">Booked</span></a>`).join("")}</div>`:""};draw()}}));

/* ---------- Option A: individual practice ---------- */
const SOLO={stage:"choose",cat:"random",topic:"",tcat:"",text:"",left:0,tm:null,err:"",res:null,secs:0};
function soloReset(){lStop();clearInterval(SOLO.tm);Object.assign(SOLO,{stage:"choose",topic:"",text:"",err:"",res:null,left:0,secs:0})}
R(/^\/gd\/practice$/,()=>({private:true,nav:"/gd",title:"Individual GD practice",html:`${crumbs([["/gd","GD Arena"],[null,"Individual practice"]])}<div id="solo"></div>`,mount:()=>{if(SOLO.stage==="prep"||SOLO.stage==="speak")soloReset();if(SOLO.stage==="analyse")SOLO.stage=SOLO.res?"result":"choose";drawSolo();return()=>{lStop();clearInterval(SOLO.tm);stopSpeak()}}}));
function pickSolo(cat){const keys=["ai","current","faq"];const seen=S.gdSeen=Array.isArray(S.gdSeen)?S.gdSeen:[];
 const pool=(cat==="random"?keys:[cat]).flatMap(k=>GD_BANK[k].map(t=>({t,k})));let fresh=pool.filter(x=>!seen.includes(x.t));if(!fresh.length){S.gdSeen=seen.filter(t=>!pool.some(x=>x.t===t));fresh=pool}
 const p=fresh[Math.floor(Math.random()*fresh.length)];S.gdSeen.push(p.t);S.gdSeen=S.gdSeen.slice(-60);save();return p}
function drawSolo(){const el=$("#solo");if(!el)return;const st=SOLO.stage;let h="";
 if(!SR||!TTS&&false)h=`<div class="note bad" role="alert"><b>This browser cannot capture speech.</b> ${SRERR.unsupported} Speaking is required for GD practice.</div>`;
 if(st==="choose")h+=`${head("Individual GD practice","Choose a category. You get one topic at a time.")}<div class="card stack lg"><div class="grid g2">${GD_CATS2.map(([k,l])=>`<button class="card stack" style="text-align:left;cursor:pointer;${SOLO.cat===k?"border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)":""}" data-act="solocat" data-c="${k}" aria-pressed="${SOLO.cat===k}"><b>${l}</b><span class="small muted">${k==="random"?"A surprise topic from every category":k==="ai"?"Technology, ethics and the future of work":k==="current"?"Economy, society and public policy":"Topics that keep coming up in placements, MBA admissions and interviews"}</span></button>`).join("")}</div><div><button class="btn pri" data-act="solotopic">Get my topic</button></div></div>`;
 else if(st==="topic")h+=`${head("Your topic")}<div class="panel notch stack" style="padding:28px"><span class="pill" style="align-self:flex-start;background:var(--surface);color:var(--ink)">${esc(gdCatLabel(SOLO.tcat))}</span><h2 style="font-size:clamp(22px,4vw,34px)">${esc(SOLO.topic)}</h2></div>
  <div class="note info" style="margin-top:12px">You get 30 seconds to think, then up to ${GD_SOLO/60} minutes to speak. Speak as if you were in a real GD: take a stand, give reasons and examples, and conclude. Your microphone is used for speech recognition; no audio is saved.</div>
  ${SOLO.err?`<div class="note bad" role="alert">${esc(SOLO.err)}</div>`:""}<div class="row" style="margin-top:12px"><button class="btn pri" data-act="soloprep" ${SR?"":"disabled"}>Start</button><button class="btn ghost" data-act="solotopic">Different topic</button><button class="btn ghost" data-act="soloback">Change category</button></div>`;
 else if(st==="prep")h+=`<div class="card stack" style="align-items:center;text-align:center;min-height:360px;justify-content:center"><span class="pill">Think</span><h3 style="max-width:30ch">${esc(SOLO.topic)}</h3><div class="score" style="font-size:56px" id="solot">${fmtClock(SOLO.left)}</div><p class="muted">Prepare your points. Recording starts automatically.</p><button class="btn pri" data-act="soloskipprep">Start speaking now</button></div>`;
 else if(st==="speak")h+=`<div class="card stack" style="align-items:center;text-align:center;min-height:380px;justify-content:center"><h3 style="max-width:30ch">${esc(SOLO.topic)}</h3><div class="mic listen" aria-hidden="true">🎙</div><div class="rec"><i></i> Recording</div><div class="score" style="font-size:48px" id="solot" aria-label="Time left">${fmtClock(SOLO.left)}</div><div class="small muted" id="solowc">${wc(SOLO.text)} words captured</div>${SOLO.err?`<div class="note bad" role="alert">${esc(SOLO.err)}</div>`:""}<div class="row" style="justify-content:center"><button class="btn pri" data-act="solofinish">Finish and get feedback</button><button class="btn ghost" data-act="soloredo">Cancel</button></div></div>`;
 else if(st==="analyse")h+=`<div class="card stack" style="align-items:center;padding:60px 0">${loading("Analysing your response…")}</div>`;
 else if(st==="result")h+=soloResultHtml(SOLO.res);
 el.innerHTML=h}
ACT.solocat=t=>{SOLO.cat=t.dataset.c;drawSolo()};
ACT.solotopic=()=>{const p=pickSolo(SOLO.cat==="random"&&SOLO.tcat&&false?SOLO.tcat:SOLO.cat);SOLO.topic=p.t;SOLO.tcat=p.k;SOLO.stage="topic";SOLO.err="";drawSolo()};
ACT.soloback=()=>{soloReset();drawSolo()};
ACT.soloredo=()=>{soloReset();SOLO.stage="topic";SOLO.topic=SOLO.lastTopic||SOLO.topic;drawSolo()};
ACT.soloprep=()=>{if(!SR)return;SOLO.err="";SOLO.stage="prep";SOLO.left=30;SOLO.lastTopic=SOLO.topic;drawSolo();clearInterval(SOLO.tm);SOLO.tm=setInterval(()=>{SOLO.left--;const e=$("#solot");if(e)e.textContent=fmtClock(SOLO.left);if(SOLO.left<=0){clearInterval(SOLO.tm);soloSpeak()}},1000)};
ACT.soloskipprep=()=>{clearInterval(SOLO.tm);soloSpeak()};
function soloSpeak(){SOLO.stage="speak";SOLO.left=GD_SOLO;SOLO.text="";SOLO.err="";SOLO.secs=0;drawSolo();
 L.patience=1e9;
 lStart({status:()=>{},sound:()=>{},update:t=>{SOLO.text=t;const e=$("#solowc");if(e)e.textContent=wc(t)+" words captured"},auto:()=>{},quiet:n=>{if(n>=4&&!SOLO.text){soloFail("I am not hearing anything. Check that your microphone is unmuted and selected, then try again.")}},fatal:c=>soloFail(SRERR[c]||SRERR.unsupported)});
 clearInterval(SOLO.tm);SOLO.tm=setInterval(()=>{SOLO.left--;SOLO.secs++;const e=$("#solot");if(e)e.textContent=fmtClock(SOLO.left);if(SOLO.left<=0)ACT.solofinish()},1000)}
function soloFail(msg){lStop();clearInterval(SOLO.tm);SOLO.stage="topic";SOLO.err=msg;drawSolo()}
ACT.solofinish=async()=>{if(SOLO.stage!=="speak")return;lStop();clearInterval(SOLO.tm);const text=(SOLO.text||"").trim(),secs=Math.max(1,SOLO.secs||GD_SOLO-SOLO.left);
 const words=wc(text),fillers=(text.toLowerCase().match(/\b(um+|uh+|er+|erm|like|you know|basically|actually|i mean|sort of|kind of)\b/g)||[]).length;
 const rep={id:uid(),kind:"solo",topic:SOLO.topic,category:gdCatLabel(SOLO.tcat),date:Date.now(),transcript:text,secs,words,wpm:Math.round(words/(secs/60)),fillers};
 if(words<25){rep.limited=true;rep.note=words===0?"No speech was captured. Check your microphone and try again.":"Only "+words+" words were captured, which is too little to assess fairly. Aim for at least 60 seconds of speaking.";SOLO.res=rep;SOLO.stage="result";S.gdReports.unshift(rep);save();drawSolo();return}
 SOLO.stage="analyse";drawSolo();await soloScore(rep)};
async function soloScore(rep){
 try{const r=await ai(`You are an experienced group-discussion evaluator for placements and MBA admissions. A candidate spoke alone for about ${Math.round(rep.secs)} seconds on the GD topic: "${rep.topic}". Below is the speech-to-text transcript (it may contain recognition errors; ignore spelling, punctuation and missing filler words and judge the content and delivery you can infer). Judge ONLY what is in the transcript. Do not invent anything the candidate did not say. Quote their own words as evidence. If the transcript is too thin for a criterion, give a lower score and say so. Scores are integers 0-100; be honest, not generous.\n\nTranscript:\n${rep.transcript.slice(0,9000)}\n\nMeasured: ${rep.words} words, ${rep.wpm} words per minute, ${rep.fillers} filler words detected.\n\nReply with only JSON: {"overall":0,"criteria":[{"name":"Content quality","score":0,"explanation":"","evidence":"short quote"},{"name":"Structure","score":0,"explanation":"","evidence":""},{"name":"Clarity","score":0,"explanation":"","evidence":""},{"name":"Communication and delivery","score":0,"explanation":"","evidence":""},{"name":"Relevance and depth","score":0,"explanation":"","evidence":""},{"name":"Examples and evidence","score":0,"explanation":"","evidence":""}],"strengths":["..."],"weaknesses":["..."],"communication":"2-3 sentences on pace, fluency and filler words","content":"2-3 sentences on content quality","structure":"2-3 sentences on structure","clarity":"2-3 sentences on clarity","suggestions":["specific, actionable"],"stronger":"a stronger 60-80 word opening the candidate could use"}`,{tier:"default",cache:false});
  if(!r||!Array.isArray(r.criteria))throw{code:"invalid_json"};
  Object.assign(rep,r);rep.overall=Math.max(0,Math.min(100,Math.round(+r.overall||0)));rep.limited=false;delete rep.note;delete rep.scoreErr}
 catch(e){rep.limited=true;rep.scoreErr=aiMsg(e);rep.note="Your response was captured but could not be scored: "+aiMsg(e)}

function gdBars(cs){return(cs||[]).map(c=>`<div><div class="row between small"><b>${esc(c.name)}</b><span>${c.score==null?"Not enough evidence":c.score}</span></div><div class="bar"><i style="width:${+c.score||0}%"></i></div><div class="small muted">${esc(c.explanation||"")}${c.evidence?` <i>“${esc(c.evidence)}”</i>`:""}</div></div>`).join("")}
function soloResultHtml(r){if(!r)return"";
 const stats=`<div class="grid g3"><div class="card"><div class="score" style="font-size:30px">${r.words}</div><div class="small muted">words</div></div><div class="card"><div class="score" style="font-size:30px">${r.wpm||0}</div><div class="small muted">words per minute</div></div><div class="card"><div class="score" style="font-size:30px">${r.fillers}</div><div class="small muted">filler words in transcript</div></div></div>`;

 const body=r.limited?"":`<div class="tabs" role="tablist" style="margin:14px 0 8px"><button class="tab" data-act="soloview" data-v="score" aria-selected="${SOLO.view!=="notes"&&SOLO.view!=="tr"}">Scores</button><button class="tab" data-act="soloview" data-v="notes" aria-selected="${SOLO.view==="notes"}">Feedback</button><button class="tab" data-act="soloview" data-v="tr" aria-selected="${SOLO.view==="tr"}">Transcript</button></div>
 ${SOLO.view==="notes"?`<div class="grid g2"><div class="card stack"><h3>Strengths</h3>${jl(r.strengths)}<h3>Weaknesses</h3>${jl(r.weaknesses)}</div><div class="card stack"><h3>How to improve</h3>${jl(r.suggestions)}<h3>Communication</h3><p>${esc(r.communication||"")}</p><h3>Content quality</h3><p>${esc(r.content||"")}</p><h3>Structure</h3><p>${esc(r.structure||"")}</p><h3>Clarity</h3><p>${esc(r.clarity||"")}</p></div></div>${r.stronger?`<div class="card stack" style="margin-top:12px"><h3>A stronger opening</h3><p>${esc(r.stronger)}</p></div>`:""}`:SOLO.view==="tr"?soloTr(r):`<div class="grid g2"><div class="card stack"><h3>Criteria</h3>${gdBars(r.criteria)}</div><div class="stack">${stats}</div></div>`}`;
 return`${head("Your feedback")}${head_}${r.limited?`<div style="margin-top:12px">${stats}</div>`:""}${body}${r.limited?soloTr(r):""}<p class="small muted" style="margin-top:10px">AI-generated practice feedback from a speech-to-text transcript. It is not a hiring or admission decision.</p><div class="row" style="margin-top:14px"><button class="btn pri" data-act="soloagain">Practise another topic</button>${A("/reports","My reports","btn ghost")}</div>`}
const soloTr=r=>`<div class="card" style="margin-top:12px"><h3>Transcript</h3><p class="small muted">Speech recognition may mishear words or omit fillers.</p><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.transcript||"(nothing captured)")}</p></div>`;

/* ---------- Option B: book a group slot ---------- */
const GSEL={day:0,pref:"random",slot:0,busy:false,msg:""};

${VIEW.db&&myId()?"":gdNeedDb}<div id="gdb"></div>`,mount:()=>{gdSub(drawGdBook);drawGdBook();const iv=setInterval(drawGdBook,30000);return()=>{clearInterval(iv);gdUnsubs.forEach(u=>u());gdUnsubs=[]}}}));
function drawGdBook(){const el=$("#gdb");if(!el)return;if(!VIEW.db||!myId()){el.innerHTML="";return}

async function gdClaim(slot,pref){ /* atomic seat claim: one lease-guarded document per seat */
 const db=VIEW.db,uidv=myId();
 const read=async()=>(await db.collection("gdbookings").where("slot","==",slot).get()).docs.map(d=>d.data()).filter(d=>d.kind==="seat");
 let sawFull=false;for(let attempt=0;attempt<20;attempt++){
  const docs=await read();
  if(docs.some(d=>d.uid===uidv))return{ok:true,dup:true};
  if(docs.length>=GD_CAP){if(!sawFull){sawFull=true;await new Promise(r=>setTimeout(r,900));continue}return{ok:false,full:true}}
  let busy=false;const taken=new Set(docs.map(d=>d.n));
  for(let n=1;n<=GD_CAP;n++){if(taken.has(n))continue;const ref=db.doc("gdbookings/seat_"+slot+"_"+n);
   const lease=await ref.acquire({holder:uidv+":"+Math.random().toString(36).slice(2),ttlMs:4000});if(!lease.acquired){busy=true;continue}
   const cur=await ref.get();if(cur.exists&&cur.data()&&cur.data().uid)continue;
   await ref.set({kind:"seat",slot,n,uid:uidv,name:myName(),pref,at:Date.now()});
   await new Promise(r=>setTimeout(r,500));const mine=(await read()).filter(x=>x.uid===uidv).map(x=>x.n).sort((a,b)=>a-b);
   if(mine.length>1&&mine[0]!==n){try{await ref.delete()}catch(e){}return{ok:true,dup:true}}
   return{ok:true,n}}
  if(!busy){if(!sawFull){sawFull=true;await new Promise(r=>setTimeout(r,900));continue}return{ok:false,full:true}}
  await new Promise(r=>setTimeout(r,150+Math.random()*250))}
 if((await read()).length>=GD_CAP)return{ok:false,full:true};return{ok:false,busy:true}}
ACT.gdbook=async()=>{if(GSEL.busy||!GSEL.slot)return;const slot=GSEL.slot;if(slot<=Date.now()){GSEL.msg="This session has already started. Pick a later slot.";return drawGdBook()}
 GSEL.busy=true;GSEL.msg="";drawGdBook();
 try{const r=await gdClaim(slot,GSEL.pref);
  if(r.ok){S.gdBookings[slot]={start:slot,label:"Group GD · "+gdCatLabel(GSEL.pref)};save();toast(r.dup?"You already have a seat in this session":"Seat booked")}
  else GSEL.msg=r.full?"This session just filled up. Pick another slot below.":"Many people are booking this slot right now. Try again in a moment."}
 catch(e){GSEL.msg="Booking failed ("+((e&&e.code)||"error")+"). Your access level may be view-only for this page. Try again."}
 GSEL.busy=false;drawGdBook()};

 try{await VIEW.db.doc("gdbookings/"+m.id).delete();delete S.gdBookings[slot];save();toast("Seat cancelled")}catch(e){GSEL.msg="Could not cancel. Try again."}drawGdBook()};

function gdTick(){const el=$("#gds");if(!el||!GS.slot)return;const ph=gdPhaseOf(GS.slot);
 if(ph!==GS.phase){GS.phase=ph;onGdPhase(ph);drawSession(true)}
 const c=$("#gdclock");if(c)c.textContent=gdClockText(ph);
 if(ph==='live')GS.maxPresent=Math.max(GS.maxPresent||0,gdPresent());const w=$("#gdwc");if(w)w.textContent=GS.capOn?GS.words+" words captured":"";
 if(Date.now()-GS.lastDraw>5000)drawSession();

function gdClockText(ph){const n=Date.now(),t=GS.slot;if(ph==="upcoming")return"Waiting room opens in "+fmtClock((t-GD_LOBBY-n)/1000);if(ph==="lobby")return"Starts in "+fmtClock((t-n)/1000);if(ph==="live")return fmtClock((t+GD_LEN-n)/1000);if(ph==="wrap")return"Time is up";return""}
async function onGdPhase(ph){const mine=!!mySeat(GS.slot);
 if(mine&&(ph==="lobby"||ph==="live"))gdJoinRoom();
 if(ph==="live"||ph==="wrap"||ph==="after"){await gdLoadTopic()}

 if(ph==="wrap"&&GS.capOn){gdStopCap();}
 if(ph==="wrap"&&mine){if(GS.words>=40)gdSubmit("live");else{GS.recap=true;drawSession(true)}}

async function gdLoadTopic(){if(GS.topic)return;const id="topic_"+GS.slot;try{let d=await VIEW.db.doc("gdbookings/"+id).get();
  if(!d.exists){const prefs=seats(GS.slot).map(s=>s.pref||"random"),cnt={};prefs.forEach(p=>cnt[p]=(cnt[p]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||(a[0]<b[0]?-1:1))[0];const pref=top?top[0]:"random";const c=gdTopicForSlot(GS.slot,pref);await VIEW.db.doc("gdbookings/"+id).set({kind:"topic",slot:GS.slot,pref,cat:c.cat,topic:c.topic,at:Date.now()});d=await VIEW.db.doc("gdbookings/"+id).get()}
  const x=d.data();GS.topic={topic:x.topic,cat:x.cat}}catch(e){const c=gdTopicForSlot(GS.slot,"random");GS.topic={topic:c.topic,cat:c.cat}}drawSession(true)}
function gdStartCap(){if(GS.capOn||!SR)return;if(!SR){GS.capErr=SRERR.unsupported;return}GS.capOn=true;GS.capErr="";L.patience=1e9;
 lStart({status:()=>{},sound:()=>{},update:t=>{GS.text=t;GS.words=wc(t)},auto:()=>{},quiet:()=>{},fatal:c=>{GS.capOn=false;GS.capErr=SRERR[c]||SRERR.unsupported;drawSession(true)}});drawSession(true)}

/* evaluation: one participant's client does the work (lease), everyone reads the result */
const GD_CRIT=["Content and ideas","Structure and logic","Communication and clarity","Responsiveness to others","Initiative and leadership","Team conduct"];
function checkEv(){const ev=GDR.find(d=>d.id==="ev_"+GS.slot&&d.kind==="ev");if(ev&&!GS.ev){GS.ev=ev;gdSaveGroupReport(ev);drawSession(true)}
 if(!GS.ev&&GS.phase==="after"&&mySeat(GS.slot)&&GS.submitted&&!GS.evBusy)gdEvaluate()}
async function gdEvaluate(){if(GS.evBusy)return;GS.evBusy=true;
 try{if(!(await aiOn())){GS.evBusy=false;GS.evNote="Waiting for another participant's AI to produce the evaluation. Your own AI access is unavailable here.";return}
  const t0=GS.slot+GD_LEN+GD_WRAP,booked=seats(GS.slot).length,expect=Math.max(1,Math.min(booked,GS.maxPresent||1));
  const lease=await VIEW.db.doc("gdreports/lock_"+GS.slot).acquire({holder:myId(),ttlMs:150000});if(!lease.acquired){GS.evBusy=false;return}
  const have=()=>GDR.filter(d=>d.kind==="tr"&&d.slot===GS.slot);
  if(have().length<expect&&Date.now()<t0+90e3){GS.evBusy=false;setTimeout(()=>{if(!GS.ev)checkEv()},8000);return}
  const trs=have(),rankable=trs.filter(x=>x.src!=="none"&&x.words>=40);
  const ev={kind:"ev",slot:GS.slot,topic:(GS.topic&&GS.topic.topic)||"",at:Date.now(),booked,participants:[],shortlist:[],note:""};
  if(!rankable.length){ev.note="No participant's speech was captured, so nothing could be assessed.";ev.participants=trs.map(x=>({uid:x.uid,name:x.name,src:x.src,words:x.words,rankable:false}))}
  else{const labelled=rankable.map((x,i)=>({lab:"P"+(i+1),...x}));
   const r=await ai(`You are an experienced group-discussion evaluator for a PRACTICE session (not a real hiring or admission decision). ${rankable.length} candidates discussed the topic: "${ev.topic}" for about 6 minutes on a video call. Each candidate's speech was transcribed separately on their own device, so you see only each candidate's own words, not the turn order. Sources: "live" = captured during the discussion; "recap" = the candidate's spoken summary AFTER the discussion (weaker evidence: score it more cautiously and say so). Speech-to-text may contain errors; ignore spelling, punctuation and filler words. Judge ONLY what is written. Never invent contributions. Do not reward length for its own sake. Scores are integers 0-100; be honest and differentiate between candidates where the evidence supports it. For "Responsiveness to others" use references to or building on other participants' points; if none are visible, give a modest score and say the evidence is limited.\n\n${labelled.map(x=>`### ${x.lab} (source: ${x.src}, ${x.words} words)\n${x.text.slice(0,5000)}`).join("\n\n")}\n\nReply with only JSON: {"participants":[{"label":"P1","scores":{${GD_CRIT.map(c=>`"${c}":0`).join(",")}},"strengths":["..."],"improvements":["..."],"evidence":"short quote","feedback":"2-3 sentences of specific feedback"}]}`,{tier:"default",cache:false});
   const byLab={};(r&&r.participants||[]).forEach(p=>{byLab[p.label]=p});
   const rows=labelled.map(x=>{const p=byLab[x.lab]||{};const crit=GD_CRIT.map(c=>({name:c,score:Number.isFinite(+(p.scores||{})[c])?Math.max(0,Math.min(100,Math.round(+p.scores[c]))):null}));const sc=crit.filter(c=>c.score!=null).map(c=>c.score);return{uid:x.uid,name:x.name,src:x.src,words:x.words,rankable:sc.length>0,criteria:crit,total:sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null,strengths:(p.strengths||[]).slice(0,4),improvements:(p.improvements||[]).slice(0,4),evidence:p.evidence||"",feedback:p.feedback||""}});
   const ranked=rows.filter(x=>x.total!=null).sort((a,b)=>b.total-a.total);ranked.forEach((x,i)=>x.rank=i+1);
   const others=trs.filter(x=>!rankable.includes(x)).map(x=>({uid:x.uid,name:x.name,src:x.src,words:x.words,rankable:false}));
   ev.participants=[...ranked,...rows.filter(x=>x.total==null),...others];
   if(ranked.length>=3){const k=Math.max(1,Math.ceil(ranked.length*0.3));ev.shortlist=ranked.slice(0,k).map(x=>x.uid)}else ev.note="Fewer than 3 participants had enough speech captured, so no shortlist was made."}
  await VIEW.db.doc("gdreports/ev_"+GS.slot).set(ev)}
 catch(e){GS.evNote="The evaluation could not be completed ("+aiMsg(e)+"). It will retry.";setTimeout(()=>{GS.evBusy=false;if(!GS.ev)checkEv()},20000);return}
 GS.evBusy=false}
function gdSaveGroupReport(ev){const id="g_"+ev.slot;if(S.gdReports.some(r=>r.id===id))return;const me=(ev.participants||[]).find(p=>p.uid===myId());if(!me&&!seats(ev.slot).length)return;
