 S.gdReports.unshift({id,kind:"group",slot:ev.slot,topic:ev.topic,category:"Group GD",date:ev.slot,overall:me&&me.total!=null?me.total:null,limited:!(me&&me.total!=null),note:me?(me.rankable?"":"Not enough speech was captured to assess you."):"You did not submit any speech for this session.",criteria:me&&me.criteria||[],strengths:me&&me.strengths||[],weaknesses:me&&me.improvements||[],feedback:me&&me.feedback||"",evidence:me&&me.evidence||"",rank:me&&me.rank||null,ranked:ranked.length,shortlisted:!!(me&&(ev.shortlist||[]).includes(me.uid)),board:ranked.map(p=>({name:p.name,total:p.total,rank:p.rank,uid:p.uid,short:(ev.shortlist||[]).includes(p.uid)})),src:me&&me.src||"none",words:me&&me.words||0,transcript:""});save();GS.saved=true}

function drawSession(force){const el=$("#gds");if(!el)return;if(!force&&document.activeElement&&el.contains(document.activeElement)&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;GS.lastDraw=Date.now();
 const slot=GS.slot,ph=GS.phase||gdPhaseOf(slot),m=mySeat(slot),bk=seats(slot),n=bk.length,pres=gdPresent();
 const names=bk.map(b=>{const here=GS.room?GS.peers.some(p=>p.presence&&p.presence.u===b.uid):null;return`<div class="row between small"><span>${esc(b.name||"Participant")}${b.uid===myId()?" (you)":""}</span>${here===null?"":`<span class="pill ${here?"ok":""}">${here?"in waiting room":"not here yet"}</span>`}</div>`}).join("")||`<p class="muted">No bookings yet.</p>`;
 const head_=`<div class="panel notch stack" style="padding:22px 26px"><div class="row between"><span class="eyebrow" style="color:var(--muted)">${dfmt(slot)}, ${tfmt(slot)} · ${esc(TZ)}</span><span class="pill" style="background:var(--surface);color:var(--ink)">${n}/${GD_CAP} seats filled</span></div><div class="score" style="font-size:clamp(26px,5vw,42px)" id="gdclock">${gdClockText(ph)}</div></div>`;
 let body="";
 if(!m&&ph!=="after"){body=`<div class="card stack"><h3>You do not have a seat</h3><p class="muted">${ph==="upcoming"||ph==="lobby"?"Book this slot to take part.":"This session has started, so booking is closed."}</p><div class="row">${ph==="upcoming"||ph==="lobby"?(n>=GD_CAP?`<span class="pill bad">Full</span>`:""):""}${A("/gd/group","See available slots","btn pri")}</div></div>`}
 else if(ph==="upcoming"||ph==="lobby"){const url=gdMeetUrl(slot),custom=GDB.some(x=>x.id==="meet_"+slot&&x.kind==="meet");
  body=`<div class="grid g2" style="margin-top:14px"><div class="card stack"><h3>${ph==="lobby"?"Waiting room":"Your seat is booked"}</h3><p class="muted">${ph==="lobby"?"The session starts automatically at the scheduled time. The topic is revealed to everyone at the same moment.":"The waiting room opens 10 minutes before the start. Come back then to join the call."}</p>
   <label class="row small" style="font-weight:500;margin:0"><input type="checkbox" data-act="gdcons" ${GS.consent?"checked":""} style="width:auto;min-height:0"> I agree that my microphone is used for speech recognition during the discussion, and that the resulting text is shared with this session's participants to produce AI feedback and practice rankings. No audio is stored by ROLEVIA.</label>
   <div class="row"><button class="btn ghost sm" data-act="gdprobe" ${SR?"":"disabled"}>Check speech capture</button><span class="small" id="gdprobe" role="status">${esc(GS.probe||"")}</span></div>${GS.capErr?`<div class="note bad" role="alert">${esc(GS.capErr)}</div>`:""}${SR?"":`<div class="note bad">${SRERR.unsupported}</div>`}
   ${ph==="upcoming"?`<div class="row"><button class="btn ghost" data-act="gdcancel2" data-t="${slot}">Cancel my seat</button></div>`:""}</div>
  <div class="card stack"><h3>Participants</h3>${names}${ph==="lobby"?`<p class="small muted">${pres} of ${n} booked participant${n==1?"":"s"} here. If fewer than ${GD_CAP} come, the session runs with whoever is present.</p>`:""}</div></div>
  ${ph==="lobby"?gdCallCard(url,custom):`<div class="note info" style="margin-top:14px">The video call link appears here when the waiting room opens.</div>`}`}
 else if(ph==="live"){const t=GS.topic;const alone=pres<2&&Date.now()>slot+30e3;
  body=`<div class="card stack lg" style="margin-top:14px"><span class="pill" style="align-self:flex-start">${t?esc(gdCatLabel(t.cat)):"Topic"}</span><h2 style="font-size:clamp(22px,4vw,36px)">${t?esc(t.topic):"Loading topic…"}</h2><p class="muted">Discuss with the group on the video call. Respond to each other, build on points and conclude together. The discussion closes automatically when the timer ends.</p></div>
  ${alone?`<div class="note" style="margin-top:12px"><b>Nobody else is here.</b> The session runs with whoever is present, but you are on your own. You can ${A("/gd/practice","practise this topic solo","btn ghost sm")} instead.</div>`:""}
  <div class="grid g2" style="margin-top:14px"><div class="card stack"><h4>Speech capture for your feedback</h4>${GS.capOn?`<div class="rec"><i></i> Capturing your speech <span class="small muted" id="gdwc">${GS.words} words captured</span></div><button class="btn ghost sm" data-act="gdcapoff" style="align-self:flex-start">Pause capture</button>`:GS.consent?`${GS.capErr?`<div class="note bad" role="alert">${esc(GS.capErr)}</div>`:""}<button class="btn pri sm" data-act="gdcapretry" style="align-self:flex-start">${GS.capErr?"Retry":"Start capture"}</button>`:`<div class="note">Tick the consent box to enable capture. Without it you can still talk, but you will not be assessed.</div><label class="row small" style="font-weight:500;margin:0"><input type="checkbox" data-act="gdcons" style="width:auto;min-height:0"> I agree to speech capture for feedback</label>`}<p class="small muted">Capture runs in this tab. If your browser stops it while you are on the call tab, you can add a spoken recap afterwards.</p></div>
  <div class="card stack"><h4>Participants (${pres} here)</h4>${names}</div></div>${gdCallCard(gdMeetUrl(slot),GDB.some(x=>x.id==="meet_"+slot&&x.kind==="meet"))}`}
 else if(ph==="wrap"){body=`<div class="card stack lg" style="margin-top:14px"><h3>Discussion closed</h3><p class="muted">The timer has ended. You can leave the call.</p>
  ${m&&GS.recap?`<div class="note info"><b>Add a short spoken recap.</b> Not enough of your speech was captured during the call (${GS.words} words). Summarise the points you made, in your own words, so you can still be assessed. Recap-based assessments are marked as weaker evidence.</div>${GS.recapOn?`<div class="row"><span class="rec"><i></i> Recording recap</span><span class="small muted" id="gdrwc">${wc(GS.recapText)} words</span></div><div class="row"><button class="btn pri" data-act="gdrecapdone">Done</button></div>`:`<div class="row"><button class="btn pri" data-act="gdrecap" ${SR?"":"disabled"}>Start recap</button><button class="btn ghost" data-act="gdrecapskip">Skip</button></div>`}${GS.capErr?`<div class="note bad" role="alert">${esc(GS.capErr)}</div>`:""}`:`<div class="note ok">Your contribution has been submitted. The AI evaluation starts shortly.</div>`}</div>`}
 else{ /* after */ body=GS.ev?gdResultHtml(GS.ev):`<div class="card stack" style="margin-top:14px;align-items:center;padding:40px 0">${m?loading("Evaluating the discussion…"):"<p class='muted'>This session has ended.</p>"}${GS.evNote?`<p class="small muted">${esc(GS.evNote)}</p>`:""}</div><div class="row" style="margin-top:12px">${A("/gd/group","Book another session","btn pri")}${A("/gd/practice","Practise solo","btn ghost")}</div>`}
 el.innerHTML=head_+body+gdRules()}
const gdRules=()=>`<div class="note info small" style="margin-top:14px"><b>Practice only.</b> Rankings and shortlists here are AI-generated practice assessments based on speech-to-text from each participant. They are not hiring or admission decisions and do not reflect any employer or institution.</div>`;
function gdCallCard(url,custom){return`<div class="card stack" style="margin-top:14px"><h4>Video and audio call</h4><p class="muted small">Everyone in this session joins the same call. The room is created when the first person joins.</p><div class="row"><a class="btn pri" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open the video call</a><span class="small muted" style="overflow-wrap:anywhere">${esc(url.replace(/^https:\/\//,""))}</span></div>
 <p class="small muted">The free public room may ask the first person in to sign in before it starts; everyone else then joins directly. If it does not work for your group, anyone can share a Google Meet, Zoom, Teams or Whereby link for this session:</p>
 <div class="row" style="flex-wrap:nowrap"><input id="gdml" placeholder="https://meet.google.com/…" aria-label="Alternative meeting link" style="flex:1"><button class="btn ghost sm" data-act="gdmeet">Share link</button>${custom?`<button class="btn ghost sm" data-act="gdmeetreset">Use default room</button>`:""}</div><div class="err" id="gdmerr" role="alert"></div></div>`}
function gdResultHtml(ev){const me=(ev.participants||[]).find(p=>p.uid===myId()),ranked=(ev.participants||[]).filter(p=>p.total!=null).sort((a,b)=>a.rank-b.rank);
 return`<div class="stack" style="margin-top:14px">${me&&me.total!=null?`<div class="card row between"><div><div class="small muted">Your practice score</div><div class="score">${me.total}</div></div><div><div class="small muted">Practice rank</div><div class="score">${me.rank}<span class="small muted"> of ${ranked.length}</span></div></div><div>${(ev.shortlist||[]).includes(myId())?`<span class="pill ok">In the practice shortlist</span>`:ranked.length>=3?`<span class="pill">Not in the practice shortlist</span>`:`<span class="pill">No shortlist</span>`}</div></div>`:`<div class="note">${me?"Not enough of your speech was captured to assess you.":"You did not submit speech for this session."}</div>`}
 ${ranked.length?`<div class="card stack"><h3>Practice ranking</h3>${ranked.map(p=>`<div class="row between"><span><b>${p.rank}.</b> ${esc(p.name)}${p.uid===myId()?" (you)":""} ${(ev.shortlist||[]).includes(p.uid)?'<span class="pill ok">shortlisted</span>':""}${p.src==="recap"?' <span class="pill ai">recap-based</span>':""}</span><b>${p.total}</b></div>`).join("")}</div>`:""}
 ${ev.note?`<div class="note">${esc(ev.note)}</div>`:""}
 <div class="row">${S.gdReports.some(r=>r.id==="g_"+ev.slot)?A("/reports/gd/g_"+ev.slot,"Open my full feedback report","btn pri"):""}${A("/gd/group","Book another session","btn ghost")}</div></div>`}
ACT.gdcancel2=async t=>{const slot=+t.dataset.t,m=mySeat(slot);if(!m)return;try{await VIEW.db.doc("gdbookings/"+m.id).delete();delete S.gdBookings[slot];save();toast("Seat cancelled");go("/gd/group")}catch(e){toast("Could not cancel")}};

/* ---------- GD report (individual and group) ---------- */
R(/^\/reports\/gd\/([^/]+)$/,id=>{const r=S.gdReports.find(x=>x.id===id);if(!r)return{private:true,nav:"/reports",html:`<div class="empty"><h3>Report not found</h3><p style="margin-top:10px">${A("/reports","My reports","btn pri")}</p></div>`};
 const sum=r.strengths||r.strongest,weak=r.weaknesses||r.missed,sug=r.suggestions||r.next;
 return{private:true,nav:"/reports",title:"GD report",html:`${crumbs([["/reports","My Reports"],[null,"GD report"]])}<div class="panel notch" style="padding:24px 28px"><span class="eyebrow" style="color:var(--muted)">${esc(r.category||"")} · ${fmtDate(r.date)}</span><h2 style="font-size:clamp(22px,4vw,32px);margin-top:6px">${esc(r.topic)}</h2>${r.overall!=null?`<div class="row" style="gap:24px;margin-top:10px"><div><div class="score">${r.overall}</div><div class="small" style="color:var(--muted)">Score / 100</div></div>${r.rank?`<div><div class="score">${r.rank}<span style="font-size:18px"> / ${r.ranked}</span></div><div class="small" style="color:var(--muted)">Practice rank${r.shortlisted?" · shortlisted":""}</div></div>`:""}</div>`:""}</div>
 <div class="note info" style="margin-top:12px">AI-generated practice assessment from speech-to-text. It is private to you and is not a hiring or admission decision.${r.src==="recap"?" This assessment is based on a spoken recap, which is weaker evidence.":""}</div>
 ${r.limited?`<div class="note" style="margin-top:12px"><b>No score.</b> ${esc(r.note||"")}</div>`:`<div class="grid g2" style="margin-top:16px"><div class="card stack"><h3>Criteria</h3>${gdBars(r.criteria)}</div><div class="card stack"><h3>Strengths</h3>${jl(sum)}<h3>Weaknesses</h3>${jl(weak)}${sug&&sug.length?`<h3>Suggestions</h3>${jl(sug)}`:""}${r.feedback?`<h3>Feedback</h3><p>${esc(r.feedback)}</p>`:""}${r.communication?`<h3>Communication</h3><p>${esc(r.communication)}</p><h3>Content quality</h3><p>${esc(r.content||"")}</p><h3>Structure</h3><p>${esc(r.structure||"")}</p><h3>Clarity</h3><p>${esc(r.clarity||"")}</p>`:""}</div></div>`}
 ${r.board&&r.board.length?`<div class="card stack" style="margin-top:16px"><h3>Practice ranking</h3>${r.board.map(p=>`<div class="row between"><span><b>${p.rank}.</b> ${esc(p.name)} ${p.short?'<span class="pill ok">shortlisted</span>':""}</span><b>${p.total}</b></div>`).join("")}</div>`:""}
 ${r.transcript?`<details class="card" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700">Transcript</summary><p style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px">${esc(r.transcript)}</p></details>`:""}
 <div class="row" style="margin-top:14px"><a class="btn pri" href="#/gd">Back to GD Arena</a><button class="btn ghost" data-act="gdrdel" data-id="${r.id}">Delete this report</button></div>`}});
ACT.gdrdel=t=>{if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Confirm delete";return}S.gdReports=S.gdReports.filter(r=>r.id!==t.dataset.id);save();go("/reports")};
</script>
<script>
/* ---------- website backend layer (Supabase auth + database, Razorpay checkout) ----------
   Only active on the hosted website when /api/config reports a configured backend.
   In the Claude artifact (no ROLEVIA_SITE) none of this runs and the app behaves as before. */
const SITE=(function(){
 const cfg=window.ROLEVIA_CFG||{backend:false,payments:false};
 const lib=window.supabase;
 const problem=!window.ROLEVIA_SITE?"":!cfg.backend?"The database is not connected yet (Supabase settings are missing).":!(lib&&lib.createClient)?"The sign-in library could not be loaded. Check your connection and reload.":"";
 const on=!!(window.ROLEVIA_SITE&&cfg.backend&&lib&&lib.createClient);
 const sb=on?lib.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}}):null;
 const T={cfg,on,sb,problem,summary:null,summaryErr:null};
 window.ROLEVIA_AUTH={token:async()=>{if(!sb)return null;try{const {data}=await sb.auth.getSession();return data.session?data.session.access_token:null}catch(e){return null}}};
 if(!on)return T;

 /* ----- messages ----- */
 T.msg=e=>{const m=String((e&&(e.message||e.code))||e||"");
  if(/no_credits/.test(m))return"You have no sessions left for this. Get more on the Pricing page.";
  if(/daily_limit/.test(m))return"You have reached today's limit of 5 solo GD practices. Try again tomorrow.";
  if(/not_signed_in|JWT|expired/i.test(m))return"Please sign in again.";
  if(/already_booked/.test(m))return"You already have a seat in this session.";
  if(/conflict/.test(m))return"You already have a session at an overlapping time.";
  if(/started/.test(m))return"This session has already started.";
  if(/too_far/.test(m))return"You can book up to 8 days ahead.";
  if(/bad_slot/.test(m))return"That is not a valid session time.";
  if(/full/.test(m))return"This session is full.";
  if(/Failed to fetch|NetworkError|network/i.test(m))return"Network problem. Check your connection and try again.";
  return"Something went wrong. Please try again."};

 /* ----- identity ----- */
 const nameOf=u=>(u.user_metadata&&u.user_metadata.name)||String(u.email||"").split("@")[0]||"Member";
 function resetLocal(){Object.assign(S,{cv:null,bookmarks:[],lists:[],qlib:[],reports:[],sessions:[],companies:{},recent:[],gdReports:[],gdBookings:{},research:{},profile:{level:"",roles:[],industries:[],goals:[],targets:[]}})}
 T.adopt=u=>{if(S.owner&&S.owner!==u.id)resetLocal();S.owner=u.id;S.user={name:nameOf(u),email:u.email,id:u.id};S.account=S.user;VIEW.me={id:u.id,name:S.user.name};VIEW.db=dbShim;VIEW.room=roomShim;VIEW.canEdit=false;save()};
 T.drop=()=>{S.user=null;VIEW.me=null;VIEW.db=null;VIEW.room=null;T.summary=null;AI_CTX.id=null;save()};
 function localSessionUser(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^sb-.*-auth-token$/.test(k)){const v=JSON.parse(localStorage.getItem(k));if(v&&v.user&&v.user.id)return v.user}}}catch(e){}return null}

 T.signup=async(name,email,password)=>{const b=$("#sbtn"),er=$("#serr");if(b){b.disabled=true;b.textContent="Creating…"}
  try{const {data,error}=await sb.auth.signUp({email,password,options:{data:{name},emailRedirectTo:location.origin+"/"}});
   if(error){if(er)er.textContent=/registered|exists/i.test(error.message)?"That email already has an account. Sign in instead.":/password/i.test(error.message)?"Choose a stronger password (at least 8 characters).":/rate/i.test(error.message)?"Too many attempts. Wait a few minutes and try again.":"Could not create the account: "+error.message;return}
   if(data.session){T.adopt(data.user);await T.refresh();go("/onboarding")}
   else{S.pendingEmail=email;save();go("/verify-email")}
  }catch(e){if(er)er.textContent=T.msg(e)}finally{if(b){b.disabled=false;b.textContent="Create account"}}};
 T.login=async(email,password)=>{const b=$("#lbtn"),er=$("#lerr");if(b){b.disabled=true;b.textContent="Signing in…"}
  try{const {data,error}=await sb.auth.signInWithPassword({email,password});
   if(error){if(er)er.textContent=/confirm/i.test(error.message)?"Confirm your email first: open the link we sent you, then sign in.":/invalid/i.test(error.message)?"Email or password is wrong.":/rate/i.test(error.message)?"Too many attempts. Wait a few minutes and try again.":"Could not sign in: "+error.message;return}
   T.adopt(data.user);await T.refresh();const n=S.next;S.next=null;go(n||(S.profile.level?"/dashboard":"/onboarding"))
  }catch(e){if(er)er.textContent=T.msg(e)}finally{if(b){b.disabled=false;b.textContent="Sign in"}}};
 T.forgot=async email=>{const er=$("#ferr"),ok=$("#fok");try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/"});if(error&&/rate/i.test(error.message)){er.textContent="Too many requests. Wait a few minutes.";return}ok.innerHTML=`<div class="note ok" role="status">If an account exists for ${esc(email)}, a reset link is on its way.</div>`}catch(e){er.textContent=T.msg(e)}};
 T.resetPassword=async pw=>{const er=$("#rerr");try{const {error}=await sb.auth.updateUser({password:pw});if(error){er.textContent="Could not save: "+error.message;return}toast("Password updated");go("/dashboard")}catch(e){er.textContent=T.msg(e)}};
 const _logout=ACT.logout;
 ACT.logout=async()=>{try{await sb.auth.signOut()}catch(e){}T.drop();toast("Signed out");go("/")};

 /* ----- balances and sessions ----- */
 T.refresh=async()=>{if(!S.user)return null;try{const {data,error}=await sb.rpc("my_summary");if(error)throw error;T.summary=data;T.summaryErr=null}catch(e){T.summaryErr=T.msg(e)}return T.summary};
 T.startSession=async(kind,meta)=>{const {data,error}=await sb.rpc("start_session",{p_kind:kind,p_meta:meta||{}});if(error)throw error;T.refresh();return data};
 T.closeSession=async(id,status)=>{try{await sb.rpc("close_session",{p_id:id,p_status:status})}catch(e){}T.refresh().then(()=>{if(/^#\/(dashboard|pricing)/.test(location.hash))render()})};
 T.dashCard=()=>{const s=T.summary;
  const body=s?`<div class="grid g2"><div><div class="score">${s.interviews}</div><div class="small muted">AI interview${s.interviews==1?"":"s"} left</div></div><div><div class="score">${s.gd}</div><div class="small muted">group GD${s.gd==1?"":"s"} left</div></div></div>
   ${(s.grants||[]).filter(g=>g.expires).slice(0,2).map(g=>`<div class="small muted">${g.remaining} ${g.kind==="gd"?"GD":"interview"}${g.remaining==1?"":"s"} expire${g.remaining==1?"s":""} ${fmtDate(g.expires)}</div>`).join("")}
   <div class="small muted">${s.completedInterviews} interview${s.completedInterviews==1?"":"s"} completed · ${S.reports.length} report${S.reports.length==1?"":"s"} saved in this browser</div>
   ${s.interviews<1||s.gd<1?`<div class="note small">${s.interviews<1&&s.gd<1?"You are out of sessions.":s.interviews<1?"You are out of interviews.":"You are out of group GDs."} ${A("/pricing","See packages")}</div>`:""}`
   :T.summaryErr?`<div class="note bad small" role="alert">${esc(T.summaryErr)} <button class="btn ghost sm" data-act="sitereload">Retry</button></div>`:loading("Loading your sessions…");
  return`<div class="card stack"><div class="row between"><h3>Your sessions</h3>${A("/pricing","Get more","small")}</div>${body}</div>`};
 ACT.sitereload=async()=>{T.summaryErr=null;await T.refresh();render()};
 T.gdNote=()=>{const s=T.summary;if(!s)return`<p class="small muted">Booking uses 1 group GD session.</p>`;
  return s.gd<1?`<div class="note small">You have no group GD sessions left. ${A("/pricing","Get more")}</div>`:`<p class="small muted">Booking uses 1 of your ${s.gd} group GD session${s.gd==1?"":"s"}. Cancel at least 1 hour before the start to get it back.</p>`};

 /* ----- database shim: the document API the GD pages use, backed by Postgres functions ----- */
 const seatDoc=r=>({id:"seat_"+r.slot_ms+"_"+r.n,data:{kind:"seat",slot:Number(r.slot_ms),n:Number(r.n),uid:r.user_id,name:r.name,pref:r.pref,at:Number(r.at_ms)}});
 async function listCol(name){
  const out=[];
  if(name==="gdbookings"){const {data,error}=await sb.from("gd_seats").select("*");if(error)throw error;(data||[]).forEach(r=>out.push(seatDoc(r)))}
  const {data,error}=await sb.rpc("kv_list",{p_col:name});if(error)throw error;(data||[]).forEach(r=>out.push({id:r.id,data:r.data}));
  return out}
 const snapOf=docs=>({docs:docs.map(d=>({id:d.id,data:()=>d.data})),empty:!docs.length});
 const pollers=new Set();
 function colRef(name,filters){return{
  where(f,op,v){return colRef(name,filters.concat([[f,op,v]]))},
  async get(){let d=await listCol(name);filters.forEach(([f,op,v])=>{d=d.filter(x=>op==="=="?x.data[f]===v:true)});return snapOf(d)},
  onSnapshot(cb,errcb){let stop=false,last="",busy=false;
   const tick=async()=>{if(stop||busy)return;busy=true;try{let d=await listCol(name);filters.forEach(([f,op,v])=>{d=d.filter(x=>op==="=="?x.data[f]===v:true)});const k=JSON.stringify(d);if(k!==last){last=k;if(!stop)cb(snapOf(d))}}catch(e){if(errcb&&!stop)errcb(e)}finally{busy=false}};
   const p={tick};pollers.add(p);tick();const iv=setInterval(tick,3000);return()=>{stop=true;clearInterval(iv);pollers.delete(p)}}}}
 T.poke=()=>pollers.forEach(p=>p.tick());
 function docRef(name,id){const isSeat=name==="gdbookings"&&/^seat_/.test(id);return{
  async get(){if(isSeat){const d=(await listCol(name)).find(x=>x.id===id);return{exists:!!d,id,data:()=>d?d.data:undefined}}
   const {data,error}=await sb.rpc("kv_get",{p_col:name,p_id:id});if(error)throw error;return{exists:data!=null,id,data:()=>data||undefined}},
  async set(obj){if(isSeat)throw new Error("Seats are booked through the booking function.");const {error}=await sb.rpc("kv_put",{p_col:name,p_id:id,p_data:obj});if(error)throw error},
  async delete(){if(isSeat)throw new Error("Seats are cancelled through the cancel function.");const {error}=await sb.rpc("kv_delete",{p_col:name,p_id:id});if(error)throw error},
  async acquire(o){const {data,error}=await sb.rpc("kv_acquire",{p_col:name,p_id:id,p_holder:String(o&&o.holder||""),p_ttl_ms:Math.min(Number(o&&o.ttlMs)||5000,300000)});if(error)throw error;return{acquired:data===true}}}}
 const dbShim={collection:n=>colRef(n,[]),doc:path=>{const [c,...r]=path.split("/");return docRef(c,r.join("/"))}};

 /* ----- waiting-room presence over Supabase Realtime ----- */
 const roomShim={async join(name){
  const ch=sb.channel("room:"+name,{config:{presence:{key:S.user.id}}});let mine={},subs=new Set(),ready=false;
  const peers=()=>{const st=ch.presenceState();return Object.keys(st).map(k=>({id:k,kind:"viewer",presence:Object.assign({},...(st[k]||[]).map(x=>{const y=Object.assign({},x);delete y.presence_ref;return y}))}))};
  ch.on("presence",{event:"sync"},()=>subs.forEach(f=>{try{f(peers())}catch(e){}}));
  await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error("room timeout")),8000);ch.subscribe(st=>{if(st==="SUBSCRIBED"){clearTimeout(to);ready=true;res()}else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){clearTimeout(to);rej(new Error(st))}})});
  return{presence:async p=>{mine=Object.assign({},mine,p);if(ready)await ch.track(mine)},onPeers:f=>{subs.add(f);return()=>subs.delete(f)},peers,leave:()=>{try{ch.untrack();sb.removeChannel(ch)}catch(e){}}}}};

 /* ----- boot ----- */
 T.boot=()=>{const u=localSessionUser();if(u)T.adopt(u);else if(S.user)T.drop();
  render();
  sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{
   if(ev==="SIGNED_OUT"){if(S.user){T.drop();render()}}
   else if(ev==="PASSWORD_RECOVERY"&&session){T.adopt(session.user);go("/reset-password")}
   else if(session&&session.user&&(!S.user||S.user.id!==session.user.id)){T.adopt(session.user);T.refresh().then(()=>render())}},0)});
  sb.auth.getSession().then(async({data})=>{const ses=data&&data.session;
   if(!ses&&S.user){T.drop();render();return}
   if(ses&&(!S.user||S.user.id!==ses.user.id)){T.adopt(ses.user)}
   if(ses){await T.refresh();if(/^#\/(dashboard|pricing|gd|interviews)/.test(location.hash))render()}});};
 return T;
})();

/* AI usage context and credit-gated starts */
if(SITE.on){
 initCaps=async function(){};
 /* interviews: the server spends one credit when the interview starts and gates every AI call of that session */
 const _sustart=ACT.sustart;
 ACT.sustart=async(t,e)=>{
  const P=SU.prep,er=$("#ierr");
  if(!P||P.status!=="done"||!SU.mic||!SU.spk||P.key!==suKey())return _sustart(t,e);   // let the original show its own validation message
  if(SU.starting)return;SU.starting=true;if(t){t.disabled=true;t.textContent="Starting…"}
  try{const r=await SITE.startSession("interview",{company:(SU.v.company||"").slice(0,80),role:SU.v.role,mode:SU.v.mode||"standard"});SU.sid=r.id}
  catch(err){SU.starting=false;if(er)er.innerHTML=esc(SITE.msg(err))+(/no_credits/.test(String(err&&err.message))?" "+A("/pricing","See packages"):"");if(t){t.disabled=false;t.textContent="Start interview"}return}
  SU.starting=false;_sustart(t,e);
  const s=S.sessions[0];if(s&&!s.serverId&&s.status==="active"){s.serverId=SU.sid;save()}};
 const _liveMount=liveMount;
 liveMount=function(s){AI_CTX.id=s.serverId||null;const c=_liveMount(s);return()=>{AI_CTX.id=null;if(typeof c==="function")c()}};
 const _doFinish=doFinish;
 doFinish=async function(s,room){AI_CTX.id=s.serverId||null;await _doFinish(s,room);
  if(s.serverId&&s.status==="done"){const id=s.serverId;s.serverId=null;save();AI_CTX.id=null;SITE.closeSession(id,s.reportId?"completed":"abandoned")}};
 /* solo GD practice */
 const _soloprep=ACT.soloprep;
 ACT.soloprep=async(t,e)=>{if(!SR)return;if(SOLO.sid)return _soloprep(t,e);
  try{const r=await SITE.startSession("gd_solo",{topic:(SOLO.topic||"").slice(0,200)});SOLO.sid=r.id}catch(err){SOLO.err=SITE.msg(err);return drawSolo()}
  _soloprep(t,e)};
 const _soloScore=soloScore;
 soloScore=async function(rep){const sid=SOLO.sid;if(sid)AI_CTX.id=sid;try{return await _soloScore(rep)}finally{if(sid){SOLO.sid=null;AI_CTX.id=null;SITE.closeSession(sid,"completed")}}};
 const _soloReset=soloReset;
 soloReset=function(){if(SOLO.sid&&SOLO.stage!=="result"){const sid=SOLO.sid;SOLO.sid=null;SITE.closeSession(sid,"abandoned")}_soloReset()};

 /* group GD: seats are booked and cancelled by atomic database functions (6 per slot) */
 gdClaim=async function(slot,pref){
  const {data,error}=await SITE.sb.rpc("book_gd",{p_slot:new Date(slot).toISOString(),p_name:myName(),p_pref:pref||"random"});
  if(error){const m=String(error.message||"");if(/already_booked/.test(m))return{ok:true,dup:true};if(/\bfull\b/.test(m))return{ok:false,full:true};return{ok:false,err:SITE.msg(error)}}
  return{ok:true,taken:data&&data.taken}};
 ACT.gdbook=async()=>{if(GSEL.busy||!GSEL.slot)return;const slot=GSEL.slot;
  if(slot<=Date.now()){GSEL.msg="This session has already started. Pick a later slot.";return drawGdBook()}
  if(SITE.summary&&SITE.summary.gd<1){GSEL.msg="You have no group GD sessions left. Get more on the Pricing page.";return drawGdBook()}
  GSEL.busy=true;GSEL.msg="";drawGdBook();
  try{const r=await gdClaim(slot,GSEL.pref);
   if(r.ok){S.gdBookings[slot]={start:slot,label:"Group GD · "+gdCatLabel(GSEL.pref)};save();toast(r.dup?"You already have a seat in this session":"Seat booked");await SITE.refresh()}
   else GSEL.msg=r.full?"This session just filled up. Pick another slot.":(r.err||"Booking failed. Try again.")}
  catch(e){GSEL.msg=SITE.msg(e)}
  GSEL.busy=false;SITE.poke();drawGdBook()};
 async function cancelSeat(slot){const {data,error}=await SITE.sb.rpc("cancel_gd",{p_slot:new Date(slot).toISOString()});if(error)throw error;delete S.gdBookings[slot];save();await SITE.refresh();SITE.poke();return data}
 ACT.gdcancel=async t=>{const slot=+t.dataset.t;if(!mySeat(slot))return;
  try{const r=await cancelSeat(slot);toast(r&&r.refunded?"Seat cancelled. Your session was returned.":"Seat cancelled. It was less than 1 hour before the start, so the session is not returned.")}
  catch(e){GSEL.msg=/started/.test(String(e&&e.message))?"The session has started, so it can no longer be cancelled.":SITE.msg(e)}
  drawGdBook()};
 ACT.gdcancel2=async t=>{const slot=+t.dataset.t;
  try{await cancelSeat(slot);toast("Seat cancelled");go("/gd/group")}catch(e){toast(SITE.msg(e))}};

 /* checkout */
 const rzp=()=>window.Razorpay?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://checkout.razorpay.com/v1/checkout.js";s.onload=res;s.onerror=()=>rej(new Error("The payment window could not be loaded. Disable content blockers and try again."));document.head.appendChild(s)});
 const pstat=(k,m)=>{const el=$("#paystat");if(el)el.innerHTML=k==="busy"?loading(m):`<div class="note ${k==="ok"?"ok":"bad"}" role="${k==="ok"?"status":"alert"}" style="margin-bottom:16px">${m}</div>`};
 ACT.buy=async t=>{const plan=t.dataset.plan,pl=PLANS.find(p=>p.id===plan);if(!pl)return;
  if(!S.user){S.next="/pricing";return go("/login")}
  const btns=$$("[data-act=buy]");btns.forEach(b=>b.disabled=true);
  const done=()=>btns.forEach(b=>b.disabled=false);
  try{
   pstat("busy","Creating your order…");
   const token=await ROLEVIA_AUTH.token();
   const r=await fetch("/api/pay/order",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+token},body:JSON.stringify({planId:plan})});
   const j=await r.json().catch(()=>({}));
   if(!r.ok){pstat("err",esc(j.error||"Could not start the payment."));return done()}
   await rzp();
   const before=SITE.summary?SITE.summary.gd+SITE.summary.interviews:0;
   const box=new Razorpay({key:j.keyId,amount:j.amount,currency:j.currency,name:"ROLEVIA",description:j.planName,order_id:j.orderId,prefill:{name:S.user.name,email:S.user.email},theme:{color:"#111111"},
    modal:{ondismiss:()=>{pstat("err","Payment cancelled. You were not charged.");done()}},
    handler:async resp=>{pstat("busy","Confirming your payment…");
     try{const v=await fetch("/api/pay/verify",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+(await ROLEVIA_AUTH.token())},body:JSON.stringify(resp)});
      const vj=await v.json().catch(()=>({}));
      if(!v.ok)throw new Error(vj.error||"Verification failed");
      await SITE.refresh();pstat("ok",`<b>Payment confirmed.</b> ${esc(pl.name)} is now on your account. You have ${SITE.summary.interviews} interview${SITE.summary.interviews==1?"":"s"} and ${SITE.summary.gd} group GD${SITE.summary.gd==1?"":"s"} available. ${A("/interviews/new","Start an interview")} · ${A("/gd/group","Book a GD")}`)}
     catch(err){if(/signature|did not match|invalid/i.test(String(err.message))){pstat("err",`We could not verify this payment (${esc(err.message)}). Nothing was unlocked. If money left your account, it is matched automatically by our payment provider; quote payment ID ${esc(resp.razorpay_payment_id||"")} if you contact us.`);return done()}
      pstat("err",`We received your payment (ID ${esc(resp.razorpay_payment_id||"")}) but could not confirm it just now (${esc(err.message)}). Your sessions are added automatically within a minute once the bank confirms. Refresh this page to check.`);
      for(let i=0;i<8;i++){await new Promise(r=>setTimeout(r,4000));await SITE.refresh();if(SITE.summary&&SITE.summary.gd+SITE.summary.interviews>before){pstat("ok","<b>Payment confirmed.</b> Your sessions have been added.");break}}}
     done()}});
   box.on("payment.failed",x=>{pstat("err","Payment failed"+(x&&x.error&&x.error.description?": "+esc(x.error.description):"")+". You were not charged. Try again.");done()});
   pstat("busy","Opening the payment window…");box.open();$("#paystat").innerHTML="";
  }catch(err){pstat("err",esc(err.message||"Something went wrong."));done()}};
}
</script>
<script>
/* ---------- pricing ---------- */
R(/^\/pricing$/,()=>{const site=typeof SITE!=="undefined"&&SITE.on,payOn=site&&SITE.cfg.payments,bal=site&&S.user&&SITE.summary;

<p class="small muted" style="margin-top:14px">Prices are in Indian rupees. The dollar figure is an approximate conversion (₹179 ≈ $1.88 at the time of writing) shown for reference; you are charged in INR. Cancel a booked group GD at least 1 hour before it starts and the session is returned to your account.</p>`}});

R(/^\/jobs(?:\/([^/]+))?(?:\/([^/]+))?$/,(role,co)=>{const f={role:role||S.profile.roles[0]||"",co:co||"",loc:"",type:"",ind:""};
 return{private:true,nav:"/jobs",title:"Job Opportunities",html:`${head("Job opportunities","Search by role, company, location and industry.")}
<div class="note" style="margin-bottom:14px"><b>No job feed is connected.</b> ROLEVIA shows no listings of its own, so it cannot show descriptions, required skills or deadlines, and it will not make any up. The search below opens live results on public job sites. Listings there are not verified by ROLEVIA, and "last checked" is not available.</div>

function jobLinks(d){const kw=[d.type,d.role,d.ind,d.co].filter(Boolean).join(" ").trim();const el=$("#jres");if(!kw){el.innerHTML=`<div class="err">Enter a role or company first.</div>`;return}
 const q=encodeURIComponent(kw),l=encodeURIComponent(d.loc||"India");
 const L=[["LinkedIn Jobs",`https://www.linkedin.com/jobs/search/?keywords=${q}&location=${l}`],["Indeed India",`https://in.indeed.com/jobs?q=${q}&l=${encodeURIComponent(d.loc||"")}`],["Google search",`https://www.google.com/search?q=${encodeURIComponent(kw+" jobs "+(d.loc||""))}`]];
 if(d.co)L.unshift(["Official careers (search)",careersLink(d.co)]);
 el.innerHTML=`<h3 style="margin-bottom:10px">Open results for “${esc(kw)}”${d.loc?" in "+esc(d.loc):""}</h3><div class="grid g3">${L.map(([n,u])=>`<a class="card row between" target="_blank" rel="noopener noreferrer" href="${u}"><b>${n}</b><span aria-hidden="true">↗</span></a>`).join("")}</div>`}

/* ---------- CV (upload only: PDF or DOCX) ---------- */
const CVF=[["education","Education"],["experience","Experience"],["skills","Skills"],["projects","Projects"]];
const CV_MAX=5*1024*1024;
const CV_LIBS={pdf:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",pdfWorker:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",docx:"https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"};
const _scripts={};
function loadScript(u){return _scripts[u]||(_scripts[u]=new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>{delete _scripts[u];no(new Error("Could not load the file reader ("+u.split("/")[5]+"). Check your connection and retry."))};document.head.appendChild(s)}))}
function cvKind(file){const n=(file.name||"").toLowerCase();if(/\.pdf$/.test(n)||file.type==="application/pdf")return"pdf";if(/\.docx$/.test(n)||file.type==="application/vnd.openxmlformats-officedocument.wordprocessingml.document")return"docx";return null}
function cvValidate(file){if(!file)return"Choose a PDF or DOCX file first.";const k=cvKind(file);if(!k){return/\.docx?$/i.test(file.name)&&!/\.docx$/i.test(file.name)?"Old .doc files are not supported. Save the CV as DOCX or PDF and upload that.":"Only PDF and DOCX files are accepted. This file is "+(file.name.split(".").pop()||"unknown").toUpperCase()+"."}
 if(file.size===0)return"This file is empty.";if(file.size>CV_MAX)return"This file is "+(file.size/1048576).toFixed(1)+" MB. The limit is 5 MB.";return null}
async function cvRead(file){const k=cvKind(file),buf=await file.arrayBuffer();
 if(k==="pdf"){if(!window.pdfjsLib){await loadScript(CV_LIBS.pdf)}
  if(!window.pdfjsLib)throw new Error("The PDF reader did not load.");
  try{pdfjsLib.GlobalWorkerOptions.workerSrc=CV_LIBS.pdfWorker}catch(e){}
  let doc;try{doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise}catch(e){if(e&&e.name==="PasswordException")throw new Error("This PDF is password-protected. Remove the password and upload it again.");throw new Error("This PDF could not be opened. It may be damaged.")}
  let out=[];for(let i=1;i<=Math.min(doc.numPages,12);i++){const pg=await doc.getPage(i),tc=await pg.getTextContent();let line="",y=null;
   for(const it of tc.items){if(!("str" in it))continue;const yy=it.transform?Math.round(it.transform[5]):0;if(y!==null&&Math.abs(yy-y)>3){out.push(line);line=""}y=yy;line+=it.str+(it.hasEOL?"\n":"")}out.push(line)}
  return out.join("\n").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()}
 if(!window.mammoth){await loadScript(CV_LIBS.docx)}
 if(!window.mammoth)throw new Error("The DOCX reader did not load.");
 try{return(await mammoth.extractRawText({arrayBuffer:buf})).value.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()}catch(e){throw new Error("This DOCX could not be read. It may be damaged.")}}
/* rules-based structuring, used when AI is unavailable */
function cvRules(text){const H={education:/^(education|academics?|academic (background|qualifications?)|qualifications?)\b/i,experience:/^(work |professional |internship )?(experience|employment|work history|internships?)\b/i,skills:/^(technical |core |key )?(skills|competencies|tools|technologies)\b/i,projects:/^(academic |key |personal )?(projects|achievements|positions of responsibility|extracurriculars?)\b/i};
 const out={education:[],experience:[],skills:[],projects:[]};let cur=null;
 for(const raw of text.split("\n")){const l=raw.trim();if(!l)continue;const head=l.replace(/[:\-–—|]+$/,"").trim();let hit=null;
  if(head.length<40)for(const k in H)if(H[k].test(head)){hit=k;break}
  if(hit){cur=hit;continue}
  if(cur){const parts=cur==="skills"&&l.includes(",")?l.split(/[,;•|]/).map(s=>s.trim()).filter(Boolean):[l.replace(/^[•\-*▪●◦]\s*/,"")];out[cur].push(...parts)}}
 for(const k in out)out[k]=out[k].filter(x=>x.length>1).slice(0,40);return out}
const cvCount=f=>CVF.reduce((n,[k])=>n+(f[k]||[]).length,0);
async function cvStructure(text){let fields=null,method="rules";
 try{if(await aiOn()){const r=await ai(`Extract details from this CV. Use only what is written; never invent anything. Reply with only JSON: {"education":["one line each"],"experience":["role, organisation, dates, one-line impact"],"skills":["..."],"projects":["..."]}\n\nCV:\n${text.slice(0,15000)}`,{tier:"quick"});
  fields={};for(const [k] of CVF)fields[k]=(Array.isArray(r&&r[k])?r[k]:[]).map(String).filter(Boolean).slice(0,40);if(cvCount(fields)>0)method="ai";else fields=null}}catch(e){fields=null}
 if(!fields)fields=cvRules(text);return{fields,method}}
let CVST={state:"idle",msg:""};
function cvPill(){const ok=cvVerify();return CVST.state==="busy"?`<span class="pill">Processing…</span>`:ok?`<span class="pill ok">Uploaded · processed</span>`:CVST.state==="err"?`<span class="pill bad">Upload failed · not uploaded</span>`:`<span class="pill bad">Not uploaded</span>`}
function cvRefreshPill(){document.querySelectorAll("[data-cvpill]").forEach(e=>e.innerHTML=cvPill())}
function cvProg(pct,label){const el=$("#cvstat");if(!el)return;el.innerHTML=`<div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="CV upload progress" style="height:8px;border-radius:6px;background:var(--line,#e5e7eb);overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--blue,#2563eb);transition:width .25s"></div></div><div class="small muted" style="margin-top:6px" role="status">${esc(label)} (${pct}%)</div>`}
const cvStatus=(k,m)=>{CVST={state:k==="busy"?"busy":k==="ok"?"ok":"err",msg:m};cvRefreshPill();const el=$("#cvstat");if(!el)return;el.innerHTML=k==="busy"?loading(m):k==="ok"?`<div class="note ok" role="status">${esc(m)}</div>`:`<div class="note bad" role="alert">${esc(m)}</div>`};
async function cvHandle(file){
 const bad=cvValidate(file);if(bad){cvStatus("err",bad);return false}
 $("#cvname").innerHTML=`<b>${esc(file.name)}</b> · ${(file.size/1024).toFixed(0)} KB`;
 cvStatus("busy","Reading "+file.name+"…");cvProg(25,"Reading "+file.name);
 let text;try{text=await cvRead(file)}catch(e){cvStatus("err",(e&&e.message||"The file could not be read.")+" You can retry or choose another file.");window.__cvLast=file;$("#cvretry")&&($("#cvretry").hidden=false);return false}
 if(text.replace(/\s+/g,"").length<80){cvStatus("err","No readable text was found. This looks like a scanned or image-only file. Export your CV as a text-based PDF or DOCX and upload that.");return false}
 cvStatus("busy","Extracting your details…");cvProg(65,"Extracting your details");
 const {fields,method}=await cvStructure(text);
 if(cvCount(fields)===0){cvStatus("err","Text was read, but no education, experience, skills or projects sections could be recognised. Use clear section headings (Education, Experience, Skills, Projects) and upload again.");return false}
 const prev=S.cv;const rec={fileName:file.name,size:file.size,kind:cvKind(file),text:text.slice(0,20000),fields,method,use:true,updated:Date.now()};
 if(!cvValid(rec)){cvStatus("err","The file was read but the result could not be verified, so it was not saved. "+(prev?"Your previous CV is unchanged.":"No CV is on file.")+" Retry or choose another file.");window.__cvLast=file;$("#cvretry")&&($("#cvretry").hidden=false);return false}
 cvProg(90,"Saving");S.cv=rec;S.cvDiscarded=false;save();
 if(!cvValid(S.cv)||!cvVerify()){S.cv=prev||null;try{save()}catch(e){}cvStatus("err","Could not save the CV in this browser (storage may be blocked). It was not uploaded. Retry or free some browser storage.");window.__cvLast=file;$("#cvretry")&&($("#cvretry").hidden=false);return false}

 toast("CV uploaded");cvDraw(method==="ai"?"Details extracted with AI. Review them below.":"Details extracted by section headings (AI was unavailable). Review them below.");return true}
function cvDraw(msg){const el=$("#cvmain");if(!el)return;if(!msg&&CVST.state==="busy")CVST={state:"idle",msg:""};el.innerHTML=cvBody();if(msg)cvStatus("ok",msg);cvRefreshPill()}
function cvBody(){const c=S.cv;
 return`<div class="grid g2"><div class="card stack"><div class="row between"><h3>${c?"Replace your CV":"Upload your CV"}</h3><span data-cvpill>${cvPill()}</span></div>${S.cvDiscarded&&!c?`<div class="note small">A previously saved CV entry was incomplete or came from an older version, so it was removed. Please upload your CV file.</div>`:""}
 ${window.ROLEVIA_SITE?`<div class="note small">AI features on this website send your CV text and answers to Google’s Gemini API (free tier). Google may use free-tier data to improve its products, so leave out sensitive details you don’t want shared.</div>`:""}<p class="small muted">PDF or DOCX, up to 5 MB. Uploading is the only way to add a CV. The file is read in this browser. Only the extracted text and fields are saved here.</p>
 <label class="drop" for="cf" id="drop"><input id="cf" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" data-act="cvfile" style="position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%"><span><b>Choose a file</b> or drop it here</span></label>
 <div id="cvname" class="small">${c?`Verified on file: <b>${esc(c.fileName)}</b> · ${(c.size/1024).toFixed(0)} KB · uploaded ${fmtDate(c.updated)} · ${cvCount(c.fields)} items extracted`:"No file chosen yet"}</div><div id="cvstat"></div>
 <div class="row"><button class="btn ghost sm" id="cvretry" data-act="cvretry" hidden>Retry</button>${c?`<button class="btn ghost sm" data-act="cvdel">Remove CV</button>`:""}</div></div>
 <div class="card stack"><h3>Extracted details</h3>${c?cvForm(c):`<div class="empty" style="padding:18px"><p class="muted">Nothing yet. Upload a CV and its details appear here for you to check.</p></div>`}</div></div>
 ${c?`<div class="row" style="margin-top:16px"><a class="btn pri" href="#/interviews/new">Continue to interview setup</a><a class="btn ghost" href="#/dashboard">Back to dashboard</a></div>`:""}`}
R(/^\/cv$/,()=>({private:true,nav:"/cv",title:"My CV",html:`${head("My CV","Upload a PDF or DOCX. Your interviews and feedback use it to ask about your real experience.")}<div id="cvmain">${cvBody()}</div>`,mount:()=>{const dz=$("#drop");const stop=e=>{e.preventDefault()};if(dz){["dragover","dragenter"].forEach(ev=>dz.addEventListener(ev,stop));dz.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)cvHandle(f)})}}}));
function cvForm(c){return`<p class="small muted" style="margin-bottom:8px">${c.method==="ai"?"Extracted with AI":"Extracted by section headings"} from <b>${esc(c.fileName)}</b>. Fix anything wrong.</p><form data-form="cvsave" class="stack" novalidate>${CVF.map(([k,l])=>`<div class="field"><label for="cv_${k}">${l} (one per line)</label><textarea id="cv_${k}" name="${k}" style="min-height:80px">${esc((c.fields[k]||[]).join("\n"))}</textarea></div>`).join("")}<label class="row" style="font-weight:500;margin:0"><input type="checkbox" name="use" style="width:auto;min-height:0" ${c.use?"checked":""}> Use my CV to personalise interviews and feedback</label><div class="row"><button class="btn pri" type="submit">Save changes</button></div></form>`}
ACT.cvfile=()=>{};
document.addEventListener("change",e=>{const t=e.target.closest("[data-act=cvfile]");if(t&&t.files&&t.files[0]){const f=t.files[0];window.__cvLast=f;cvHandle(f).then(ok=>{if(ok&&$("#su")&&typeof drawSetup==="function")drawSetup()}).finally(()=>{try{t.value=""}catch(x){}})}});
ACT.cvretry=()=>{if(window.__cvLast)cvHandle(window.__cvLast).then(ok=>{if(ok&&$("#su")&&typeof drawSetup==="function")drawSetup()})};
FORM.cvsave=(f,d)=>{if(!S.cv)return;S.cv.fields=Object.fromEntries(CVF.map(([k])=>[k,(d[k]||"").split("\n").map(x=>x.trim()).filter(Boolean)]));S.cv.use=!!d.use;S.cv.updated=Date.now();save();cvStatus("ok","Changes saved.")};
ACT.cvdel=t=>{if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Confirm remove";return}S.cv=null;S.cvDiscarded=false;CVST={state:"idle",msg:""};window.__cvLast=null;if(S.research)delete S.research.cvAnalysis;save();toast("CV removed");cvDraw();if($("#su")&&typeof drawSetup==="function")drawSetup()};

/* ---------- progress ---------- */
function lineChart(pts){if(pts.length<1)return"";const W=640,H=220,L=36,B=28,T=12,R_=12,x=i=>pts.length==1?(L+(W-L-R_)/2):L+i*(W-L-R_)/(pts.length-1),y=v=>T+(100-v)/100*(H-T-B);
 const grid=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R_}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("");
 const line=pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.v)}`).join(" ");
 return`<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Readiness score over time" style="min-width:420px;width:100%;height:auto">${grid}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="var(--accent)"/><text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(p.l)}</text>`).join("")}</svg></div>`}
R(/^\/progress$/,()=>{const rs=[...S.reports].reverse(),gd=S.gdReports.filter(r=>!r.limited&&r.criteria);
 const dimAvg=DIMS.map(([k,l])=>[l,avg(rs.map(r=>+r.dims[k]).filter(x=>x>=0))]);
 const miss={};S.reports.forEach(r=>(r.revision||[]).forEach(t=>{const k=String(t).trim();miss[k]=(miss[k]||0)+1}));const topics=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const gdPts=gd.slice().reverse().map(r=>({l:fmtDate(r.date).slice(0,6),v:avg(r.criteria.map(c=>c.score).filter(x=>x!=null))})).filter(p=>p.v!=null);
 return{private:true,nav:"/progress",title:"Progress",html:`${head("Progress","Built only from your saved sessions.")}
${!rs.length&&!S.gdReports.length?`<div class="empty"><h3>No data yet</h3><p class="muted">Complete a mock interview or a GD and your charts appear here. Nothing is pre-filled.</p><p style="margin-top:12px" class="row" style="justify-content:center">${A("/interviews/new","Start an interview","btn pri")} ${A("/gd","Find a GD","btn ghost")}</p></div>`:`
<div class="grid g2"><div class="card stack" style="grid-column:1/-1"><h3>Readiness score over time</h3>${rs.length?lineChart(rs.map(r=>({v:r.overall,l:fmtDate(r.date).slice(0,6)}))):`<p class="muted">No interviews yet.</p>`}<p class="small muted">${rs.length} attempt${rs.length==1?"":"s"}. Practice scores only.</p></div>
<div class="card stack"><h3>Skill-wise average</h3>${rs.length?dimAvg.map(([l,v])=>`<div><div class="row between small"><span>${l}</span><b>${v??"–"}</b></div><div class="bar"><i style="width:${v||0}%"></i></div></div>`).join(""):`<p class="muted">Appears after your first interview.</p>`}</div>
<div class="card stack"><h3>GD performance</h3>${gdPts.length?lineChart(gdPts)+`<p class="small muted">Average of scored criteria per session.</p>`:`<p class="muted">${S.gdReports.length?"Your GD reports had too little evidence to score.":"No scored GDs yet."}</p>`}</div>
<div class="card stack"><h3>Frequently missed topics</h3>${topics.length?jl(topics,([t,n])=>`<li>${esc(t)} <span class="pill">${n}×</span></li>`):`<p class="muted">Shows after your first report.</p>`}</div>
<div class="card stack"><h3>Revision recommendations</h3>${S.reports[0]?jl(S.reports[0].improvements.slice(0,4)):`<p class="muted">Shows after your first report.</p>`}${S.reports[0]?`<p>${A("/reports/"+S.reports[0].id,"Open latest report","btn ghost sm")}</p>`:""}</div></div>`}`}});

/* ---------- settings ---------- */
R(/^\/settings$/,()=>({private:true,nav:"/settings",title:"Account Settings",html:`${head("Account settings")}
<div class="grid g2"><div class="card stack"><h3>Profile</h3><div class="kv"><span class="muted">Name</span><span>${esc(S.user.name)}</span><span class="muted">Email</span><span>${esc(S.user.email)}</span><span class="muted">Level</span><span>${esc(S.profile.level||"Not set")}</span><span class="muted">Target roles</span><span>${esc(S.profile.roles.join(", ")||"None")}</span><span class="muted">Target companies</span><span>${esc(S.profile.targets.join(", ")||"None")}</span></div><div>${A("/onboarding","Edit preferences","btn ghost sm")}</div></div>
<div class="card stack"><h3>Plan</h3><p><b>Free</b> · 3 AI mock interviews free for a year and 1 GD per month. ${A("/pricing","See plans")}</p><p class="small muted">Billing is not configured. No payment method is held.</p></div>
<div class="card stack"><h3>Privacy and CV</h3><p class="small muted">Use of CV for personalisation is controlled in ${A("/cv","My CV")}. Reports and transcripts are private to this browser.</p><label class="row" style="font-weight:500;margin:0"><input type="checkbox" data-act="cvuse" style="width:auto;min-height:0" ${S.cv&&S.cv.use?"checked":""} ${S.cv?"":"disabled"}> Use CV details in interviews</label></div>
<div class="card stack"><h3>Your data</h3><p class="small muted">Export everything stored in this browser, or delete it for good.</p><div class="row"><button class="btn ghost sm" data-act="export">Export data</button><button class="btn ghost sm" style="color:var(--bad)" data-act="wipe">Delete all my data</button></div><div id="setstat"></div></div></div>`}));
document.addEventListener("change",e=>{const t=e.target.closest("[data-act=cvuse]");if(t&&S.cv){S.cv.use=t.checked;save()}});
ACT.cvuse=()=>{};
ACT.export=async()=>{const st=$("#setstat");let dl=null;try{dl=await window.claude.use("downloads")}catch(e){}
 if(!dl){st.innerHTML=`<div class="note small">File download is unavailable in this view.</div>`;return}
 try{await dl.save({filename:"rolevia-data.json",data:JSON.stringify(S,null,2)})}catch(e){st.innerHTML=`<div class="note small">Export was cancelled or blocked.</div>`}};
ACT.wipe=t=>{if(!t.dataset.sure){t.dataset.sure=1;t.textContent="Confirm: delete everything";return}try{localStorage.removeItem(KEY)}catch(e){}mem=null;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,{user:null,profile:{level:"",roles:[],industries:[],goals:[],targets:[]},cv:null,bookmarks:[],lists:[],qlib:[],reports:[],sessions:[],companies:{},recent:[],gdReports:[],gdBookings:{}});toast("All local data deleted");go("/")};

/* ---------- boot ---------- */
if(typeof SITE!=="undefined"&&SITE.on)SITE.boot();else{render();initCaps().then(()=>{if(/^#\/(gd|dashboard)/.test(location.hash))render()})}
</script>

</body>
</html>
