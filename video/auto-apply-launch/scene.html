  if (capId !== s.id) { capId = s.id; capEl.innerHTML = s.cap.split(' ').map(w => `<span>${w}</span>`).join(' '); capWords = [...capEl.children]; }
  const total = s.cap.length; let acc = 0;
  capWords.forEach((w, i) => { const wt = s.start + (s.end - s.start) * (acc / total); acc += w.textContent.length + 1;
    w.className = t >= wt ? (i === capWords.length - 1 || t < s.start + (s.end - s.start) * (acc / total) ? 'on now' : 'on') : ''; });
}
function setKicker(t) {
  const scenes = [
    {a: S.apply.start - .2, b: S.pivot.start + .2, k: 'AUTO APPLY', h: 'Applications, sent for you'},
    {a: S.research.start, b: S.practise.start - .1, k: 'COMPANY RESEARCH', h: portrait ? 'Know the company' : 'Know the company'},
    {a: S.practise.start, b: S.cta.start - .2, k: 'AI MOCK INTERVIEW', h: 'Practise out loud'},
  ];
  const sc = scenes.find(x => t >= x.a && t <= x.b);
  if (!sc) { kicker.style.opacity = 0; return; }
  const o = win(t, sc.a, sc.b, .35, .3);
  if (kicker.dataset.k !== sc.k) { kicker.dataset.k = sc.k; kicker.querySelector('.k').textContent = sc.k; kicker.querySelector('.h').textContent = sc.h; }
  kicker.style.opacity = o; kicker.style.transform = `translateY(${(1 - eout(seg(t, sc.a, sc.a + .5))) * 30}px)`;
}

/* ---------- frame ---------- */
const tmp = new THREE.Vector3();
window.renderAt = (t) => {
  // camera: shake building through the hook, slow drift afterwards
  const shake = .05 * seg(t, h0, h1) * (1 - seg(t, S.reveal.start, S.reveal.start + .3));
  cam.position.set(Math.sin(t * .23) * .25 + Math.sin(t * 37) * shake, Math.cos(t * .19) * .15 + Math.cos(t * 29) * shake, DIST - .6 * seg(t, S.cta.start - .3, TL.duration));
  cam.lookAt(0, 0, 0);

  // pile of forms, then the vortex
  const v0 = S.reveal.start - .4, v1 = S.reveal.start + .35;
  for (const c of pile) {
    const m = c.m; if (t < c.a || t > v1) { m.visible = false; continue; } m.visible = true;
    const p = eback(seg(t, c.a, c.a + .35)), vp = eio(seg(t, v0, v1));
    const x = c.x, y = c.y + Math.sin(t * 1.3 + c.ph) * .08, z = c.z;
    const ang = c.ang + vp * Math.PI * 3, rad = Math.hypot(x, y) * (1 - vp);
    const sx = vp > 0 ? Math.cos(ang) * rad : x, sy = vp > 0 ? Math.sin(ang) * rad : y;
    m.position.set(THREE.MathUtils.lerp(x, sx, Math.min(1, vp * 3)), THREE.MathUtils.lerp(y, sy, Math.min(1, vp * 3)), z * (1 - vp));
    m.rotation.set(c.rx * (1 - vp), c.ry * (1 - vp), c.rz + vp * 5 + Math.sin(t + c.ph) * .05);
    m.scale.setScalar(Math.max(.001, p * (1 - vp)));
  }

  // queue of applications flying into the portal
  for (const c of queue) {
    const u = seg(t, c.l, c.l + 1.45), m = c.m;
    if (u <= 0 || u >= 1) { m.visible = false; continue; } m.visible = true;
    const e = eio(u); m.position.copy(bez(e));
    const tan = bez(Math.min(1, e + .01)).sub(bez(Math.max(0, e - .01)));
    m.rotation.set(-.15, .35 * (1 - e), Math.atan2(tan.y, tan.x) * .25);
    m.material.map = u > .5 ? texApplied : texBlank;
    const pop = u > .5 ? 1 + .18 * Math.exp(-(u - .5) * 18) : 1;
    m.scale.setScalar(pop * Math.min(eout(seg(u, 0, .12)), 1 - eio(seg(u, .78, 1))) + .001);
  }

  // portal
  const pv = win(t, S.apply.start - .5, S.pivot.start + .5, .5, .5);
  portal.visible = pv > 0;
  let pulse = 0; for (const c of queue) { const arr = c.l + 1.45; if (t > arr) pulse += Math.exp(-(t - arr) * 7); }
  portal.scale.setScalar(Math.max(.001, eback(pv) * (1 + .1 * pulse)));
  ring.rotation.z = t * .6; ring2.rotation.z = -t * .4; ring2.rotation.x = Math.sin(t) * .3;
  ringMat.opacity = pv; ring2.material.opacity = .6 * pv; disc.material.opacity = pv * (.7 + .3 * pulse);

  // shockwave on the reveal
  const sp = seg(t, S.reveal.start - .05, S.reveal.start + 1.1);
  shock.visible = sp > 0 && sp < 1; shock.scale.setScalar(.2 + eout(sp) * U * 1.1); shock.material.opacity = 1 - sp;

  // particles
  let k = 0; for (let i = 0; i < KF.length; i++) if (t >= KF[i].t) k = i;
  const kf = KF[k], from = TG[kf.from || KF[Math.max(0, k - 1)].to], to = TG[kf.to];
  for (let i = 0; i < N; i++) {
    const p = k === 0 ? 1 : eout(clamp((t - kf.t - delay[i] * kf.spread) / kf.dur));
    const sw = k === 0 ? 0 : Math.sin(p * Math.PI) * kf.swirl;
    const drift = (kf.to === 'scatter' ? .25 : .025);
    for (let a = 0; a < 3; a++) {
      const j = i * 3 + a;
      pos[j] = from[j] + (to[j] - from[j]) * p + dirs[j] * sw + Math.sin(t * (.5 + delay[i]) + i * (a + 1)) * drift;
    }
  }
  pGeo.attributes.position.needsUpdate = true;
  const formed = (kf.to === 'scatter' || k === 0) ? 0 : clamp((t - kf.t) / kf.dur);
  pMat.uniforms.uOpacity.value = .5 + (portrait ? .1 : .3) * formed;
  pMat.uniforms.uGain.value = 1 + .15 * formed;
  pMat.uniforms.uOpacity.value *= 1 - .8 * win(t, S.practise.start - .2, S.cta.start - .2, .4, .4);

  // company panel
  const rp = win(t, S.research.start - .2, S.practise.start + .15, .8, .6);
  panel.visible = rp > 0;
  if (panel.visible) {
    drawPanel(t);
    const enter = eout(seg(t, S.research.start - .2, S.research.start + .7)), exit = eio(seg(t, S.practise.start - .45, S.practise.start + .15));
    panel.position.set((portrait ? 0 : VW * .02) + exit * VW * .8, (portrait ? VH * .03 : -VH * .01) + Math.sin(t * 1.2) * .05, -6 * (1 - enter));
    panel.rotation.set(-.08 + Math.sin(t * .7) * .03, (1 - enter) * 1.1 - .18 + Math.sin(t * .5) * .05 - exit * .9, .02);
    panel.material.opacity = Math.min(enter * 1.3, 1);
  }

  // AI interviewer orb and voice ring
  const ov = win(t, S.practise.start - .3, S.cta.start, .6, .5);
  orbG.visible = ov > 0;
  if (orbG.visible) {
    orbG.scale.setScalar(Math.max(.001, eback(seg(t, S.practise.start - .3, S.practise.start + .4)) * (1 - eio(seg(t, S.cta.start - .5, S.cta.start)))));
    orb.rotation.set(t * .7, t * .9, 0); orb.material.opacity = ov;
    core.scale.setScalar(1 + .12 * Math.sin(t * 8)); core.material.opacity = ov;
    // the interviewer "speaks" while its bubbles appear
    const talk = Math.max(win(t, bubT[0] - .1, bubT[1] - .1, .15, .2), win(t, bubT[2] - .1, bubT[2] + 1.8, .15, .3)) * .85 + .15;
    for (let i = 0; i < NB; i++) {
      const b = bars[i], a = b.userData.a + t * .25;
      const amp = .25 + talk * (.5 + .5 * Math.sin(i * .9 + t * 11) * Math.sin(i * .31 - t * 6.3)) * 1.6;
      const r0 = U * .155 + amp * U * .05 / 2;
      b.position.set(Math.cos(a) * r0, Math.sin(a) * r0, 0); b.rotation.z = a - Math.PI / 2;
      b.scale.set(1, Math.max(.05, amp), 1); b.material.opacity = ov;
    }
  }

  // bloom: burst on the reveal and the end card
  bloom.strength = .55 + .9 * Math.exp(-Math.max(0, t - S.reveal.start) * 3) * (t > S.reveal.start - .1 ? 1 : 0) + .35 * Math.exp(-Math.max(0, t - S.cta.start) * 3) * (t > S.cta.start - .1 ? 1 : 0);

  // DOM overlays
  flash.style.opacity = t > S.reveal.start - .08 ? .85 * Math.exp(-(t - S.reveal.start + .08) * 7) : 0;
  brand.style.opacity = win(t, S.apply.start - .2, S.cta.start, .5, .4) * .9;
  setCaption(t); setKicker(t);
  agEls.forEach((el, i) => { const p = seg(t, agT[i] - .05, agT[i] + .35), o = t < agT[i] - .05 ? 0 : Math.min(1, p * 3) * (1 - seg(t, h1 - .2, h1 + .2));
    el.style.opacity = o * .9; el.style.transform = `translate(-50%,-50%) translate(${(i - 1) * 4}%, ${(i - 1) * 85 + (portrait ? -60 : -20)}%) rotate(${(i - 1) * -4}deg) scale(${.6 + .4 * eback(p)})`; });
  ['b0', 'b1', 'b2'].forEach((id, i) => { const el = $(id), p = eout(seg(t, bubT[i], bubT[i] + .4)), o = t < bubT[i] ? 0 : p * (1 - seg(t, S.cta.start - .5, S.cta.start - .1));
    el.style.opacity = o; el.style.transform = `translateY(${(1 - p) * 26}px) scale(${.94 + .06 * p})`; });
  const cp = seg(t, S.cta.start + .6, S.cta.start + 1.2);
  cta.style.opacity = eout(cp); cta.style.transform = `translateY(${(1 - eout(cp)) * 30}px)`;

  composer.render();
  return true;
};
window.ready = true;
</script>
